<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>兰州学校数据看板 · 学员分层续班潜力</title>
<style>
@font-face{font-family:'FZDaBiaoSong';src:local('方正大标宋简体'),local('FZDaBiaoSongJianTi'),local('FZDBSJW--GB1-0'),url('FZDBSJW.woff') format('woff');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-0:#f0f2f8;--bg-1:#ffffff;--bg-2:#e8edf5;
  /* Liquid Glass 三层结构：玻璃效果层 / 半透明填充层 / 阴影层 */
  --glass:rgba(255,255,255,.45);--glass-brd:rgba(255,255,255,.3);
  --glass-fill:rgba(255,255,255,.35);
  --glass-hi:rgba(0,122,255,.08);
  --glass-shadow:rgba(0,0,0,.04);
  --liquid-blur:blur(36px) saturate(220%);   /* 玻璃效果层：更强模糊+饱和度，智能吸取下层颜色 */
  --liquid-blur-sm:blur(20px) saturate(180%);
  --liquid-blur-lg:blur(52px) saturate(250%);
  --liquid-fill:rgba(255,255,255,.22);       /* 半透明填充层：更低透明度，壁纸颜色更易透出 */
  --liquid-ripple:radial-gradient(circle,rgba(255,255,255,.4) 0%,transparent 60%); /* 鼠标追踪镜面高光层 */
  --liquid-fill-strong:rgba(255,255,255,.4);
  --liquid-stroke:1px solid rgba(255,255,255,.4);
  --liquid-highlight:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.15); /* 高光内描边：上亮下暗，模拟真实玻璃折射 */
  --liquid-specular:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 48%,rgba(255,255,255,.08) 52%,transparent 65%); /* 流光高光层 */
  --text-0:#1a1a2e;--text-1:#3d3d5c;--text-2:#6e6e80;--text-3:#9e9eaf;
  --brand:#007AFF;--brand-2:#5856D6;--brand-glow:rgba(0,122,255,.22);
  --accent:#00C7BE;--accent-2:#30D5C8;--accent-light:rgba(0,199,190,.1);
  --green:#34C759;--green-bg:rgba(52,199,89,.12);
  --gold:#FF9500;--gold-bg:rgba(255,149,0,.12);
  --blue:#007AFF;--blue-bg:rgba(0,122,255,.10);
  --red:#FF3B30;--red-bg:rgba(255,59,48,.10);
  --gray:#8E8E93;--gray-bg:rgba(142,142,147,.12);
  /* iOS Liquid Glass 大圆角：更大更圆润 */
  --radius:24px;--radius-sm:18px;--radius-lg:32px;--radius-xl:42px;--radius-2xl:52px;
  --shadow:0 4px 24px rgba(0,0,0,.08),0 0 0 1px rgba(255,255,255,.15) inset,var(--liquid-highlight);
  --shadow-lg:0 20px 56px rgba(0,0,0,.16),0 0 0 1px rgba(255,255,255,.22) inset,var(--liquid-highlight);
  --shadow-glow:0 8px 28px rgba(0,122,255,.18);
  --transition:cubic-bezier(.4,0,.2,1);
  --font:'FZDaBiaoSong','方正大标宋简体',-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;
  --mono:'FZDaBiaoSong','方正大标宋简体',"SF Mono","PingFang SC",monospace;
  /* 图表字体：保留中文易读性 */
  --chart-font:'FZDaBiaoSong','方正大标宋简体','Noto Sans SC','PingFang SC',-apple-system,sans-serif;
}
html{font-size:14px;scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg-0);color:var(--text-0);
  min-height:100vh;overflow-x:hidden;
}
/* iOS Liquid Glass 动态渐变流动壁纸：更鲜艳的色彩，玻璃会智能吸取 */
body::before{
  content:'';position:fixed;inset:-10%;z-index:-1;
  background:
    radial-gradient(ellipse 60% 50% at 12% 8%,rgba(0,122,255,.25),transparent 60%),
    radial-gradient(ellipse 50% 40% at 88% 22%,rgba(88,86,214,.22),transparent 60%),
    radial-gradient(ellipse 60% 45% at 50% 100%,rgba(0,199,190,.20),transparent 60%),
    radial-gradient(ellipse 45% 35% at 80% 80%,rgba(255,149,0,.15),transparent 60%),
    radial-gradient(ellipse 40% 30% at 18% 75%,rgba(52,199,89,.15),transparent 60%),
    radial-gradient(ellipse 35% 25% at 65% 45%,rgba(255,94,138,.12),transparent 60%),
    linear-gradient(135deg,#eef2fb 0%,#f5f0fa 50%,#eaf6f4 100%);
  background-size:200% 200%,220% 220%,200% 200%,220% 220%,200% 200%,200% 200%,100% 100%;
  animation:liquidFlow 18s ease-in-out infinite alternate;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 50%,rgba(255,255,255,.06) 100%);
}
@keyframes liquidFlow{
  0%{background-position:0% 0%,100% 0%,50% 100%,100% 100%,0% 100%,30% 50%,0 0}
  50%{background-position:30% 20%,70% 30%,60% 80%,80% 70%,20% 80%,50% 30%,0 0}
  100%{background-position:60% 40%,40% 60%,40% 60%,60% 40%,40% 60%,70% 70%,0 0}
}

/* Liquid Glass 流光高光层：在玻璃容器上添加移动的镜面反射 */
.kpi,.binned-card,.chart-card,.trend-section,.rules-section,.table-wrap,.status-bar,.tabs,.filter-bar{
  position:relative;
}
.kpi::after,.binned-card::after,.chart-card::after,.trend-section .trend-body::after,.rules-section::after,.table-wrap::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:var(--liquid-specular);
  background-size:300% 100%;
  opacity:0;transition:opacity .5s var(--transition);
  animation:specularFlow 8s ease-in-out infinite;
}
.kpi:hover::after,.binned-card:hover::after,.chart-card:hover::after,.rules-section:hover::after,.table-wrap:hover::after{
  opacity:1;animation-duration:3s;
}
@keyframes specularFlow{
  0%,100%{background-position:0% 0%}
  50%{background-position:100% 0%}
}

/* iOS Liquid Glass 鼠标追踪镜面高光：::before 跟随光标的径向高光，模拟真实玻璃折射 */
.kpi,.binned-card,.chart-card{
  --mx:50%;--my:50%;
}
.kpi::before,.binned-card::before,.chart-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:radial-gradient(circle 180px at var(--mx) var(--my),rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 35%,transparent 60%);
  opacity:0;transition:opacity .4s var(--transition);
  mix-blend-mode:screen;
}
.kpi:hover::before,.binned-card:hover::before,.chart-card:hover::before{opacity:1}

.wrap{max-width:1680px;margin:0 auto;padding:16px 24px 60px}

/* Header */
.header{display:flex;align-items:center;justify-content:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;position:relative}
.header-left{text-align:center}
.header-left h1{
  font-size:2rem;font-weight:900;letter-spacing:-0.5px;
  display:inline-block;padding:14px 40px;border-radius:999px;
  background:linear-gradient(120deg,#2b3a5c,#5b8cff 60%,#8a6cff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  border:var(--liquid-stroke);
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow),var(--liquid-highlight);position:relative;overflow:hidden;
  text-shadow:0 2px 8px rgba(91,140,255,.15)}
.header-left h1::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:var(--liquid-fill)}
.header-left h1::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:var(--liquid-specular);background-size:300% 100%;opacity:.5;
  animation:specularFlow 8s ease-in-out infinite}
.header-left .sub{font-size:.78rem;color:var(--text-2);margin-top:8px;font-weight:500}
.header-right{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.data-badge{
  padding:6px 14px;border-radius:999px;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  font-size:.72rem;color:var(--text-1);display:flex;align-items:center;gap:6px;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:0 2px 12px rgba(0,0,0,.06),var(--liquid-highlight);
  transition:all .3s var(--transition);
}
.data-badge:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.10),var(--liquid-highlight)}
.data-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Status Filter (top) */
.status-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
  padding:12px 18px;border-radius:var(--radius);
  background:var(--liquid-fill);border:var(--liquid-stroke);
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
}
.status-bar .label{font-size:.8rem;color:var(--text-2);font-weight:600;white-space:nowrap}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.spill{
  position:relative;overflow:hidden;
  padding:7px 18px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.5);color:var(--text-1);font-size:.78rem;cursor:pointer;
  transition:all .25s var(--transition);font-family:var(--font);font-weight:500;
  display:flex;align-items:center;gap:4px;
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
}
.spill::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.4),transparent 50%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.spill:hover::after{opacity:1}
.spill:hover{border-color:var(--brand-glow);background:rgba(255,255,255,.8);transform:translateY(-1px)}
.spill.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--brand-glow);
}
.spill .cnt{font-size:.68rem;opacity:.75;font-weight:400}
.spill.disabled{opacity:.4;cursor:not-allowed}
.spill.disabled:hover{border-color:var(--glass-brd);background:rgba(255,255,255,.5);transform:none}

/* KPI Cards */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{
  position:relative;overflow:hidden;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius);padding:16px 18px;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
  transition:transform .3s var(--transition),box-shadow .3s var(--transition),border-color .3s var(--transition);
}
.kpi::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 30% 0%,rgba(255,255,255,.5),transparent 60%);
  opacity:.6;
}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:rgba(255,255,255,.45)}
.kpi{text-align:center}
.kpi .label{font-size:.68rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;text-align:center}
.kpi .val{font-size:1.75rem;font-weight:700;font-family:var(--mono);color:var(--text-0);position:relative;z-index:1;text-align:center}
.kpi .val.brand{color:var(--brand)}
.kpi .val.green{color:var(--green)}
.kpi .val.gold{color:var(--gold)}
.kpi .val.accent{color:var(--accent)}
.kpi .sub{font-size:.68rem;color:var(--text-3);margin-top:2px;position:relative;z-index:1;text-align:center}

/* Binned Charts */
.binned-charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:32px}
.binned-card{
  position:relative;overflow:hidden;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius);padding:16px;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
  transition:transform .3s var(--transition),box-shadow .3s var(--transition),border-color .3s var(--transition);
}
.binned-card h4{font-size:.9rem;font-weight:700;margin-bottom:12px;color:var(--text-0);display:flex;align-items:center;gap:6px}
.binned-card .chart-box{position:relative;height:300px}

/* Tabs */
.tabs{
  display:flex;gap:4px;margin-bottom:16px;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius);padding:5px;width:fit-content;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
}
.tab{
  position:relative;overflow:hidden;
  padding:8px 20px;border-radius:var(--radius-sm);border:none;
  background:transparent;color:var(--text-2);font-size:.82rem;font-weight:500;
  cursor:pointer;transition:all .25s var(--transition);font-family:var(--font);
}
.tab:hover{color:var(--text-0);background:var(--glass-hi)}
.tab.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;box-shadow:0 4px 14px var(--brand-glow);
}

/* Filter Bar */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filter-label{font-size:.78rem;color:var(--text-2);font-weight:600}
.pill-group{display:flex;gap:5px}
.pill{
  position:relative;overflow:hidden;
  padding:6px 14px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.55);color:var(--text-1);font-size:.75rem;cursor:pointer;
  transition:all .25s var(--transition);font-family:var(--font);font-weight:500;
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
}
.pill::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.35),transparent 50%);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.pill:hover::after{opacity:1}
.pill:hover{border-color:var(--brand-glow);transform:translateY(-1px)}
.pill.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--brand-glow);
}
.pill .cnt{font-size:.65rem;opacity:.7;margin-left:3px}
.search-box{
  flex:1;min-width:180px;max-width:280px;
  padding:7px 14px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.65);color:var(--text-0);font-size:.78rem;
  font-family:var(--font);
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
  transition:all .25s var(--transition);
}
.search-box:focus{outline:none;border-color:var(--brand-glow);box-shadow:0 0 0 4px var(--brand-glow)}
.search-box::placeholder{color:var(--text-3)}

/* Dropdown */
.dropdown{
  position:relative;display:inline-block;
}
.dropdown-btn{
  position:relative;overflow:hidden;
  padding:7px 16px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.6);color:var(--text-1);font-size:.78rem;cursor:pointer;
  font-family:var(--font);font-weight:500;display:flex;align-items:center;gap:6px;
  transition:all .25s var(--transition);
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
}
.dropdown-btn:hover{border-color:var(--brand-glow);transform:translateY(-1px)}
.dropdown-btn .arrow{font-size:.6rem;transition:transform .2s}
.dropdown.open .dropdown-btn .arrow{transform:rotate(180deg)}
.dropdown-menu{
  position:absolute;top:100%;left:0;margin-top:6px;
  background:var(--liquid-fill-strong);border:var(--liquid-stroke);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  backdrop-filter:var(--liquid-blur-lg);-webkit-backdrop-filter:var(--liquid-blur-lg);
  max-height:320px;overflow-y:auto;min-width:200px;z-index:50;
  display:none;padding:4px;
}
.dropdown.open .dropdown-menu{display:block}
.dropdown-item{
  padding:8px 14px;font-size:.78rem;cursor:pointer;color:var(--text-1);
  transition:background .15s;font-family:var(--font);border-radius:var(--radius-sm);
}
.dropdown-item:hover{background:var(--glass-hi)}
.dropdown-item.selected{color:var(--brand);font-weight:600;background:var(--glass-hi)}

/* Table */
.table-wrap{
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius-lg);overflow:hidden;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
}
.table-scroll{overflow-x:auto;max-height:68vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.78rem}
thead{position:sticky;top:0;z-index:10}
thead th{
  background:rgba(255,255,255,.96);backdrop-filter:var(--liquid-blur);
  padding:10px 12px;text-align:center;font-weight:600;color:var(--text-1);
  white-space:nowrap;border-bottom:1px solid var(--glass-brd);
  cursor:pointer;user-select:none;transition:color .15s,background .15s;
}
thead th:hover{color:var(--brand);background:rgba(255,255,255,1)}
thead th .sort-i{font-size:.58rem;opacity:.4;margin-left:2px}
thead th.sorted .sort-i{opacity:1;color:var(--brand)}
thead th.sorted{color:var(--brand)}
thead tr.grp-row th{
  padding:5px 8px;font-size:.66rem;font-weight:700;text-align:center;
  border-bottom:1px solid var(--glass-brd);
}
thead tr.grp-row th.g-basic{background:rgba(0,122,255,1);color:#fff}
thead tr.grp-row th.g-count{background:rgba(0,199,190,1);color:#fff}
thead tr.grp-row th.g-key{background:rgba(52,199,89,1);color:#fff}
thead tr.grp-row th.g-grade{background:rgba(255,149,0,1);color:#fff}
thead tr.grp-row th.g-comm{background:rgba(88,86,214,1);color:#fff}
thead tr.grp-row th.g-traj{background:rgba(0,122,255,1);color:#fff}
thead tr.grp-row th.g-stick{background:rgba(48,213,200,1);color:#fff}
tbody tr{border-bottom:1px solid rgba(0,0,0,.03);transition:background .2s,box-shadow .2s}
tbody tr:hover{background:rgba(0,122,255,.06);box-shadow:inset 0 0 0 1px rgba(0,122,255,.10)}
tbody td{padding:8px 12px;white-space:nowrap;color:var(--text-1);text-align:center;vertical-align:middle}
tbody td.num{font-family:var(--mono);text-align:center}
tbody td.rank{font-weight:600;color:var(--text-0)}
tbody td.rank .badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;font-size:.68rem;
}
.rank-1 .badge{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff}
.rank-2 .badge{background:linear-gradient(135deg,#C0C0C0,#A8A8A8);color:#fff}
.rank-3 .badge{background:linear-gradient(135deg,#CD7F32,#B87333);color:#fff}
.rank-other .badge{background:var(--bg-2);color:var(--text-2)}

/* Grade badges */
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;font-size:.68rem;font-weight:600;padding:0 4px}
.grade-S{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(255,149,0,.25)}
.grade-A{background:var(--green-bg);color:var(--green);border:1px solid rgba(52,199,89,.25)}
.grade-B{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(0,122,255,.2)}
.grade-C{background:var(--gray-bg);color:var(--gray);border:1px solid rgba(142,142,147,.2)}

/* Student tags */
.stag{display:inline-flex;align-items:center;font-size:.65rem;font-weight:500;padding:1px 6px;border-radius:4px;margin-right:3px;white-space:nowrap}
.stag-tenure{background:rgba(88,86,214,.1);color:var(--brand-2);border:1px solid rgba(88,86,214,.2)}
.stag-progress{background:rgba(52,199,89,.1);color:var(--green);border:1px solid rgba(52,199,89,.2)}
.stag-absent{background:rgba(255,59,48,.08);color:var(--red);border:1px solid rgba(255,59,48,.2)}
.stag-comm-S{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(255,149,0,.25)}
.stag-comm-A{background:var(--green-bg);color:var(--green);border:1px solid rgba(52,199,89,.25)}
.stag-comm-B{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(0,122,255,.2)}
.stag-comm-C{background:var(--gray-bg);color:var(--gray);border:1px solid rgba(142,142,147,.2)}

/* Progress bars */
.bar-wrap{display:flex;align-items:center;gap:6px;min-width:120px;justify-content:flex-start;width:100%}
.bar{display:flex;width:80px;height:10px;background:rgba(0,0,0,.06);border-radius:5px;overflow:hidden;flex-shrink:0;border:1px solid rgba(0,0,0,.04)}
.bar-fill{display:block;height:100%;border-radius:4px;transition:width .3s;min-width:2px}
.bar-val{font-size:.72rem;color:var(--text-1);white-space:nowrap;min-width:42px;text-align:left}
.bar-fill.green{background:linear-gradient(90deg,#34C759,#30D158)}
.bar-fill.gold{background:linear-gradient(90deg,#FF9500,#FFB340)}
.bar-fill.brand{background:linear-gradient(90deg,#007AFF,#5856D6)}
.bar-fill.red{background:linear-gradient(90deg,#FF3B30,#FF6961)}

/* Tag filter (multi-select) */
.tag-filter{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag-btn{
  position:relative;overflow:hidden;
  padding:4px 10px;border-radius:8px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.5);color:var(--text-2);font-size:.66rem;cursor:pointer;
  transition:all .2s var(--transition);font-family:var(--font);font-weight:500;white-space:nowrap;
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
}
.tag-btn:hover{color:var(--text-0);transform:translateY(-1px)}
.tag-btn:active{transform:scale(.96)}
/* 多选选中态：更明显的视觉区分（实心+发光阴影） */
.tag-btn.active.tenure{background:rgba(88,86,214,.22);color:var(--brand-2);border-color:rgba(88,86,214,.55);box-shadow:0 2px 10px rgba(88,86,214,.25),inset 0 1px 1px rgba(255,255,255,.4);font-weight:700}
.tag-btn.active.progress{background:rgba(52,199,89,.22);color:var(--green);border-color:rgba(52,199,89,.55);box-shadow:0 2px 10px rgba(52,199,89,.25),inset 0 1px 1px rgba(255,255,255,.4);font-weight:700}
.tag-btn.active.absent{background:rgba(255,59,48,.18);color:var(--red);border-color:rgba(255,59,48,.55);box-shadow:0 2px 10px rgba(255,59,48,.22),inset 0 1px 1px rgba(255,255,255,.4);font-weight:700}
.tag-btn.active.comm{background:rgba(255,149,0,.22);color:var(--gold);border-color:rgba(255,149,0,.55);box-shadow:0 2px 10px rgba(255,149,0,.25),inset 0 1px 1px rgba(255,255,255,.4);font-weight:700}
.tag-btn.active.all{background:var(--glass-hi);color:var(--brand);border-color:var(--brand-glow);box-shadow:0 2px 10px rgba(0,122,255,.18)}
/* 多选指示符：选中的非“全部”按钮前显示 ✓ */
.tag-btn.active:not(.all)::before{content:'✓ ';font-weight:700}
/* 无数据的标签直接隐藏 */
.tag-btn.no-data{display:none}

/* Student tags cell */
.tags-cell{width:200px;max-width:200px;vertical-align:middle;text-align:left;white-space:normal;padding:8px 10px 8px 12px !important;border-right:2px solid rgba(0,122,255,.18);overflow:hidden}
.tags-cell .tag-row{display:flex;flex-wrap:wrap;gap:3px;max-width:100%;overflow:hidden;justify-content:flex-start;align-items:center}
.tags-cell .stag{margin-bottom:2px;font-size:.62rem;padding:1px 5px}
.name-cell{vertical-align:middle;text-align:center;white-space:nowrap;padding:8px 12px 8px 12px !important;min-width:64px;border-left:none}

.teacher-link{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:500}
.teacher-link:hover{text-decoration:underline}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(10px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex;animation:modalIn .25s var(--transition)}
@keyframes modalIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--liquid-fill-strong);border:var(--liquid-stroke);
  border-radius:var(--radius-lg);width:100%;max-width:1200px;
  max-height:85vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-lg);
  backdrop-filter:var(--liquid-blur-lg);-webkit-backdrop-filter:var(--liquid-blur-lg);
  animation:modalScale .3s var(--transition);
}
@keyframes modalScale{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{
  padding:16px 22px;border-bottom:1px solid var(--glass-brd);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h3{font-size:1.05rem;font-weight:700}
.modal-header .close{
  width:34px;height:34px;border-radius:50%;border:none;
  background:var(--bg-2);color:var(--text-1);cursor:pointer;
  font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--transition);
}
.modal-header .close:hover{background:var(--red-bg);color:var(--red);transform:rotate(90deg)}
.modal-body{overflow:auto;padding:0}

/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.chart-card{
  position:relative;overflow:hidden;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius);padding:16px;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
  transition:transform .3s var(--transition),box-shadow .3s var(--transition),border-color .3s var(--transition);
}
.chart-card h4{font-size:.88rem;font-weight:700;margin-bottom:10px;color:var(--text-0)}
.chart-card .chart-box{position:relative;height:240px}

/* Grade filter */
.grade-filter{display:flex;gap:5px;align-items:center}
.grade-btn{
  position:relative;overflow:hidden;
  padding:5px 12px;border-radius:10px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.55);color:var(--text-2);font-size:.7rem;cursor:pointer;
  transition:all .2s var(--transition);font-family:var(--font);font-weight:500;
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
}
.grade-btn:hover{color:var(--text-0);transform:translateY(-1px)}
.grade-btn.active.grade-S{background:var(--gold-bg);color:var(--gold);border-color:rgba(255,149,0,.35);box-shadow:0 2px 8px rgba(255,149,0,.15)}
.grade-btn.active.grade-A{background:var(--green-bg);color:var(--green);border-color:rgba(52,199,89,.35);box-shadow:0 2px 8px rgba(52,199,89,.15)}
.grade-btn.active.grade-B{background:var(--blue-bg);color:var(--blue);border-color:rgba(0,122,255,.30);box-shadow:0 2px 8px rgba(0,122,255,.12)}
.grade-btn.active.grade-C{background:var(--gray-bg);color:var(--gray);border-color:rgba(142,142,147,.30);box-shadow:0 2px 8px rgba(142,142,147,.12)}
.grade-btn.active.all{background:var(--glass-hi);color:var(--brand);border-color:var(--brand-glow);box-shadow:0 2px 8px rgba(0,122,255,.10)}

/* 重点跟进按钮 */
.key-follow-btn{
  position:relative;overflow:hidden;
  padding:5px 14px;border-radius:10px;border:1.5px solid rgba(255,59,48,.3);
  background:linear-gradient(135deg,rgba(255,59,48,.06),rgba(255,149,0,.06));color:var(--red);font-size:.72rem;cursor:pointer;
  transition:all .25s var(--transition);font-family:var(--font);font-weight:600;
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
  display:inline-flex;align-items:center;gap:4px;letter-spacing:.3px;
}
.key-follow-btn:hover{transform:translateY(-1px);box-shadow:0 2px 10px rgba(255,59,48,.15);border-color:rgba(255,59,48,.5)}
.key-follow-btn.active{
  background:linear-gradient(135deg,#FF3B30,#FF9500);color:#fff;border-color:rgba(255,59,48,.6);
  box-shadow:0 3px 12px rgba(255,59,48,.35),inset 0 1px 1px rgba(255,255,255,.3);font-weight:700;
  animation:keyFollowPulse 2s ease-in-out infinite;
}
@keyframes keyFollowPulse{0%,100%{box-shadow:0 3px 12px rgba(255,59,48,.35),inset 0 1px 1px rgba(255,255,255,.3)}50%{box-shadow:0 3px 20px rgba(255,59,48,.55),inset 0 1px 1px rgba(255,255,255,.3)}}

/* Rules section */
.rules-section{
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius);padding:18px;margin-top:16px;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
}
.rules-section h3{font-size:.95rem;font-weight:700;margin-bottom:12px;color:var(--text-0)}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rule-card{
  padding:12px 14px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.55);border:1px solid var(--glass-brd);
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
  transition:all .25s var(--transition);
}
.rule-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);background:rgba(255,255,255,.7)}
.rule-card .rule-title{font-size:.78rem;font-weight:700;color:var(--text-0);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.rule-card .rule-title .pts{font-size:.68rem;color:var(--text-3);font-weight:500}
.rule-card .rule-desc{font-size:.72rem;color:var(--text-2);line-height:1.6}
.rule-card.comm{border-left:4px solid var(--brand-2)}
.rule-card.traj{border-left:4px solid var(--brand)}
.rule-card.stick{border-left:4px solid var(--accent)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--glass-brd);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text-2);font-size:.82rem}

/* Misc */
.exclude-note{font-size:.7rem;color:var(--text-3);margin-left:auto;padding:3px 10px;background:rgba(255,255,255,.5);border:1px solid var(--glass-brd);border-radius:999px;white-space:nowrap}
.formula-note{font-size:.7rem;color:var(--text-3);margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.5);border-radius:var(--radius-sm);border:1px solid var(--glass-brd)}
.empty-msg{text-align:center;padding:40px;color:var(--text-3);font-size:.82rem}
.hidden{display:none!important}
.info-count{font-size:.72rem;color:var(--text-3)}

/* Daily Trend */
.trend-section{
  margin-bottom:16px;border-radius:var(--radius);
  background:var(--liquid-fill);border:var(--liquid-stroke);
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);overflow:hidden;
}
.trend-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;cursor:pointer;user-select:none;
}
.trend-header h3{font-size:.88rem;font-weight:700;color:var(--text-0);display:flex;align-items:center;gap:6px}
.trend-header .toggle{font-size:.72rem;color:var(--text-3);transition:transform .25s var(--transition)}
.trend-section.collapsed .toggle{transform:rotate(-90deg)}
.trend-body{padding:0 18px 16px;max-height:2000px;overflow:hidden;transition:max-height .3s}
.trend-section.collapsed .trend-body{max-height:0;padding-top:0;padding-bottom:0}
.trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.trend-card{
  padding:11px 13px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.55);border:1px solid var(--glass-brd);
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
  transition:transform .25s var(--transition),box-shadow .25s var(--transition);
}
.trend-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.trend-card .tc-label{font-size:.68rem;color:var(--text-2);margin-bottom:4px;text-align:center}
.trend-card .tc-val{font-size:1.25rem;font-weight:700;font-family:var(--mono);color:var(--text-0);text-align:center}
.trend-card .tc-change{font-size:.68rem;margin-top:3px;display:flex;align-items:center;justify-content:center;gap:3px}
.trend-card .tc-change.up{color:var(--green)}
.trend-card .tc-change.down{color:var(--red)}
.trend-card .tc-change.flat{color:var(--text-3)}
.trend-card .tc-change .arrow{font-size:.8rem}
.trend-table{width:100%;font-size:.72rem;border-collapse:collapse;margin-top:6px}
.trend-table th{padding:6px 9px;text-align:center;color:var(--text-2);font-weight:600;border-bottom:1px solid var(--glass-brd);white-space:nowrap}
.trend-table td{padding:6px 9px;color:var(--text-1);border-bottom:1px solid rgba(0,0,0,.02);white-space:nowrap}
.trend-table td.num{text-align:center;font-family:var(--mono)}
.trend-table .change-up{color:var(--green)}
.trend-table .change-down{color:var(--red)}
.trend-table .change-flat{color:var(--text-3)}
.trend-tabs{display:flex;gap:4px;margin-bottom:8px}
.trend-tab{
  position:relative;overflow:hidden;
  padding:5px 12px;border-radius:8px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.55);color:var(--text-2);font-size:.7rem;cursor:pointer;
  font-family:var(--font);font-weight:500;
  transition:all .2s var(--transition);
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
}
.trend-tab:hover{transform:translateY(-1px)}
.trend-tab.active{background:var(--glass-hi);color:var(--brand);border-color:var(--brand-glow);box-shadow:0 2px 8px rgba(0,122,255,.12)}
.trend-nodata{padding:20px;text-align:center;color:var(--text-3);font-size:.78rem}

/* Trend Comparison Table */
.trend-compare-table{width:100%;font-size:.72rem;border-collapse:collapse;margin-top:6px}
.trend-compare-table th{padding:7px 11px;text-align:center;color:var(--text-2);font-weight:700;border-bottom:2px solid var(--glass-brd);white-space:nowrap;position:sticky;top:0;background:rgba(255,255,255,.75);backdrop-filter:var(--liquid-blur)}
.trend-compare-table td{padding:6px 11px;color:var(--text-1);border-bottom:1px solid rgba(0,0,0,.03);white-space:nowrap}
.trend-compare-table td.num{text-align:center;font-family:var(--mono)}
.trend-compare-table td.tc-name{font-weight:600;color:var(--text-0);max-width:120px;overflow:hidden;text-overflow:ellipsis}
.trend-compare-table td.tc-name .tc-subj{display:inline-block;font-size:.6rem;color:var(--text-3);margin-left:4px;padding:1px 5px;background:var(--bg-2);border-radius:4px}
.trend-compare-table .up{color:var(--green)}
.trend-compare-table .down{color:var(--red)}
.trend-compare-table .flat{color:var(--text-3)}
.trend-compare-table tbody tr{transition:background .2s}
.trend-compare-table tbody tr:hover{background:rgba(0,122,255,.06);box-shadow:inset 0 0 0 1px rgba(0,122,255,.10)}

/* Rules Category Headers */
.rules-cat-header{font-size:.86rem;font-weight:700;margin:14px 0 8px;padding:8px 14px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px}
.rules-cat-header .cat-pts{font-size:.7rem;font-weight:600;padding:2px 10px;border-radius:999px}
.rules-cat-header.stick{background:linear-gradient(135deg,rgba(0,199,190,.14),rgba(48,213,200,.08));color:var(--accent)}
.rules-cat-header.stick .cat-pts{background:rgba(0,199,190,.18);color:var(--accent)}
.rules-cat-header.traj{background:linear-gradient(135deg,rgba(0,122,255,.10),rgba(88,86,214,.05));color:var(--brand)}
.rules-cat-header.traj .cat-pts{background:rgba(0,122,255,.14);color:var(--brand)}
.rules-cat-header.comm{background:linear-gradient(135deg,rgba(88,86,214,.10),rgba(0,122,255,.05));color:var(--brand-2)}
.rules-cat-header.comm .cat-pts{background:rgba(88,86,214,.14);color:var(--brand-2)}
.rules-grid{margin-bottom:6px}

/* Nav Switch Button */
.nav-switch{
  display:flex;gap:0;border-radius:999px;overflow:hidden;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow),var(--shadow-glow);
}
.nav-switch a{
  padding:8px 18px;font-size:.78rem;font-weight:600;text-decoration:none;
  color:var(--text-2);transition:all .3s var(--transition);font-family:var(--font);
  display:flex;align-items:center;gap:5px;
}
.nav-switch a:hover{color:var(--text-0);background:rgba(255,255,255,.15)}
.nav-switch a.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;box-shadow:0 2px 12px var(--brand-glow);
}
.nav-switch a .nav-icon{font-size:.9rem}

/* 话术总库 醒目跳转按钮 — 更大更醒目，液态玻璃质感 */
.library-link{
  position:relative;overflow:hidden;text-decoration:none;display:inline-flex;
  padding:14px 28px;border-radius:999px;font-size:.95rem;font-weight:800;
  font-family:var(--font);color:#fff;align-items:center;gap:8px;
  background:linear-gradient(135deg,#FF9500 0%,#FF6B35 50%,#FF3B30 100%);
  background-size:200% 200%;box-shadow:0 6px 22px rgba(255,149,0,.4),inset 0 1px 2px rgba(255,255,255,.5);
  transition:all .35s var(--transition);animation:libShine 4s ease-in-out infinite,libFloat 3s ease-in-out infinite;
  letter-spacing:.3px;
}
@keyframes libShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes libFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.library-link::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);
  background-size:200% 100%;background-position:200% 0;transition:background-position .6s var(--transition);
}
.library-link::after{
  content:'';position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,149,0,.3),rgba(255,59,48,.3));
  filter:blur(12px);opacity:.6;z-index:-1;
}
.library-link:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 12px 32px rgba(255,149,0,.5),inset 0 1px 2px rgba(255,255,255,.6)}
.library-link:hover::before{background-position:-200% 0}
.library-link:active{transform:translateY(-1px) scale(1.02)}
.library-link .lib-icon{font-size:1.15rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}

/* Liquid Glass hover effects — 更强形变+发光+涟漪 */
.kpi,.binned-card,.chart-card,.trend-section,.rules-section,.table-wrap,.status-bar,.tabs{
  transition:transform .35s var(--transition),box-shadow .35s var(--transition),border-color .35s var(--transition);
}
.kpi:hover,.binned-card:hover,.chart-card:hover{
  transform:translateY(-4px) scale(1.01);box-shadow:var(--shadow-lg),0 0 24px var(--brand-glow);
  border-color:rgba(255,255,255,.5);
}
.spill:hover,.pill:hover,.tab:hover,.tag-btn:hover,.grade-btn:hover,.trend-tab:hover{
  transform:scale(1.05) translateY(-1px);transition:transform .2s var(--transition);
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.spill:active,.pill:active,.tab:active,.tag-btn:active,.grade-btn:active,.trend-tab:active{
  transform:scale(.96);transition:transform .1s;
}

/* Student name centering */
.name-cell{text-align:center!important;vertical-align:middle!important}

@media(max-width:1024px){.binned-charts{grid-template-columns:1fr}.chart-grid{grid-template-columns:1fr}}
@media(max-width:768px){.chart-grid{grid-template-columns:1fr}.header-left h1{font-size:1.2rem;padding:10px 20px}.kpi-row{grid-template-columns:repeat(2,1fr)}.nav-switch a{padding:6px 12px;font-size:.72rem}.header{flex-direction:column;gap:10px}.header-right{position:static;transform:none;justify-content:center;width:100%}}
@media(max-width:1024px) and (min-width:769px){.header-right{position:static;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">正在加载兰州学校数据...</p>
    <p id="loadingHint" style="font-size:.72rem;color:var(--text-3);margin-top:4px">数据量较大（约3.6MB），请耐心等待</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ============================================================
// 全局状态
// ============================================================
let DASHBOARD=null;
let DAILY_HISTORY=null;
let activeTab='teacher';
let activeStatus=''; // 初始化为空，启动时自动选择
let activeGradeFilter='all';
let selectedTeacher='';
let activeTagFilters=new Set(); // 标签筛选（多选）：空集合表示"全部"
let keyFollowFilter=false; // 重点跟进筛选：未续班且评级为B或C
let sortCol='renewal_rate';
let sortDir='desc';
let chartInstances={};
let teacherSearch='';
let studentSearch='';
let dropdownOpen=false;
let trendTab='overall'; // 趋势标签：overall/subject/teacher
let trendCollapsed=false; // 趋势面板折叠状态
let activeSubjectFilter=''; // 学科组排名的学科筛选
let trendSortCol='renewal_rate'; // 趋势对比表排序字段
let trendSortDir='desc'; // 趋势对比表排序方向
let trendSubjectFilter=''; // 教师维度日环比的学科筛选

const METRICS=[
  {key:'deep_chat_quality',name:'深聊质量',max:15,cat:'学情沟通',short:'dcq'},

// 标签筛选定义（多选）。type 表示按标签类型筛选，label 表示按具体标签名筛选。
const TAG_FILTERS=[
  {key:'tenure',label:'老生',cls:'tenure',mode:'type'},
  {key:'初三曾在读',label:'初三曾在读',cls:'tenure',mode:'label'},
  {key:'一季老生',label:'一季老生',cls:'tenure',mode:'label'},
  {key:'两季老生',label:'两季老生',cls:'tenure',mode:'label'},
  {key:'三季老生',label:'三季老生',cls:'tenure',mode:'label'},
  {key:'progress',label:'进步明显',cls:'progress',mode:'type'},
  {key:'absent',label:'缺勤',cls:'absent',mode:'type'},
  {key:'comm',label:'家校沟通',cls:'comm',mode:'type'},
  {key:'家校沟通S',label:'沟通S',cls:'comm',mode:'label'},
  {key:'家校沟通A',label:'沟通A',cls:'comm',mode:'label'},
  {key:'家校沟通B',label:'沟通B',cls:'comm',mode:'label'},
  {key:'家校沟通C',label:'沟通C',cls:'comm',mode:'label'},
];

// 判断单个学员是否匹配某个标签筛选
function studentMatchesTag(s,filterKey){
  const f=TAG_FILTERS.find(t=>t.key===filterKey);
  if(!f||!s.tags||!s.tags.length)return false;
  if(f.mode==='type')return s.tags.some(t=>t.type===f.key);
  return s.tags.some(t=>t.label===f.key);
}

// 计算在给定学员集合中，每个标签筛选是否有数据
function computeAvailableTags(students){
  const available=new Set();
  for(const f of TAG_FILTERS){
    for(const s of students){
      if(studentMatchesTag(s,f.key)){available.add(f.key);break;}
    }
  }
  return available;
}

async function loadData(){
  const ver=Date.now();
  const paths=[`lanzhou_dashboard.json?v=${ver}`,`./lanzhou_dashboard.json?v=${ver}`];
  // 添加超时和进度提示
  const loadingText=document.getElementById('loadingText');
  let progressTimer=setTimeout(()=>{
    if(loadingText)loadingText.textContent='数据仍在加载中，请稍候...';
  },5000);
  let slowTimer=setTimeout(()=>{
    if(loadingText)loadingText.textContent='数据量较大，正在解析...可能需要10-15秒';
  },15000);
  
  // 60秒超时
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),60000);
  
  for(const p of paths){
    try{
      const r=await fetch(p,{cache:'no-store',signal:controller.signal});
      if(r.ok){
        const data=await r.json();
        clearTimeout(progressTimer);
        clearTimeout(slowTimer);
        clearTimeout(timeoutId);
        return data;
      }
    }catch(e){}
  }
  clearTimeout(progressTimer);
  clearTimeout(slowTimer);
  clearTimeout(timeoutId);
  throw new Error('无法加载数据文件，请检查网络后刷新重试');
}

async function loadHistory(){
  const ver=Date.now();
  const paths=[`daily_history.json?v=${ver}`,`./daily_history.json?v=${ver}`];
  for(const p of paths){
    try{const r=await fetch(p,{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}
  }
  return null;
}

// 计算环比变化
function calcChange(current, previous){
  if(previous==null||previous===0)return null;
  const diff=current-previous;
  if(Math.abs(diff)<0.05)return {type:'flat',val:diff};
  return {type:diff>0?'up':'down',val:diff};
}

function formatChange(chg,suffix='%'){
  if(!chg)return '<span class="change-flat">—</span>';
  const sign=chg.val>0?'+':'';
  const cls=chg.type==='up'?'change-up':chg.type==='down'?'change-down':'change-flat';
  const arrow=chg.type==='up'?'▲':chg.type==='down'?'▼':'—';
  return `<span class="${cls}">${arrow} ${sign}${chg.val.toFixed(1)}${suffix}</span>`;
}

// ============================================================
// 日数据趋势渲染
// ============================================================
function renderTrends(){
  // 未开课状态不显示日环比
  if(activeStatus==='未开课班级')return '';
  if(!DAILY_HISTORY||!DAILY_HISTORY.snapshots||DAILY_HISTORY.snapshots.length===0)return '';
  const snaps=DAILY_HISTORY.snapshots;
  const latest=snaps[snaps.length-1];
  const prev=snaps.length>1?snaps[snaps.length-2]:null;
  const dataDate=latest.date;

  // 班级状态映射
  const statusMap={'已开课班级':'已开课','已开窗班级':'已开窗','已结课班级':'已结课'};
  const sk=activeStatus&&statusMap[activeStatus]?statusMap[activeStatus]:null;
  const hasSF=!!sk;
  const sfLabel=hasSF?activeStatus.replace('班级',''):'';

  // 通用指标列
  const metricKeys=[
    {k:'dcq',n:'深聊质量'},{k:'dcr',n:'深聊轮次'},{k:'svc',n:'服务卡'},
    {k:'qr',n:'题目回收'},{k:'att',n:'出勤率'},{k:'pp',n:'进步感知'},
    {k:'cr',n:'课次报告'},{k:'cq',n:'连续在读'}
  ];

  // 获取数据源：根据是否有状态筛选选择对应维度
  function getDimData(snap,dimKey){
    if(!snap)return null;
    if(hasSF){
      const crossKey='by_status_'+dimKey;
      if(snap[crossKey]&&snap[crossKey][sk])return snap[crossKey][sk];
      if(snap.by_status&&snap.by_status[sk]&&dimKey==='overall')return snap.by_status[sk];
    }
    if(dimKey==='overall')return snap.overall;
    return snap['by_'+dimKey]||null;
  }

  let html=`<div class="trend-section ${trendCollapsed?'collapsed':''}">
    <div class="trend-header" onclick="toggleTrend()">
      <h3>📈 日数据环比趋势 <span style="font-size:.72rem;color:var(--text-3);font-weight:400">数据日期 ${dataDate}${hasSF?' · '+sfLabel:''}</span></h3>
      <span class="toggle">▼</span>
    </div>
    <div class="trend-body">
      <div class="trend-tabs">
        <button class="trend-tab ${trendTab==='overall'?'active':''}" onclick="switchTrendTab('overall')">整体</button>
        <button class="trend-tab ${trendTab==='subject'?'active':''}" onclick="switchTrendTab('subject')">学科维度</button>
        <button class="trend-tab ${trendTab==='teacher'?'active':''}" onclick="switchTrendTab('teacher')">教师维度</button>
        ${hasSF?`<span style="margin-left:auto;font-size:.68rem;color:var(--accent);align-self:center;padding:2px 10px;background:var(--accent-light);border-radius:999px">📌 ${sfLabel}</span>`:''}
      </div>`;

  if(trendTab==='overall'){
    // 整体维度：单数据视图
    const curData=getDimData(latest,'overall');
    const prevData=getDimData(prev,'overall');
    if(!curData){html+='<div class="trend-nodata">暂无数据</div></div></div>';return html;}

    const chgRR=calcChange(curData.renewal_rate,prevData?prevData.renewal_rate:null);
    const chgScore=calcChange(curData.avg_score,prevData?prevData.avg_score:null);
    const chgSA=calcChange(curData.sa_pct,prevData?prevData.sa_pct:null);

    html+=`
      <div class="trend-grid">
        <div class="trend-card"><div class="tc-label">续班率</div><div class="tc-val">${curData.renewal_rate.toFixed(1)}%</div><div class="tc-change ${chgRR?chgRR.type:'flat'}">${formatChange(chgRR)}</div></div>
        <div class="trend-card"><div class="tc-label">平均总分</div><div class="tc-val">${curData.avg_score.toFixed(1)}</div><div class="tc-change ${chgScore?chgScore.type:'flat'}">${formatChange(chgScore,'')}</div></div>
        <div class="trend-card"><div class="tc-label">SA占比</div><div class="tc-val">${curData.sa_pct.toFixed(1)}%</div><div class="tc-change ${chgSA?chgSA.type:'flat'}">${formatChange(chgSA)}</div></div>
        <div class="trend-card"><div class="tc-label">学员人次</div><div class="tc-val">${curData.student_count}</div><div class="tc-change flat">原班${curData.original_count} · 续班${curData.renewal_count}</div></div>
      </div>
      ${curData.metrics?renderTrendMetricTable(curData,prevData,metricKeys):''}
      ${renderTrendFooter(snaps,latest)}`;
  }else if(trendTab==='subject'){
    // 学科维度：四个学科对比表
    const curSubjects=getDimData(latest,'subject')||{};
    const prevSubjects=getDimData(prev,'subject')||{};
    const subjNames=Object.keys(curSubjects).filter(k=>curSubjects[k]&&curSubjects[k].student_count>0);
    if(subjNames.length===0){html+='<div class="trend-nodata">暂无学科数据</div></div></div>';return html;}

    html+=renderTrendComparisonTable(subjNames,curSubjects,prevSubjects,'学科',metricKeys);
    html+=renderTrendFooter(snaps,latest);
  }else if(trendTab==='teacher'){
    // 教师维度：所有教师对比表
    const curTeachers=getDimData(latest,'teacher')||{};
    const prevTeachers=getDimData(prev,'teacher')||{};

    // 提取所有学科（从教师数据中）
    const teacherSubjects=[...new Set(Object.values(curTeachers).map(t=>t.subject).filter(Boolean))].sort();

    // 按学科筛选过滤教师
    let filteredNames=Object.keys(curTeachers).filter(k=>curTeachers[k]&&curTeachers[k].student_count>0);
    if(trendSubjectFilter){
      filteredNames=filteredNames.filter(k=>curTeachers[k].subject===trendSubjectFilter);
    }
    const teacherNames=filteredNames.sort((a,b)=>curTeachers[b].renewal_rate-curTeachers[a].renewal_rate);
    if(teacherNames.length===0){html+='<div class="trend-nodata">暂无教师数据</div></div></div>';return html;}

    // 学科筛选栏（已开课/已结课状态下显示，且需多于1个学科）
    if(hasSF&&teacherSubjects.length>1){
      html+=`<div class="filter-bar" style="margin:8px 0 10px">
        <span class="filter-label">学科筛选</span>
        <div class="pill-group">
          <button class="pill ${trendSubjectFilter===''?'active':''}" onclick="switchTrendSubject('')">全部</button>
          ${teacherSubjects.map(s=>`<button class="pill ${trendSubjectFilter===s?'active':''}" onclick="switchTrendSubject('${s}')">${s}</button>`).join('')}
        </div>
        <span class="info-count" style="margin-left:auto">${trendSubjectFilter?trendSubjectFilter+'学科 · '+teacherNames.length+'位教师':teacherNames.length+'位教师 · 全部学科'}</span>
      </div>`;
    }

    html+=renderTrendComparisonTable(teacherNames,curTeachers,prevTeachers,'教师',metricKeys);
    html+=renderTrendFooter(snaps,latest);
  }

  html+='</div></div>';
  return html;
}

function renderTrendMetricTable(curData,prevData,metricKeys){
  return `<table class="trend-table">
    <thead><tr><th>指标</th><th style="text-align:center">当日均值</th><th style="text-align:center">环比变化</th></tr></thead>
    <tbody>
    ${metricKeys.map(mk=>{
      const cv=curData.metrics[mk.k]||0;
      const pv=prevData&&prevData.metrics?prevData.metrics[mk.k]||0:0;
      const chg=calcChange(cv,pv);
      return `<tr><td>${mk.n}</td><td class="num">${cv.toFixed(1)}</td><td class="num">${formatChange(chg,'')}</td></tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

function sortByTrend(col){
  if(trendSortCol===col){
    trendSortDir=trendSortDir==='asc'?'desc':'asc';
  }else{
    trendSortCol=col;
    trendSortDir='desc';
  }
  render();
}

function renderTrendComparisonTable(names,curMap,prevMap,dimLabel,metricKeys){
  const hasPrev=Object.keys(prevMap).length>0;

  // 排序字段映射
  const sortFields=[
    {key:'student_count',label:'人次'},
    {key:'renewal_rate',label:'续班率'},
    {key:'avg_score',label:'均分'},
    {key:'sa_pct',label:'SA占比'},
    {key:'renewal_rate_chg',label:'续班率环比'},
    {key:'avg_score_chg',label:'均分环比'},
    {key:'dcq',label:'深聊质量'},
    {key:'dcr',label:'深聊轮次'},
    {key:'att',label:'出勤率'},
    {key:'pp',label:'进步感知'},
  ];

  // 获取排序值
  function getSortVal(name){
    const c=curMap[name];if(!c)return 0;
    const p=prevMap[name];
    let val;
    if(trendSortCol==='renewal_rate_chg'){
      const chg=calcChange(c.renewal_rate,p?p.renewal_rate:null);
      val=chg?chg.val:0;
    }else if(trendSortCol==='avg_score_chg'){
      const chg=calcChange(c.avg_score,p?p.avg_score:null);
      val=chg?chg.val:0;
    }else if(trendSortCol==='dcq'||trendSortCol==='dcr'||trendSortCol==='att'||trendSortCol==='pp'){
      val=c.metrics?(c.metrics[trendSortCol]||0):0;
    }else{
      val=c[trendSortCol]||0;
    }
    return val;
  }

  // 排序
  let sortedNames=[...names];
  if(trendSortCol==='name'){
    sortedNames.sort((a,b)=>trendSortDir==='asc'?a.localeCompare(b,'zh'):b.localeCompare(a,'zh'));
  }else{
    sortedNames.sort((a,b)=>{
      const va=getSortVal(a),vb=getSortVal(b);
      return trendSortDir==='asc'?va-vb:vb-va;
    });
  }

  // 排序指示器
  function sortIndicator(fieldKey){
    if(trendSortCol!==fieldKey)return '<span class="sort-i" style="opacity:.4">⇅</span>';
    return `<span class="sort-i" style="opacity:1;color:var(--brand)">${trendSortDir==='asc'?'▲':'▼'}</span>`;
  }

  let html=`<div style="overflow-x:auto"><table class="trend-compare-table">
    <thead><tr>
      <th style="cursor:pointer" onclick="sortByTrend('name')">${dimLabel}${sortIndicator('name')}</th>
      <th style="cursor:pointer" onclick="sortByTrend('student_count')">人次${sortIndicator('student_count')}</th>
      <th style="cursor:pointer" onclick="sortByTrend('renewal_rate')">续班率${sortIndicator('renewal_rate')}</th>
      <th style="cursor:pointer" onclick="sortByTrend('avg_score')">均分${sortIndicator('avg_score')}</th>
      <th style="cursor:pointer" onclick="sortByTrend('sa_pct')">SA占比${sortIndicator('sa_pct')}</th>
      ${hasPrev?`<th style="cursor:pointer" onclick="sortByTrend('renewal_rate_chg')">续班率环比${sortIndicator('renewal_rate_chg')}</th><th style="cursor:pointer" onclick="sortByTrend('avg_score_chg')">均分环比${sortIndicator('avg_score_chg')}</th>`:''}
      <th style="cursor:pointer" onclick="sortByTrend('dcq')">深聊质量${sortIndicator('dcq')}</th>
      <th style="cursor:pointer" onclick="sortByTrend('dcr')">深聊轮次${sortIndicator('dcr')}</th>
      <th style="cursor:pointer" onclick="sortByTrend('att')">出勤率${sortIndicator('att')}</th>
      <th style="cursor:pointer" onclick="sortByTrend('pp')">进步感知${sortIndicator('pp')}</th>
    </tr></thead>
    <tbody>`;
  for(const name of sortedNames){
    const c=curMap[name];if(!c)continue;
    const p=prevMap[name];
    const chgRR=calcChange(c.renewal_rate,p?p.renewal_rate:null);
    const chgScore=calcChange(c.avg_score,p?p.avg_score:null);
    // 色阶：续班率
    const rrColor=c.renewal_rate>=40?'var(--green)':c.renewal_rate>=20?'var(--gold)':c.renewal_rate>=10?'var(--accent)':'var(--red)';
    html+=`<tr>
      <td class="tc-name">${name}${dimLabel==='教师'?(c.subject?'<span class="tc-subj">'+c.subject+'</span>':''):''}</td>
      <td class="num">${c.student_count}</td>
      <td class="num" style="color:${rrColor};font-weight:600">${c.renewal_rate.toFixed(1)}%</td>
      <td class="num">${c.avg_score.toFixed(1)}</td>
      <td class="num">${c.sa_pct.toFixed(1)}%</td>
      ${hasPrev?`<td class="num ${chgRR?chgRR.type:'flat'}">${formatChange(chgRR)}</td><td class="num ${chgScore?chgScore.type:'flat'}">${formatChange(chgScore,'')}</td>`:''}
      <td class="num">${c.metrics?(c.metrics.dcq||0).toFixed(1):'-'}</td>
      <td class="num">${c.metrics?(c.metrics.dcr||0).toFixed(1):'-'}</td>
      <td class="num">${c.metrics?(c.metrics.att||0).toFixed(1):'-'}</td>
      <td class="num">${c.metrics?(c.metrics.pp||0).toFixed(1):'-'}</td>
    </tr>`;
  }
  html+='</tbody></table></div>';
  return html;
}

// 导出学情标签页学员数据为CSV
function exportSubjectStudents(subjectName){
  // 获取当前学科的学员
  let students=getSubjectStudents(subjectName);

  // 应用与当前页面一致的筛选逻辑（直接读取全局变量）
  if(selectedTeacher)students=students.filter(s=>s.t===selectedTeacher);
  if(activeGradeFilter&&activeGradeFilter!=='all')students=students.filter(s=>s.sg===activeGradeFilter);
  if(activeTagFilters&&activeTagFilters.size>0){
    students=students.filter(s=>{
      for(const fk of activeTagFilters){
        if(studentMatchesTag(s,fk))return true;
      }
      return false;
    });
  }
  if(studentSearch){
    const q=studentSearch.toLowerCase();
    students=students.filter(s=>(s.n&&s.n.toLowerCase().includes(q))||(s.cc&&s.cc.toLowerCase().includes(q)));
  }

  if(students.length===0){alert('当前筛选条件下无数据可导出');return;}

  // 构建文件名：学科-教师名-标签1-标签2
  let nameParts=[subjectName];
  if(selectedTeacher)nameParts.push(selectedTeacher);else nameParts.push('全部教师');
  if(activeGradeFilter&&activeGradeFilter!=='all')nameParts.push(activeGradeFilter+'级');
  if(activeTagFilters&&activeTagFilters.size>0){
    for(const fk of activeTagFilters){
      const f=TAG_FILTERS.find(t=>t.key===fk);
      if(f)nameParts.push(f.label);
    }
  }
  const fileName=nameParts.join('-')+'.csv';

  // CSV表头
  const headers=['标签','学员姓名','教师','班级编码','班级状态','开课日期','结课日期','总分','评级',
    '深聊质量','深聊轮次','服务卡','题目回收','出勤率','进步感知','课次报告','连续在读','原班','续班'];

  // 转义CSV单元格
  function esc(v){
    if(v==null)return '';
    const s=String(v);
    if(s.includes(',')||s.includes('"')||s.includes('\n'))return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }

  // 构建CSV行
  let csv='\ufeff'+headers.map(esc).join(',')+'\n'; // BOM for Excel
  for(const s of students){
    const tagsStr=(s.tags||[]).map(t=>t.label).join('、');
    const grade=s.sg||s.fg||'';
    const row=[
      tagsStr,
      s.n||'',
      s.t||'',
      s.cc||'',
      s.cs||'',
      s.sd||'',
      s.ed||'',
      s.ts!=null?s.ts.toFixed(1):'',
      grade,
      s.dcq!=null?s.dcq.toFixed(1):'',
      s.dcr!=null?s.dcr.toFixed(1):'',
      s.svc!=null?s.svc.toFixed(1):'',
      s.qr!=null?s.qr.toFixed(1):'',
      s.att!=null?s.att.toFixed(1):'',
      s.pp!=null?s.pp.toFixed(1):'',
      s.cr!=null?s.cr.toFixed(1):'',
      s.cq!=null?s.cq.toFixed(1):'',
      s.io||'',
      s.ir||''
    ];
    csv+=row.map(esc).join(',')+'\n';
  }

  // 下载
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fileName;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getFilteredStudents(){
  if(!DASHBOARD)return[];
  if(activeStatus==='all'||activeStatus==='')return DASHBOARD.all_students;
  if(activeStatus==='未开课班级')return DASHBOARD.not_started_students||[];
  return DASHBOARD.all_students.filter(s=>s.cs===activeStatus);

function getSubjectStudents(subject){
  let students=DASHBOARD.all_students.filter(s=>s.s===subject);
  if(activeStatus&&activeStatus!=='all'&&activeStatus!=='未开课班级'){
    students=students.filter(s=>s.cs===activeStatus);
  }
  return students;
}

function getNotStartedStudents(){
  return DASHBOARD.not_started_students||[];
}

// ============================================================
// 聚合
// ============================================================
function aggregateTeachers(students){
  const map={};
  for(const s of students){
    if(!s.t)continue;
    if(!map[s.t]){
      map[s.t]={teacher:s.t,subjects:new Set(),total:0,original:0,renewal:0,
        scores:[],grades_sys:[],grades_formula:[],metrics:{},metric_cnt:{},statuses:new Set()};
      for(const m of METRICS){map[s.t].metrics[m.short]=0;map[s.t].metric_cnt[m.short]=0;}
    }
    const t=map[s.t];
    t.subjects.add(s.s);t.total++;t.statuses.add(s.cs);
    if(s.io==='是')t.original++;
    if(s.ir==='是')t.renewal++;
    if(s.ts!=null)t.scores.push(s.ts);
    if(s.sg)t.grades_sys.push(s.sg);
    if(s.fg)t.grades_formula.push(s.fg);
    for(const m of METRICS){t.metrics[m.short]+=s[m.short]||0;t.metric_cnt[m.short]++;}
  }
  const tenureMap={};
  if(DASHBOARD.teachers)for(const t of DASHBOARD.teachers)tenureMap[t.teacher]=t.tenure;
  const result=[];
  for(const t of Object.values(map)){
    const avg=t.scores.length?t.scores.reduce((a,b)=>a+b,0)/t.scores.length:0;
    const rr=t.original?t.renewal/t.original*100:0;
    const saSys=t.grades_sys.filter(g=>g==='S'||g==='A').length;
    const saPctSys=t.grades_sys.length?saSys/t.grades_sys.length*100:0;
    const gcSys={S:0,A:0,B:0,C:0};t.grades_sys.forEach(g=>{if(gcSys[g]!=null)gcSys[g]++});
    const gcFormula={S:0,A:0,B:0,C:0};t.grades_formula.forEach(g=>{if(gcFormula[g]!=null)gcFormula[g]++});
    const metricsAvg={};
    for(const m of METRICS)metricsAvg[m.short]=t.metric_cnt[m.short]?Math.round(t.metrics[m.short]/t.metric_cnt[m.short]*10)/10:0;
    result.push({teacher:t.teacher,subjects:[...t.subjects].join('|'),
      subject_main:t.subjects.size===1?[...t.subjects][0]:'多科目',
      tenure:tenureMap[t.teacher]||'',total:t.total,original:t.original,renewal:t.renewal,
      renewal_rate:Math.round(rr*10)/10,avg_score:Math.round(avg*10)/10,
      sa_pct:Math.round(saPctSys*10)/10,grade_counts:gcSys,grade_counts_formula:gcFormula,metrics:metricsAvg});
  }
  return result;
}

function aggregateSubjects(students){
  const map={};
  for(const s of students){
    if(!s.s)continue;
    if(!map[s.s]){
      map[s.s]={subject:s.s,total:0,original:0,renewal:0,scores:[],grades_sys:[],grades_formula:[],
        teachers:new Set(),metrics:{},metric_cnt:{}};
      for(const m of METRICS){map[s.s].metrics[m.short]=0;map[s.s].metric_cnt[m.short]=0;}
    }
    const t=map[s.s];t.total++;t.teachers.add(s.t);
    if(s.io==='是')t.original++;if(s.ir==='是')t.renewal++;
    if(s.ts!=null)t.scores.push(s.ts);
    if(s.sg)t.grades_sys.push(s.sg);if(s.fg)t.grades_formula.push(s.fg);
    for(const m of METRICS){t.metrics[m.short]+=s[m.short]||0;t.metric_cnt[m.short]++;}
  }
  const result=[];
  for(const t of Object.values(map)){
    const avg=t.scores.length?t.scores.reduce((a,b)=>a+b,0)/t.scores.length:0;
    const rr=t.original?t.renewal/t.original*100:0;
    const saSys=t.grades_sys.filter(g=>g==='S'||g==='A').length;
    const saPctSys=t.grades_sys.length?saSys/t.grades_sys.length*100:0;
    const gcSys={S:0,A:0,B:0,C:0};t.grades_sys.forEach(g=>{if(gcSys[g]!=null)gcSys[g]++});
    const gcFormula={S:0,A:0,B:0,C:0};t.grades_formula.forEach(g=>{if(gcFormula[g]!=null)gcFormula[g]++});
    const metricsAvg={};
    for(const m of METRICS)metricsAvg[m.short]=t.metric_cnt[m.short]?Math.round(t.metrics[m.short]/t.metric_cnt[m.short]*10)/10:0;
    result.push({subject:t.subject,teacher_count:t.teachers.size,total:t.total,original:t.original,renewal:t.renewal,
      renewal_rate:Math.round(rr*10)/10,avg_score:Math.round(avg*10)/10,sa_pct:Math.round(saPctSys*10)/10,
      grade_counts:gcSys,grade_counts_formula:gcFormula,metrics:metricsAvg});
  }
  return result;

// ============================================================
// 排序
// ============================================================
function sortData(data,col,dir){
  return data.sort((a,b)=>{
    let va=col.includes('.')?col.split('.').reduce((o,k)=>o?.[k],a):a[col];
    let vb=col.includes('.')?col.split('.').reduce((o,k)=>o?.[k],b):b[col];
    if(typeof va==='string'){va=va||'';vb=vb||'';return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);}
    va=va||0;vb=vb||0;return dir==='asc'?va-vb:vb-va;
  });
}

// ============================================================
// 标签渲染
// ============================================================
function renderTags(tags){
  if(!tags||!tags.length)return '';
  return tags.map(t=>{
    let cls='stag';
    if(t.type==='tenure')cls='stag stag-tenure';
    else if(t.type==='progress')cls='stag stag-progress';
    else if(t.type==='absent')cls='stag stag-absent';
    else if(t.type==='comm')cls=`stag stag-comm-${t.label.replace('家校沟通','')}`;
    return `<span class="${cls}">${t.label}</span>`;
  }).join('');
}

function renderKPIs(students){
  const orig=students.filter(s=>s.io==='是').length;

  const scores=students.filter(s=>s.ts!=null).map(s=>s.ts);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const grades=students.filter(s=>s.sg);
  const sa=grades.filter(s=>s.sg==='S'||s.sg==='A').length;
  const saPct=grades.length?sa/grades.length*100:0;
  const teachers=new Set(students.map(s=>s.t)).size;

  return `
    <div class="kpi"><div class="label">入口教师人数</div><div class="val brand">${teachers}</div><div class="sub">人</div></div>

    const cols=[
      {key:'rank',label:'#',sortable:false},
      {key:'subject',label:'学科',sortable:true},
      {key:'teacher_count',label:'教师数',sortable:true,cls:'num'},
      {key:'total',label:'人次',sortable:true,cls:'num'},
      {key:'original',label:'原班',sortable:true,cls:'num'},
      {key:'renewal',label:'续班',sortable:true,cls:'num'},
      {key:'renewal_rate',label:'续班率',sortable:true,cls:'num'},

        <th class="g-count" colspan="3">学员人次</th>
        <th class="g-key" colspan="3">核心指标</th>
        <th class="g-grade" colspan="4">SABC分布</th>
        <th class="g-comm" colspan="3">学情沟通</th>
        <th class="g-traj" colspan="4">学习轨迹</th>
        <th class="g-stick" colspan="1">黏性</th>
      </tr>
      <tr>
        ${cols.map(c=>`<th class="${sortCol===c.key?'sorted':''}" onclick="${c.sortable?`sortBy('${c.key}')`:''}" ${c.tip?`class="tooltip" data-tip="${c.tip}"`:''}>${c.label}${c.sortable?`<span class="sort-i">${sortCol===c.key?(sortDir==='asc'?'▲':'▼'):'⇅'}</span>`:''}</th>`).join('')}
      </tr>
      </thead>
      <tbody>
        ${data.map((r,i)=>{
          const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other';
          const rrCls=r.renewal_rate>=30?'green':r.renewal_rate>=15?'gold':'red';
          const saCls=r.sa_pct>=20?'green':r.sa_pct>=10?'gold':'red';

            <td class="num">${r.avg_score.toFixed(1)}</td>
            <td class="num"><div class="bar-wrap"><span class="bar"><span class="bar-fill ${saCls}" style="width:${Math.min(r.sa_pct/30*100,100)}%"></span></span><span class="bar-val">${r.sa_pct.toFixed(1)}%</span></div></td>
            <td class="num">${r.grade_counts.S?`<span class="grade grade-S">${r.grade_counts.S}</span>`:'-'}</td>
            <td class="num">${r.grade_counts.A?`<span class="grade grade-A">${r.grade_counts.A}</span>`:'-'}</td>
            <td class="num">${r.grade_counts.B?`<span class="grade grade-B">${r.grade_counts.B}</span>`:'-'}</td>
            <td class="num">${r.grade_counts.C?`<span class="grade grade-C">${r.grade_counts.C}</span>`:'-'}</td>

}

function renderSubjectStudentTab(subjectName,subjectStudents){
  const teacherMap={};
  subjectStudents.forEach(s=>{
    if(!teacherMap[s.t])teacherMap[s.t]={name:s.t,count:0,sa:0};
    teacherMap[s.t].count++;
    if(s.sg==='S'||s.sg==='A')teacherMap[s.t].sa++;
  });
  const teachers=Object.values(teacherMap).sort((a,b)=>b.count-a.count);

  // ===== 教师排名区域（续班率TOP10 + 均分TOP10 + 详情表）=====
  const subjTeacherData=aggregateTeachers(subjectStudents);
  const subjTeacherSorted=sortData(subjTeacherData,sortCol==='teacher'||sortCol==='subject_main'||sortCol==='tenure'?'renewal_rate':sortCol,sortDir);

  const subjCols=[
    {key:'rank',label:'#',sortable:false},
    {key:'teacher',label:'教师',sortable:true},
    {key:'tenure',label:'司龄',sortable:true},
    {key:'total',label:'人次',sortable:true,cls:'num'},
    {key:'original',label:'原班',sortable:true,cls:'num'},
    {key:'renewal',label:'续班',sortable:true,cls:'num'},
    {key:'renewal_rate',label:'续班率',sortable:true,cls:'num',render:(v)=>{
      const cls=v>=30?'green':v>=15?'gold':'red';
      return `<div class="bar-wrap"><span class="bar"><span class="bar-fill ${cls}" style="width:${Math.min(v/70*100,100)}%"></span></span><span class="bar-val">${v.toFixed(1)}%</span></div>`;
    }},
    {key:'avg_score',label:'均分',sortable:true,cls:'num',render:(v)=>v.toFixed(1)},
    {key:'sa_pct',label:'SA占比',sortable:true,cls:'num',render:(v)=>{
      const cls=v>=20?'green':v>=10?'gold':'red';
      return `<div class="bar-wrap"><span class="bar"><span class="bar-fill ${cls}" style="width:${Math.min(v/30*100,100)}%"></span></span><span class="bar-val">${v.toFixed(1)}%</span></div>`;
    }},
    {key:'grade_counts.S',label:'S',sortable:true,cls:'num',render:(v)=>v?`<span class="grade grade-S">${v}</span>`:'-'},
    {key:'grade_counts.A',label:'A',sortable:true,cls:'num',render:(v)=>v?`<span class="grade grade-A">${v}</span>`:'-'},
    {key:'grade_counts.B',label:'B',sortable:true,cls:'num',render:(v)=>v?`<span class="grade grade-B">${v}</span>`:'-'},
    {key:'grade_counts.C',label:'C',sortable:true,cls:'num',render:(v)=>v?`<span class="grade grade-C">${v}</span>`:'-'},
  ];
  for(const m of METRICS){
    subjCols.push({key:`metrics.${m.short}`,label:m.name,sortable:true,cls:'num',render:(v)=>v?v.toFixed(1):'-',tip:`${m.cat} · 满分${m.max}分`});
  }

  let teacherRankHtml=`
  <div class="chart-grid">
    <div class="chart-card"><h4>${subjectName}教师续班率 TOP 10</h4><div class="chart-box"><canvas id="chart-subj-${subjectName}-rr"></canvas></div></div>
    <div class="chart-card"><h4>${subjectName}教师平均分 TOP 10</h4><div class="chart-box"><canvas id="chart-subj-${subjectName}-score"></canvas></div></div>
  </div>

  <div class="table-wrap"><div class="table-scroll"><table>
    <thead>
    <tr class="grp-row">
      <th class="g-basic" colspan="3">基本信息</th>
      <th class="g-count" colspan="3">学员人次</th>
      <th class="g-key" colspan="3">核心指标</th>
      <th class="g-grade" colspan="4">SABC分布</th>
      <th class="g-comm" colspan="3">学情沟通</th>
      <th class="g-traj" colspan="4">学习轨迹</th>
      <th class="g-stick" colspan="1">黏性</th>
    </tr>
    <tr>
      ${subjCols.map(c=>`<th class="${sortCol===c.key?'sorted':''}" onclick="${c.sortable?`sortBy('${c.key}')`:''}" ${c.tip?`class="tooltip" data-tip="${c.tip}"`:''}>${c.label}${c.sortable?`<span class="sort-i">${sortCol===c.key?(sortDir==='asc'?'▲':'▼'):'⇅'}</span>`:''}</th>`).join('')}
    </tr>
    </thead>
    <tbody>
      ${subjTeacherSorted.map((r,i)=>{
        const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-other';
        return `<tr>
          <td class="rank ${rc}"><span class="badge">${i+1}</span></td>
          <td><span class="teacher-link" onclick="openTeacherDetail('${r.teacher}')">${r.teacher}</span></td>
          <td style="color:var(--text-2)">${r.tenure||'-'}</td>
          <td class="num">${r.total}</td>
          <td class="num">${r.original}</td>
          <td class="num">${r.renewal}</td>
          <td class="num">${subjCols[6].render(r.renewal_rate)}</td>
          <td class="num">${subjCols[7].render(r.avg_score)}</td>
          <td class="num">${subjCols[8].render(r.sa_pct)}</td>
          <td class="num">${subjCols[9].render(r.grade_counts.S)}</td>
          <td class="num">${subjCols[10].render(r.grade_counts.A)}</td>
          <td class="num">${subjCols[11].render(r.grade_counts.B)}</td>
          <td class="num">${subjCols[12].render(r.grade_counts.C)}</td>
          ${METRICS.map(m=>`<td class="num">${r.metrics[m.short]?r.metrics[m.short].toFixed(1):'-'}</td>`).join('')}
        </tr>`;
      }).join('')}
    </tbody>
  </table></div></div>`;

  let students=subjectStudents;
  if(selectedTeacher)students=students.filter(s=>s.t===selectedTeacher);
  if(keyFollowFilter)students=students.filter(s=>{
    if(s.ir==='是')return false; // 未续班
    const commTag=s.tags?s.tags.find(t=>t.type==='comm'):null;
    const comm=commTag?commTag.label.replace('家校沟通',''):null;
    if(comm==='B'||comm==='C')return true; // 家校沟通BC：无论总分都重点跟进
    if((s.sg==='B'||s.sg==='C')&&comm!=='S')return true; // 评级BC且家校沟通非S
    return false;
  });
  if(activeGradeFilter!=='all')students=students.filter(s=>s.sg===activeGradeFilter);

  // 基于教师+评级筛选后的学员集合，计算各标签是否有数据（用于隐藏无数据标签）
  // 注意：此处不应用标签筛选本身，否则多选时选一个标签会让其他标签都消失
  const availableTags=computeAvailableTags(students);

  // 标签筛选（多选，OR 逻辑）：选中任一标签即显示该学员
  if(activeTagFilters.size>0){
    students=students.filter(s=>{
      for(const fk of activeTagFilters){
        if(studentMatchesTag(s,fk))return true;
      }
      return false;
    });
  }
  if(studentSearch){
    const q=studentSearch.toLowerCase();
    students=students.filter(s=>(s.n&&s.n.toLowerCase().includes(q))||(s.cc&&s.cc.toLowerCase().includes(q)));
  }

  // 教师下拉菜单
  const dropdownItems=teachers.map(t=>
    `<div class="dropdown-item ${selectedTeacher===t.name?'selected':''}" onclick="selectTeacher('${t.name}')">${t.name} (${t.count}人 · SA${t.sa})</div>`
  ).join('');

  // 动态列：选了教师不显示教师列；当天满分直接隐藏；两个评级相同只显示一个
  const showTeacherCol=!selectedTeacher;
  const hideFullScore=true;

  let cols=[
    {key:'tags',label:'标签'},
    {key:'n',label:'学员姓名'},
  ];
  if(showTeacherCol)cols.push({key:'t',label:'教师'});
  cols.push(
    {key:'cc',label:'班级编码'},
    {key:'cs',label:'班级状态'},
    {key:'sd',label:'开课日期'},
    {key:'ed',label:'结课日期'},
    {key:'ts',label:'总分',cls:'num'},
  );
  if(!hideFullScore)cols.push({key:'fs',label:'当天满分',cls:'num'});
  cols.push({key:'grade',label:'评级'});
  cols.push(
    {key:'dcq',label:'深聊质量',cls:'num'},
    {key:'dcr',label:'深聊轮次',cls:'num'},
    {key:'svc',label:'服务卡',cls:'num'},
    {key:'qr',label:'题目回收',cls:'num'},
    {key:'att',label:'出勤率',cls:'num'},
    {key:'pp',label:'进步感知',cls:'num'},
    {key:'cr',label:'课次报告',cls:'num'},
    {key:'cq',label:'连续在读',cls:'num'},
    {key:'io',label:'原班'},
    {key:'ir',label:'续班'},
  );

  let html=teacherRankHtml+`
  <div style="height:28px"></div>
  <div class="filter-bar">
    <span class="filter-label">教师筛选</span>
    <div class="dropdown" id="teacherDropdown">
      <button class="dropdown-btn" onclick="toggleDropdown()">
        ${selectedTeacher||'全部教师'} <span class="arrow">▼</span>
      </button>
      <div class="dropdown-menu">
        <div class="dropdown-item ${!selectedTeacher?'selected':''}" onclick="selectTeacher('')">全部教师 (${subjectStudents.length}人)</div>
        ${dropdownItems}
      </div>
    </div>
    <button class="key-follow-btn ${keyFollowFilter?'active':''}" onclick="toggleKeyFollow()" title="筛选未续班且评级为B或C的学员">⚠ 重点跟进</button>
    <span class="filter-label" style="margin-left:8px">评级</span>
    <div class="grade-filter">
      <button class="grade-btn all ${activeGradeFilter==='all'?'active':''}" onclick="filterGrade('all')">全部</button>
      <button class="grade-btn grade-S ${activeGradeFilter==='S'?'active':''}" onclick="filterGrade('S')">S级</button>
      <button class="grade-btn grade-A ${activeGradeFilter==='A'?'active':''}" onclick="filterGrade('A')">A级</button>
      <button class="grade-btn grade-B ${activeGradeFilter==='B'?'active':''}" onclick="filterGrade('B')">B级</button>
      <button class="grade-btn grade-C ${activeGradeFilter==='C'?'active':''}" onclick="filterGrade('C')">C级</button>
    </div>
    <span class="filter-label" style="margin-left:8px">标签</span>
    <div class="tag-filter">
      <button class="tag-btn all ${activeTagFilters.size===0?'active':''}" onclick="filterTag('all')">全部${activeTagFilters.size>0?` <span style="opacity:.7">(${activeTagFilters.size})</span>`:''}</button>
      ${TAG_FILTERS.map(f=>{
        const isActive=activeTagFilters.has(f.key);
        const hasData=availableTags.has(f.key);
        const cls=hasData?'':(' no-data');
        return `<button class="tag-btn ${f.cls}${isActive?' active':''}${cls}" onclick="filterTag('${f.key}')" ${hasData?'':'disabled title="当前筛选条件下无数据"'}>${f.label}</button>`;
      }).join('')}
    </div>
    <input class="search-box" type="text" placeholder="搜索学员姓名/班级编码..." value="${studentSearch}" oninput="onStudentSearch(this.value)" style="max-width:200px">
    <span class="info-count">共 ${students.length} 名学员</span>
    <button class="pill" style="background:var(--brand);color:#fff;border:none;padding:6px 16px;font-size:.78rem;font-weight:600;cursor:pointer;margin-left:auto" onclick="exportSubjectStudents('${subjectName}')">导出Excel</button>
  </div>

  <div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
    <tbody>
      ${students.length?students.map(s=>{
        const gradeHtml=s.sg?`<span class="grade grade-${s.sg}">${s.sg}</span>`:(s.fg?`<span class="grade grade-${s.fg}">${s.fg}</span>`:'-');
        return `<tr>
          <td class="tags-cell"><div class="tag-row">${renderTags(s.tags)}</div></td>
          <td class="name-cell" style="font-weight:500">${s.n||'-'}</td>
          ${showTeacherCol?`<td><span class="teacher-link" onclick="selectTeacher('${s.t}')">${s.t}</span></td>`:''}
          <td style="color:var(--text-2);font-size:.72rem">${s.cc||'-'}</td>
          <td style="font-size:.72rem;color:var(--text-2)">${s.cs}</td>
          <td style="font-size:.72rem;color:var(--text-2)">${s.sd||'-'}</td>
          <td style="font-size:.72rem;color:var(--text-2)">${s.ed||'-'}</td>
          <td class="num" style="font-weight:600">${s.ts!=null?s.ts.toFixed(1):'-'}</td>
          ${!hideFullScore?`<td class="num" style="color:var(--text-2)">${s.fs!=null?s.fs:'-'}</td>`:''}
          <td>${gradeHtml||'-'}</td>
          <td class="num">${s.dcq?s.dcq.toFixed(1):'-'}</td>
          <td class="num">${s.dcr?s.dcr.toFixed(1):'-'}</td>
          <td class="num">${s.svc?s.svc.toFixed(1):'-'}</td>
          <td class="num">${s.qr?s.qr.toFixed(1):'-'}</td>
          <td class="num">${s.att?s.att.toFixed(1):'-'}</td>
          <td class="num">${s.pp?s.pp.toFixed(1):'-'}</td>
          <td class="num">${s.cr?s.cr.toFixed(1):'-'}</td>
          <td class="num">${s.cq?s.cq.toFixed(1):'-'}</td>
          <td>${s.io==='是'?'<span style="color:var(--green)">✓</span>':'-'}</td>
          <td>${s.ir==='是'?'<span style="color:var(--green)">✓</span>':'-'}</td>
        </tr>`;
      }).join(''):'<tr><td colspan="25" class="empty-msg">请选择教师和评级查看学员明细</td></tr>'}
    </tbody>
  </table></div></div>`;

  return html;
}

function renderNotStartedTab(){
  const students=getNotStartedStudents();
  // 按教师聚合
  const teacherMap={};
  students.forEach(s=>{
    if(!teacherMap[s.t])teacherMap[s.t]={name:s.t,subject:s.s,count:0,classes:new Set(),startDate:s.sd,endDate:s.ed};
    teacherMap[s.t].count++;
    if(s.cc)teacherMap[s.t].classes.add(s.cc);
  });
  const teachers=Object.values(teacherMap).sort((a,b)=>b.count-a.count);

  // 按学科聚合
  const subjectMap={};
  students.forEach(s=>{
    if(!subjectMap[s.s])subjectMap[s.s]={name:s.s,count:0,teachers:new Set()};
    subjectMap[s.s].count++;
    if(s.t)subjectMap[s.s].teachers.add(s.t);
  });
  const subjects=Object.values(subjectMap).sort((a,b)=>b.count-a.count);

  return `
  <div class="tabs">
    <button class="tab active">未开课班级</button>
  </div>
  <div class="filter-bar">
    <span class="info-count">共 ${students.length} 名学员 · ${teachers.length} 位教师 · ${subjects.length} 个学科 · 未开课班级不参与续班率计算</span>
  </div>

  <!-- 学科汇总卡片 -->
  <div class="kpi-row" style="margin-bottom:16px">
    ${subjects.map(sub=>`<div class="kpi"><div class="label">${sub.name}</div><div class="val brand">${sub.count}</div><div class="sub">${sub.teachers.size} 位教师</div></div>`).join('')}
  </div>

  <!-- 教师汇总表（不含学员明细和标签） -->
  <div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr>
      <th>教师姓名</th><th>科目</th><th>学员人数</th><th>班级数量</th><th>开课日期</th><th>结课日期</th>
    </tr></thead>
    <tbody>
      ${teachers.map(t=>`<tr>
        <td><span class="teacher-link" onclick="openTeacherDetail('${t.name}')">${t.name}</span></td>
        <td>${t.subject||'-'}</td>
        <td class="num">${t.count}</td>
        <td class="num">${t.classes.size}</td>
        <td style="font-size:.72rem;color:var(--text-2)">${t.startDate||'-'}</td>
        <td style="font-size:.72rem;color:var(--text-2)">${t.endDate||'-'}</td>
      </tr>`).join('')}
    </tbody>
  </table></div></div>
  ${renderRules()}`;
