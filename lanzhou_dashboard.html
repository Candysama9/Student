function computeBins(students,field,binSize,max){
  const bins=[];
  for(let lo=0;lo<max;lo+=binSize){
    const hi=lo+binSize;
    const inBin=students.filter(s=>{
      const v=s[field];
      return v!=null&&v>=lo&&v<hi;
    });
    const orig=inBin.filter(s=>s.io==='是').length;
    const ren=inBin.filter(s=>s.ir==='是').length;
    bins.push({
      label:`${lo}-${hi}分`,
      count:inBin.length,
      original:orig,
      renewal:ren,
      renewal_rate:orig?Math.round(ren/orig*1000)/10:0
    });
  }
  return bins;
}

function renderBinnedCharts(students){
  const textColor='#5a5a6e';
  const gridColor='rgba(0,0,0,.04)';
  const CHART_FONT="'FZDaBiaoSong','方正大标宋简体','PingFang SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif";

  // 动态计算分档数据，随状态筛选实时更新
  const scoreBins=computeBins(students,'ts',10,100);
  const dcqBins=computeBins(students,'dcq',3,15);
  const dcrBins=computeBins(students,'dcr',5,45);

  // iOS 色阶：按续班率返回颜色（绿高/金中/红低）
  const IOS_GREEN='#30D158';
  const IOS_GOLD='#FF9F0A';
  const IOS_RED='#FF453A';
  function rrColor(v){
    if(v>=35)return IOS_GREEN;
    if(v>=25)return '#7ED957';
    if(v>=15)return IOS_GOLD;
    if(v>=8)return '#FF6B6B';
    return IOS_RED;
  }
  function hexA(hex,a){
    const h=hex.replace('#','');
    const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // 三图区分配色：折线+点用不同色系，避免三图一模一样
  const CHART_THEMES={
    'chart-score-rr':{lineColor:'#0A84FF',lineBg:'rgba(10,132,255',label:'总分'},
    'chart-dcq-rr':{lineColor:'#5E5CE6',lineBg:'rgba(94,92,230',label:'深聊质量'},
    'chart-dcr-rr':{lineColor:'#008B8B',lineBg:'rgba(0,139,139',label:'深聊轮次'},
  };

  function makeBinnedChart(canvasId,binData){
    const c=document.getElementById(canvasId);
    if(!c)return;
    const theme=CHART_THEMES[canvasId]||CHART_THEMES['chart-score-rr'];

    // 自动计算右轴范围：取续班率最大值向上取整到5的倍数，最小给到10%
    const maxRR=Math.max(...binData.map(b=>b.renewal_rate),0);
    const y1Max=Math.max(Math.ceil(maxRR/5)*5,10);

    // 过滤掉 count=0 的空分档，避免多余空白
    const visibleBins=binData.filter(b=>b.count>0);

    chartInstances[canvasId]=new Chart(c,{
      data:{
        labels:visibleBins.map(b=>b.label),
        datasets:[
          {type:'bar',label:'总人次',data:visibleBins.map(b=>b.count),
            order:2,
            backgroundColor:(ctx)=>{
              const idx=ctx.dataIndex;
              const v=(visibleBins[idx]&&visibleBins[idx].renewal_rate)||0;
              const c=rrColor(v);
              const chart=ctx.chart;const{chartArea}=chart;
              if(!chartArea)return c;
              const g=chart.ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
              g.addColorStop(0,c);
              g.addColorStop(1,hexA(c,0.25));
              return g;
            },
            borderRadius:8,borderSkipped:false,
            barPercentage:0.7,categoryPercentage:0.8,
            yAxisID:'y'},
          {type:'line',label:'续班率',data:visibleBins.map(b=>b.renewal_rate>0?b.renewal_rate:null),
            order:1,
            borderColor:theme.lineColor,
            backgroundColor:(ctx)=>{
              const chart=ctx.chart;const{chartArea}=chart;
              if(!chartArea)return theme.lineBg+',.1)';
              const g=chart.ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
              g.addColorStop(0,theme.lineBg+',.25)');
              g.addColorStop(1,theme.lineBg+',0)');
              return g;
            },
            borderWidth:4,pointRadius:6,pointBackgroundColor:theme.lineColor,
            pointBorderColor:'#fff',pointBorderWidth:2.5,pointHoverRadius:8,
            tension:.35,yAxisID:'y1',
            // 零值断开折线：0%的点设为null，避免折线贴着X轴形成误导
            spanGaps:true}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        layout:{padding:{top:24}},
        plugins:{legend:{display:true,position:'top',
            labels:{font:{family:CHART_FONT,size:12,weight:'600'},boxWidth:12,usePointStyle:true,pointStyle:'circle',padding:12}}},
        scales:{
          x:{grid:{display:false},
            ticks:{font:{family:CHART_FONT,size:11,weight:'500'},maxRotation:45,minRotation:0,autoSkip:false}},
          y:{type:'linear',position:'left',grid:{color:gridColor},
            title:{display:true,text:'人次',font:{family:CHART_FONT,size:12,weight:'700'}},
            ticks:{font:{family:CHART_FONT,size:11,weight:'600'},precision:0},
            beginAtZero:true},
          y1:{type:'linear',position:'right',grid:{display:false},
            min:0,max:y1Max,
            title:{display:true,text:'续班率',font:{family:CHART_FONT,size:12,weight:'700'}},
            ticks:{callback:v=>v+'%',font:{family:CHART_FONT,size:11,weight:'600'},stepSize:y1Max<=10?2:5}}
        },
        animation:{duration:600,easing:'easeOutQuart'}
      },
      plugins:[{
        id:'binValLabels',
        afterDatasetsDraw(chart){
          const{ctx}=chart;
          // 先收集所有标签位置，检测碰撞
          const barLabels=[];
          const lineLabels=[];
          // 柱状图顶部数值
          chart.data.datasets[0].data.forEach((v,i)=>{
            const bar=chart.getDatasetMeta(0).data[i];
            if(!bar)return;
            barLabels.push({x:bar.x,y:bar.y-12,val:v,barY:bar.y});
          });
          // 折线点续班率标签
          chart.data.datasets[1].data.forEach((v,i)=>{
            if(!v||v<=0)return;
            const pt=chart.getDatasetMeta(1).data[i];
            if(!pt)return;
            lineLabels.push({x:pt.x,y:pt.y-14,val:v});
          });
          // 检测碰撞：如果柱状图标签和折线标签在同一x位置且y距离小于22px，则柱状图标签移到柱内
          barLabels.forEach(bl=>{
            let collision=false;
            for(const ll of lineLabels){
              if(Math.abs(bl.x-ll.x)<5&&Math.abs(bl.y-ll.y)<22){
                collision=true;break;
              }
            }
            ctx.save();
            ctx.fillStyle='#3d3d5c';
            ctx.font='700 12px '+CHART_FONT.replace(/'/g,'');
            ctx.textAlign='center';
            ctx.shadowColor='rgba(0,0,0,0.15)';ctx.shadowBlur=2;ctx.shadowOffsetY=1;
            if(collision){
              // 碰撞时：柱状图数值显示在柱内顶部（白色字）
              ctx.fillStyle='rgba(255,255,255,.95)';
              ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=3;
              ctx.fillText(bl.val,bl.x,bl.barY+16);
            }else{
              ctx.fillText(bl.val,bl.x,bl.y);
            }
            ctx.restore();
          });
          // 折线标签始终显示在点上方
          lineLabels.forEach(ll=>{
            ctx.save();
            ctx.fillStyle=theme.lineColor;
            ctx.font='700 11px '+CHART_FONT.replace(/'/g,'');
            ctx.textAlign='center';
            ctx.shadowColor='rgba(0,0,0,0.2)';ctx.shadowBlur=3;ctx.shadowOffsetY=1;
            ctx.fillText(ll.val.toFixed(1)+'%',ll.x,ll.y);
            ctx.restore();
          });
        }
      }]
    });
  }

  makeBinnedChart('chart-score-rr',scoreBins);
  makeBinnedChart('chart-dcq-rr',dcqBins);
  makeBinnedChart('chart-dcr-rr',dcrBins);
}

// ============================================================
// 教师详情弹窗
// ============================================================
function openTeacherDetail(teacherName){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay show';
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};

  let students=DASHBOARD.all_students.filter(s=>s.t===teacherName);
  if(activeStatus!=='all'&&activeStatus!=='未开课班级')students=students.filter(s=>s.cs===activeStatus);

  const orig=students.filter(s=>s.io==='是').length;
  const ren=students.filter(s=>s.ir==='是').length;
  const rr=orig?ren/orig*100:0;
  const scores=students.filter(s=>s.ts!=null).map(s=>s.ts);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const grades=students.filter(s=>s.sg);
  const sa=grades.filter(s=>s.sg==='S'||s.sg==='A').length;

  overlay.innerHTML=`
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>${teacherName} · 学员明细</h3>
          <div style="font-size:.72rem;color:var(--text-2);margin-top:3px">
            人次 ${students.length} · 原班 ${orig} · 续班 ${ren} · 续班率 ${rr.toFixed(1)}% · 均分 ${avg.toFixed(1)} · SA ${sa}人
          </div>
        </div>
        <button class="close" onclick="this.closest('.modal-overlay').remove()">×</button>
      </div>
      <div class="modal-body">
        <div class="table-scroll" style="max-height:60vh">
          <table>
            <thead><tr>
              <th>标签</th><th>学员</th><th>科目</th><th>班级</th><th>状态</th><th>开课</th><th>结课</th>
              <th>总分</th><th>评级</th>
              <th>深聊质量</th><th>深聊轮次</th><th>服务卡</th><th>题目回收</th>
              <th>出勤率</th><th>进步感知</th><th>课次报告</th><th>连续在读</th>
              <th>原班</th><th>续班</th>
            </tr></thead>
            <tbody>
              ${students.map(s=>{
                const gh=s.sg?`<span class="grade grade-${s.sg}">${s.sg}</span>`:(s.fg?`<span class="grade grade-${s.fg}">${s.fg}</span>`:'-');
                return `<tr>
                  <td class="tags-cell"><div class="tag-row">${renderTags(s.tags)}</div></td>
                  <td class="name-cell" style="font-weight:500">${s.n||'-'}</td>
                  <td>${s.s}</td>
                  <td style="font-size:.7rem;color:var(--text-2)">${s.cc||'-'}</td>
                  <td style="font-size:.72rem;color:var(--text-2)">${s.cs}</td>
                  <td style="font-size:.72rem;color:var(--text-2)">${s.sd||'-'}</td>
                  <td style="font-size:.72rem;color:var(--text-2)">${s.ed||'-'}</td>
                  <td class="num" style="font-weight:600">${s.ts!=null?s.ts.toFixed(1):'-'}</td>
                  <td>${gh||'-'}</td>
                  <td class="num">${s.dcq?s.dcq.toFixed(1):'-'}</td>
                  <td class="num">${s.dcr?s.dcr.toFixed(1):'-'}</td>
                  <td class="num">${s.svc?s.svc.toFixed(1):'-'}</td>
                  <td class="num">${s.qr?s.qr.toFixed(1):'-'}</td>
                  <td class="num">${s.att?s.att.toFixed(1):'-'}</td>
                  <td class="num">${s.pp?s.pp.toFixed(1):'-'}</td>
                  <td class="num">${s.cr?s.cr.toFixed(1):'-'}</td>
                  <td class="num">${s.cq?s.cq.toFixed(1):'-'}</td>
                  <td>${s.io==='是'?'<span style="color:var(--green)">✓</span>':'-'}</td>
                  <td>${s.ir==='是'?'<span style="color:var(--green)">✓</span>':'-'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

// ============================================================
// 交互
// ============================================================
function switchTab(tab){activeTab=tab;sortCol='renewal_rate';sortDir='desc';teacherSearch='';studentSearch='';selectedTeacher='';activeGradeFilter='all';activeTagFilters=new Set();keyFollowFilter=false;activeSubjectFilter='';trendSubjectFilter='';if(tab.startsWith('subject_'))trendTab='subject';else trendTab='overall';render();}
function switchStatus(status){activeStatus=status;selectedTeacher='';activeGradeFilter='all';activeTagFilters=new Set();keyFollowFilter=false;activeSubjectFilter='';trendSubjectFilter='';trendTab='overall';render();}
function switchSubjectFilter(subject){activeSubjectFilter=subject;sortCol='renewal_rate';sortDir='desc';render();}
function selectTeacher(t){selectedTeacher=t;closeDropdown();if(t)trendTab='teacher';render();}
function filterGrade(g){activeGradeFilter=g;activeTagFilters=new Set();keyFollowFilter=false;render();}
// 重点跟进筛选切换：开启时重置评级和标签筛选
function toggleKeyFollow(){
  keyFollowFilter=!keyFollowFilter;
  if(keyFollowFilter){activeGradeFilter='all';activeTagFilters=new Set();}
  render();
}
// 标签筛选：多选切换。点击"全部"清空所有选中；点击具体标签切换其选中状态。
function filterTag(t){
  if(t==='all'){activeTagFilters=new Set();}
  else if(activeTagFilters.has(t)){activeTagFilters.delete(t);}
  else{activeTagFilters.add(t);}
  render();
}
function toggleDropdown(){
  const dd=document.getElementById('teacherDropdown');
  if(dd)dd.classList.toggle('open');
}
function closeDropdown(){
  const dd=document.getElementById('teacherDropdown');
  if(dd)dd.classList.remove('open');
}
function onTeacherSearch(v){
  teacherSearch=v;
  if(window._st)clearTimeout(window._st);
  window._st=setTimeout(()=>{render();const i=document.querySelector('.search-box');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);
}
function onStudentSearch(v){
  studentSearch=v;
  if(window._ss)clearTimeout(window._ss);
  window._ss=setTimeout(()=>{render();const i=document.querySelector('.search-box');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},200);
}
function sortBy(col){
  if(sortCol===col){sortDir=sortDir==='asc'?'desc':'asc';}
  else{sortCol=col;sortDir='desc';}
  render();
}

// 点击外部关闭下拉
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.dropdown'))closeDropdown();
});

// ============================================================
// 启动
// ============================================================
async function init(){
  try{
    DASHBOARD=await loadData();
    // 并行加载日数据历史（失败不阻塞主看板）
    try{DAILY_HISTORY=await loadHistory();}catch(e){console.warn('日数据历史加载失败:',e);}
    // 默认班级状态优先级：已开窗 → 已开课 → 已结课
    const ss=DASHBOARD.meta.status_stats;
    if((ss['已开窗班级']||{}).count>0)activeStatus='已开窗班级';
    else if((ss['已开课班级']||{}).count>0)activeStatus='已开课班级';
    else if((ss['已结课班级']||{}).count>0)activeStatus='已结课班级';
    else activeStatus='all';
    document.getElementById('app').innerHTML='';
    render();
  }catch(e){
    document.getElementById('loading').innerHTML=`
      <div style="text-align:center;padding:60px 20px">
        <p style="color:var(--red);font-size:1rem;font-weight:600">数据加载失败</p>
        <p style="color:var(--text-2);font-size:.82rem;margin-top:8px">${e.message}</p>
        <p style="color:var(--text-3);font-size:.72rem;margin-top:12px">请稍后刷新重试，或直接访问：<a href="lanzhou_dashboard.json" style="color:var(--brand)">lanzhou_dashboard.json</a> 检查数据文件是否存在</p>
        <button onclick="location.reload()" style="margin-top:16px;padding:8px 24px;border:1px solid var(--brand);border-radius:8px;background:var(--glass);color:var(--brand);cursor:pointer;font-family:var(--font)">重新加载</button>
      </div>`;
  }
}

// iOS Liquid Glass 鼠标追踪镜面高光：实时更新 --mx/--my 自定义属性，::before 高光跟随光标
// 使用事件委托，确保动态渲染的 .kpi/.binned-card/.chart-card 均可生效
(function(){
  document.addEventListener('mousemove',function(e){
    const el=e.target.closest('.kpi,.binned-card,.chart-card');
    if(!el)return;
    const r=el.getBoundingClientRect();
    const mx=((e.clientX-r.left)/r.width*100).toFixed(1);
    const my=((e.clientY-r.top)/r.height*100).toFixed(1);
    el.style.setProperty('--mx',mx+'%');
    el.style.setProperty('--my',my+'%');
  },{passive:true});
})();

init();
</script>
