<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>中心管理者总看板 · 全校核心数据汇总</title>
<style>
@font-face{font-family:'FZDaBiaoSong';src:local('方正大标宋简体'),local('FZDaBiaoSongJianTi'),local('FZDBSJW--GB1-0'),url('FZDBSJW.woff') format('woff');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-0:#f0f2f8;--bg-1:#ffffff;--bg-2:#e8edf5;
  --glass:rgba(255,255,255,.45);--glass-brd:rgba(255,255,255,.3);
  --glass-fill:rgba(255,255,255,.35);
  --glass-hi:rgba(0,122,255,.08);
  --glass-shadow:rgba(0,0,0,.04);
  --liquid-blur:blur(36px) saturate(220%);
  --liquid-blur-sm:blur(20px) saturate(180%);
  --liquid-blur-lg:blur(52px) saturate(250%);
  --liquid-fill:rgba(255,255,255,.22);
  --liquid-ripple:radial-gradient(circle,rgba(255,255,255,.4) 0%,transparent 60%);
  --liquid-fill-strong:rgba(255,255,255,.4);
  --liquid-stroke:1px solid rgba(255,255,255,.4);
  --liquid-highlight:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.15);
  --liquid-specular:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 48%,rgba(255,255,255,.08) 52%,transparent 65%);
  --text-0:#1a1a2e;--text-1:#3d3d5c;--text-2:#6e6e80;--text-3:#9e9eaf;
  --brand:#007AFF;--brand-2:#5856D6;--brand-glow:rgba(0,122,255,.22);
  --accent:#00C7BE;--accent-2:#30D5C8;--accent-light:rgba(0,199,190,.1);
  --green:#34C759;--green-bg:rgba(52,199,89,.12);
  --gold:#FF9500;--gold-bg:rgba(255,149,0,.12);
  --blue:#007AFF;--blue-bg:rgba(0,122,255,.10);
  --red:#FF3B30;--red-bg:rgba(255,59,48,.10);
  --gray:#8E8E93;--gray-bg:rgba(142,142,147,.12);
  --radius:24px;--radius-sm:18px;--radius-lg:32px;--radius-xl:42px;--radius-2xl:52px;
  --shadow:0 4px 24px rgba(0,0,0,.08),0 0 0 1px rgba(255,255,255,.15) inset,var(--liquid-highlight);
  --shadow-lg:0 20px 56px rgba(0,0,0,.16),0 0 0 1px rgba(255,255,255,.22) inset,var(--liquid-highlight);
  --shadow-glow:0 8px 28px rgba(0,122,255,.18);
  --transition:cubic-bezier(.4,0,.2,1);
  --font:'FZDaBiaoSong','方正大标宋简体',-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;
  --mono:'FZDaBiaoSong','方正大标宋简体',"SF Mono","PingFang SC",monospace;
}
html{font-size:14px;scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg-0);color:var(--text-0);
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:-10%;z-index:-1;
  background:
    radial-gradient(ellipse 60% 50% at 12% 8%,rgba(0,122,255,.25),transparent 60%),
    radial-gradient(ellipse 50% 40% at 88% 22%,rgba(88,86,214,.22),transparent 60%),
    radial-gradient(ellipse 60% 45% at 50% 100%,rgba(0,199,190,.20),transparent 60%),
    radial-gradient(ellipse 45% 35% at 80% 80%,rgba(255,149,0,.15),transparent 60%),
    radial-gradient(ellipse 40% 30% at 18% 75%,rgba(52,199,89,.15),transparent 60%),
    radial-gradient(ellipse 35% 25% at 65% 45%,rgba(255,94,138,.12),transparent 60%),
    linear-gradient(135deg,#eef2fb 0%,#f5f0fa 50%,#eaf6f4 100%);
  background-size:200% 200%,220% 220%,200% 200%,220% 220%,200% 200%,200% 200%,100% 100%;
  animation:liquidFlow 18s ease-in-out infinite alternate;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 50%,rgba(255,255,255,.06) 100%);
}
@keyframes liquidFlow{
  0%{background-position:0% 0%,100% 0%,50% 100%,100% 100%,0% 100%,30% 50%,0 0}
  50%{background-position:30% 20%,70% 30%,60% 80%,80% 70%,20% 80%,50% 30%,0 0}
  100%{background-position:60% 40%,40% 60%,40% 60%,60% 40%,40% 60%,70% 70%,0 0}
}

/* Liquid Glass specular + cursor highlight */
.kpi,.chart-card,.table-wrap,.trend-section,.status-bar{
  position:relative;
}
.kpi::after,.table-wrap::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:var(--liquid-specular);background-size:300% 100%;
  opacity:0;transition:opacity .5s var(--transition);
  animation:specularFlow 8s ease-in-out infinite;
}
.kpi:hover::after,.table-wrap:hover::after{opacity:1;animation-duration:3s}
@keyframes specularFlow{0%,100%{background-position:0% 0%}50%{background-position:100% 0%}}

.kpi{--mx:50%;--my:50%;}
.kpi::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:radial-gradient(circle 180px at var(--mx) var(--my),rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 35%,transparent 60%);
  opacity:0;transition:opacity .4s var(--transition);mix-blend-mode:screen;
}
.kpi:hover::before{opacity:1}

.wrap{max-width:1680px;margin:0 auto;padding:16px 24px 60px}

/* Header */
.header{display:flex;align-items:center;justify-content:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;position:relative}
.header-left{text-align:center}
.header-left h1{
  font-size:2rem;font-weight:900;letter-spacing:-0.5px;
  display:inline-block;padding:14px 40px;border-radius:999px;
  background:linear-gradient(120deg,#2b3a5c,#5b8cff 60%,#8a6cff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  border:var(--liquid-stroke);
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow),var(--liquid-highlight);position:relative;overflow:hidden;
  text-shadow:0 2px 8px rgba(91,140,255,.15)}
.header-left h1::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:var(--liquid-fill)}
.header-left h1::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:var(--liquid-specular);background-size:300% 100%;opacity:.5;
  animation:specularFlow 8s ease-in-out infinite}
.header-left .sub{font-size:.78rem;color:var(--text-2);margin-top:8px;font-weight:500}
.header-right{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.data-badge{
  padding:6px 14px;border-radius:999px;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  font-size:.72rem;color:var(--text-1);display:flex;align-items:center;gap:6px;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:0 2px 12px rgba(0,0,0,.06),var(--liquid-highlight);
  transition:all .3s var(--transition);
}
.data-badge:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.10),var(--liquid-highlight)}
.data-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* KPI Cards */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.kpi{
  position:relative;overflow:hidden;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius);padding:18px 20px;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);text-align:center;
  transition:transform .35s var(--transition),box-shadow .35s var(--transition),border-color .35s var(--transition);
}
.kpi:hover{transform:translateY(-4px) scale(1.01);box-shadow:var(--shadow-lg),0 0 24px var(--brand-glow);border-color:rgba(255,255,255,.5)}
.kpi .label{font-size:.68rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;text-align:center}
.kpi .val{font-size:1.85rem;font-weight:700;font-family:var(--mono);color:var(--text-0);position:relative;z-index:1;text-align:center}
.kpi .val.brand{color:var(--brand)}
.kpi .val.green{color:var(--green)}
.kpi .val.gold{color:var(--gold)}
.kpi .val.accent{color:var(--accent)}
.kpi .val.purple{color:var(--brand-2)}
.kpi .sub{font-size:.68rem;color:var(--text-3);margin-top:4px;position:relative;z-index:1;text-align:center}
.kpi .sub .up{color:var(--green)}
.kpi .sub .down{color:var(--red)}

/* Table */
.table-wrap{
  background:var(--liquid-fill);border:var(--liquid-stroke);
  border-radius:var(--radius-lg);overflow:hidden;
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow);
  transition:transform .35s var(--transition),box-shadow .35s var(--transition),border-color .35s var(--transition);
}
.table-scroll{overflow-x:auto;max-height:none}
table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:1100px}
thead{position:sticky;top:0;z-index:10}
thead th{
  background:rgba(255,255,255,.96);backdrop-filter:var(--liquid-blur);
  padding:12px 14px;text-align:center;font-weight:600;color:var(--text-1);
  white-space:nowrap;border-bottom:1px solid var(--glass-brd);
  user-select:none;transition:color .15s,background .15s;
}
thead th:hover{color:var(--brand);background:rgba(255,255,255,1)}
thead th .col-sub{display:block;font-size:.58rem;font-weight:400;color:var(--text-3);margin-top:2px}
tbody tr{border-bottom:1px solid rgba(0,0,0,.03);transition:background .2s,box-shadow .2s}
tbody tr:hover{background:rgba(0,122,255,.06);box-shadow:inset 0 0 0 1px rgba(0,122,255,.10)}
tbody td{padding:10px 14px;white-space:nowrap;color:var(--text-1);text-align:center;vertical-align:middle}
tbody td.num{font-family:var(--mono);text-align:center}

/* School name cell */
.school-cell{text-align:left!important;padding-left:18px!important}
.school-link{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.88rem;font-weight:700;color:var(--text-0);
  text-decoration:none;padding:6px 14px;border-radius:12px;
  transition:all .25s var(--transition);
  background:rgba(255,255,255,.4);border:1px solid var(--glass-brd);
}
.school-link:hover{
  background:linear-gradient(135deg,rgba(0,122,255,.12),rgba(88,86,214,.08));
  border-color:var(--brand-glow);color:var(--brand);
  transform:translateX(3px);box-shadow:0 4px 14px rgba(0,122,255,.12);
}
.school-link .arrow{font-size:.7rem;opacity:.5;transition:opacity .2s,transform .2s}
.school-link:hover .arrow{opacity:1;transform:translateX(3px)}

/* Rate value coloring */
.rate-cell{text-align:center}
.rate-val{font-family:var(--mono);font-size:.85rem;font-weight:700;display:block}
.rate-val.r-green{color:var(--green)}
.rate-val.r-gold{color:var(--gold)}
.rate-val.r-default{color:var(--text-1)}
.rate-val.r-dash{color:var(--text-3);font-weight:400}
.rate-change{font-size:.62rem;font-weight:600;display:inline-flex;align-items:center;gap:1px;margin-top:2px}
.rate-change.up{color:var(--green)}
.rate-change.down{color:var(--red)}
.rate-change.flat{color:var(--text-3)}
.rate-change.dash{color:var(--text-3)}

/* Progress badge */
.progress-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 12px;border-radius:999px;font-size:.72rem;font-weight:600;
  background:var(--blue-bg);color:var(--blue);border:1px solid rgba(0,122,255,.2);
}
.progress-badge .day{font-family:var(--mono)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:14px}
.spinner{width:40px;height:40px;border:3px solid var(--glass-brd);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text-2);font-size:.82rem}
.loading .progress-text{font-size:.72rem;color:var(--text-3);margin-top:4px}
.loading .progress-bar{width:280px;height:6px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden;margin-top:6px}
.loading .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:3px;transition:width .4s var(--transition);width:0%}

/* Hidden */
.hidden{display:none!important}

/* Footer */
.contact-footer{text-align:center;padding:20px 0 28px;margin-top:20px;color:var(--text-3);font-size:.78rem}
.contact-footer a{color:var(--brand);text-decoration:none;font-weight:500}
.contact-footer a:hover{text-decoration:underline}

/* Nav switch */
.nav-switch{
  display:flex;gap:0;border-radius:999px;overflow:hidden;
  background:var(--liquid-fill);border:var(--liquid-stroke);
  backdrop-filter:var(--liquid-blur);-webkit-backdrop-filter:var(--liquid-blur);
  box-shadow:var(--shadow),var(--shadow-glow);
}
.nav-switch a{
  padding:8px 18px;font-size:.78rem;font-weight:600;text-decoration:none;
  color:var(--text-2);transition:all .3s var(--transition);font-family:var(--font);
  display:flex;align-items:center;gap:5px;
}
.nav-switch a:hover{color:var(--text-0);background:rgba(255,255,255,.15)}
.nav-switch a.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;box-shadow:0 2px 12px var(--brand-glow);
}

/* Summary note */
.summary-note{
  font-size:.72rem;color:var(--text-3);margin-bottom:14px;padding:8px 16px;
  background:rgba(255,255,255,.4);border:1px solid var(--glass-brd);
  border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;
  backdrop-filter:var(--liquid-blur-sm);-webkit-backdrop-filter:var(--liquid-blur-sm);
}
.summary-note .dot-i{color:var(--brand)}

@media(max-width:768px){
  .header-left h1{font-size:1.3rem;padding:10px 20px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .header{flex-direction:column;gap:10px}
  .header-right{position:static;transform:none;justify-content:center;width:100%}
}

/* ===== Visit Stats Section ===== */
.visit-stats-section{margin-top:28px}
.visit-stats-section .section-title{
  font-size:1.05rem;font-weight:700;color:var(--text-0);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.visit-stats-section .section-title .icon{font-size:1.2rem}
.stats-table{width:100%;border-collapse:collapse;font-size:.82rem}
.stats-table th{
  background:rgba(0,122,255,.08);color:var(--text-1);font-weight:600;
  padding:10px 14px;text-align:center;white-space:nowrap;
  border-bottom:2px solid rgba(0,122,255,.15);
}
.stats-table td{
  padding:10px 14px;text-align:center;border-bottom:1px solid rgba(0,0,0,.05);
  color:var(--text-1);
}
.stats-table tr:hover td{background:rgba(0,122,255,.03)}
.stats-table .page-name{text-align:left;font-weight:600;color:var(--text-0)}
.stats-table .view-count{font-size:1rem;font-weight:700;color:var(--brand);font-family:var(--mono)}
.stats-table .cat-tag{display:inline-block;padding:2px 10px;border-radius:100px;font-size:.68rem;font-weight:600}
.stats-table .cat-入口{background:rgba(255,149,0,.12);color:var(--gold)}
.stats-table .cat-看板{background:rgba(0,122,255,.1);color:var(--brand)}
.stats-table .cat-话术库{background:rgba(52,199,89,.12);color:var(--green)}
.stats-table{min-width:auto!important}
.stats-table .loading-cell{color:var(--text-3);font-size:.78rem}
.stats-summary{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.stats-summary .item{padding:8px 20px;border-radius:14px;background:var(--glass);backdrop-filter:var(--liquid-blur-sm);border:1px solid var(--glass-brd)}
.stats-summary .item .label{font-size:.7rem;color:var(--text-3);margin-bottom:2px}
.stats-summary .item .val{font-size:1.3rem;font-weight:700;color:var(--brand);font-family:var(--mono)}
.stats-refresh-btn{
  margin-left:auto;padding:6px 16px;border:1px solid var(--glass-brd);
  background:var(--glass);backdrop-filter:var(--liquid-blur-sm);
  border-radius:100px;font-size:.78rem;font-weight:600;color:var(--brand);
  cursor:pointer;transition:all .3s var(--transition);
}
.stats-refresh-btn:hover{background:var(--brand);color:#fff}

</style>
</head>
<body>

<!-- Main App -->
<div class="wrap" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">正在加载各校数据...</p>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">准备中...</p>
  </div>

  <div id="content" class="hidden">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>中心管理者总看板</h1>
        <div class="sub">全校核心数据汇总 · 一键跳转各校看板</div>
      </div>
      <div class="header-right">
        <div class="data-badge" id="dataBadge">
          <span class="dot"></span>
          <span id="badgeText">数据加载中</span>
        </div>
      </div>
    </div>

    <!-- Top KPI Summary -->
    <div class="kpi-row" id="kpiRow"></div>

    <!-- Summary Note -->
    <div class="summary-note">
      <span class="dot-i">&#9432;</span>
      <span>续班率颜色：<span style="color:var(--green);font-weight:600">绿色</span> &ge;40% &nbsp;|&nbsp; <span style="color:var(--gold);font-weight:600">金色</span> &ge;20% &nbsp;|&nbsp; 环比 <span style="color:var(--green)">&#9650;</span>涨 <span style="color:var(--red)">&#9660;</span>跌</span>
    </div>

    <!-- School Comparison Table -->
    <div class="table-wrap">
      <div class="table-scroll">
        <table id="schoolTable">
          <thead>
            <tr>
              <th>学校</th>
              <th>教师数</th>
              <th>总人次</th>
              <th>已开窗续班率<span class="col-sub">当期 / 环比</span></th>
              <th>已结课续班率<span class="col-sub">当期 / 环比</span></th>
              <th>SA续班率<span class="col-sub">当期 / 环比</span></th>
              <th>开课进度<span class="col-sub">第几期·第几天</span></th>
              <th>均分</th>
              <th>学情沟通均分<span class="col-sub">满分65</span></th>
              <th>SA占比</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    
    <!-- Visit Statistics -->
    <div class="visit-stats-section" id="visitStatsSection">
      <div class="section-title">
        <span class="icon">&#128202;</span>
        <span>各页面访问统计</span>
        <button class="stats-refresh-btn" onclick="loadVisitStats()">&#x1F504; 刷新</button>
      </div>
      <div class="stats-summary" id="statsSummary">
        <div class="item"><div class="label">总浏览次数</div><div class="val" id="totalViews">—</div></div>
        <div class="item"><div class="label">统计页面数</div><div class="val" id="totalPages">—</div></div>
      </div>
      <div class="table-wrap">
        <div class="table-scroll">
          <table class="stats-table">
            <thead>
              <tr>
                <th>页面</th>
                <th>分类</th>
                <th>浏览次数</th>
                <th>占比</th>
              </tr>
            </thead>
            <tbody id="statsTableBody">
              <tr><td colspan="4" class="loading-cell">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    
    <!-- Nav Switch -->
    <div style="display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap">
      <div class="nav-switch" id="navSwitch"></div>
    </div>

    <!-- Footer -->
    <div class="contact-footer">
      如有问题，钉钉联系 <a href="mailto:zhurongcheng@xdf.cn">zhurongcheng@xdf.cn</a>
    </div>
  </div>
</div>

<!-- SheetJS + JSZip for future export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
/* ===== Schools Config ===== */
const SCHOOLS=[
  {key:'chengdu',name:'成都',json:'chengdu_dashboard.json',html:'chengdu_dashboard.html',history:'daily_history.json'},
  {key:'guangzhou',name:'广州',json:'guangzhou_dashboard.json',html:'guangzhou_dashboard.html',history:'guangzhou_daily_history.json'},
  {key:'lanzhou',name:'兰州',json:'lanzhou_dashboard.json',html:'lanzhou_dashboard.html',history:'lanzhou_daily_history.json'},
  {key:'zhengzhou',name:'郑州',json:'zhengzhou_dashboard.json',html:'zhengzhou_dashboard.html',history:'zhengzhou_daily_history.json'},

/* ===== Init ===== */
async function initApp(){
  const app=document.getElementById('app');
  app.classList.remove('hidden');
  const loading=document.getElementById('loading');
  const content=document.getElementById('content');
  const progressFill=document.getElementById('progressFill');
  const progressText=document.getElementById('progressText');
  const loadingText=document.getElementById('loadingText');

  const rawData=[];
  for(let i=0;i<SCHOOLS.length;i++){
    const school=SCHOOLS[i];
    loadingText.textContent='正在加载'+school.name+'数据...';
    progressText.textContent='加载中 ('+(i+1)+'/'+SCHOOLS.length+')：'+school.name;
    progressFill.style.width=((i)/SCHOOLS.length*100)+'%';
    try{
      var _durl=school.json+'?_t='+Date.now();if(window.XDF_AUTH&&XDF_AUTH.hasWorker())_durl=XDF_AUTH.getWorkerUrl()+'/'+school.json+'?k='+encodeURIComponent(XDF_AUTH.getToken())+'&_t='+Date.now();const resp=await fetch(_durl);
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const data=await resp.json();
      let history=null;
      try{
        var _hurl=school.history+'?_t='+Date.now();if(window.XDF_AUTH&&XDF_AUTH.hasWorker())_hurl=XDF_AUTH.getWorkerUrl()+'/'+school.history+'?k='+encodeURIComponent(XDF_AUTH.getToken())+'&_t='+Date.now();const hResp=await fetch(_hurl);
        if(hResp.ok) history=await hResp.json();
      }catch(e){/* no history */}
      rawData.push({school,data,history});
    }catch(e){
      console.error('Failed to load',school.name,e);
      rawData.push({school,data:null,history:null,error:e});
    }
    progressFill.style.width=((i+1)/SCHOOLS.length*100)+'%';
  }

  loadingText.textContent='正在聚合数据...';
  progressText.textContent='计算核心指标中...';
  progressFill.style.width='100%';

  const metrics=rawData.map(({school,data,history})=>computeMetrics(school,data,history));
  const overall=computeOverall(rawData);

  renderKPIs(overall);
  renderTable(metrics);
  renderNav();

  // Update data badge
  const exportTime=rawData.find(r=>r.data&&r.data.meta&&r.data.meta.export_time);
  const badgeText=document.getElementById('badgeText');
  if(exportTime&&exportTime.data.meta.export_time){
    badgeText.textContent='数据更新：'+exportTime.data.meta.export_time;
  }else{
    badgeText.textContent='数据已加载';
  }

  loading.classList.add('hidden');
  content.classList.remove('hidden');
}

/* ===== Metrics Computation ===== */
function computeMetrics(school,data,history){
  const m={
    name:school.name,
    html:school.html,
    teachers:null,
    totalRecords:null,
    openWindowRate:null,
    openWindowChange:null,
    finishedRate:null,
    finishedChange:null,
    saRenewalRate:null,
    saRenewalChange:null,
    courseProgress:null,
    avgScore:null,
    avgScoreChange:null,
    commScore:null,
    commScoreChange:null,
    saPct:null,
    saPctChange:null,
    hasDetail:false,
    error:false,
  };
  if(!data){m.error=true;return m;}

  const meta=data.meta||{};
  const summary=data.summary||{};
  const allStudents=data.all_students||[];

  m.hasDetail=allStudents.length>0;

  // Teachers
  if(summary.total_teachers!=null){
    m.teachers=summary.total_teachers;
  }else if(data.teachers&&data.teachers.length>0){
    m.teachers=data.teachers.length;
  }

  // Total records
  m.totalRecords=meta.total_records;

  // Status stats
  const ss=meta.status_stats||{};
  const ow=ss['\u5df2\u5f00\u7a97\u73ed\u7ea7'];
  const fin=ss['\u5df2\u7ed3\u8bfe\u73ed\u7ea7'];
  if(ow&&ow.count>0){
    m.openWindowRate=ow.renewal_rate;
  }
  if(fin&&fin.count>0){
    m.finishedRate=fin.renewal_rate;
  }

  // SA renewal rate
  if(m.hasDetail){
    const saStudents=allStudents.filter(s=>s.sg==='S'||s.sg==='A');
    const saIO=saStudents.filter(s=>s.io==='\u662f');
    const saIR=saIO.filter(s=>s.ir==='\u662f');
    if(saIO.length>0){
      m.saRenewalRate=Math.round(saIR.length/saIO.length*1000)/10;
    }
  }else if(summary.sa_renewal_rate!=null){
    m.saRenewalRate=summary.sa_renewal_rate;
  }

  // Course progress
  if(m.hasDetail&&meta.data_date){
    m.courseProgress=computeCourseProgress(allStudents,meta.data_date);
  }

  // Avg score
  m.avgScore=summary.avg_total_score;

  // Comm score (dcq+dcr+svc, max 65)
  if(m.hasDetail){
    const commVals=allStudents.map(s=>(s.dcq||0)+(s.dcr||0)+(s.svc||0));
    if(commVals.length>0){
      m.commScore=Math.round(commVals.reduce((a,b)=>a+b,0)/commVals.length*100)/100;
    }
  }else if(summary.comm_score!=null){
    m.commScore=summary.comm_score;
  }

  // SA pct
  m.saPct=summary.sa_pct;

  // History-based changes (环比)
  if(history&&history.snapshots&&history.snapshots.length>=2){
    const snaps=history.snapshots;
    const latest=snaps[snaps.length-1];
    const prev=snaps[snaps.length-2];

    // by_status uses short keys
    const bs=latest.by_status||{};
    const pbs=prev.by_status||{};

    if(bs['\u5df2\u5f00\u7a97']&&pbs['\u5df2\u5f00\u7a97']&&bs['\u5df2\u5f00\u7a97'].original_count>0&&pbs['\u5df2\u5f00\u7a97'].original_count>0){
      m.openWindowChange=Math.round((bs['\u5df2\u5f00\u7a97'].renewal_rate-pbs['\u5df2\u5f00\u7a97'].renewal_rate)*10)/10;
    }
    if(bs['\u5df2\u7ed3\u8bfe']&&pbs['\u5df2\u7ed3\u8bfe']){
      m.finishedChange=Math.round((bs['\u5df2\u7ed3\u8bfe'].renewal_rate-pbs['\u5df2\u7ed3\u8bfe'].renewal_rate)*10)/10;
    }

    if(latest.overall&&prev.overall){
      m.avgScoreChange=Math.round((latest.overall.avg_score-prev.overall.avg_score)*10)/10;
      m.saPctChange=Math.round((latest.overall.sa_pct-prev.overall.sa_pct)*10)/10;

      // SA续班率环比
      if(latest.overall.sa_renewal_rate!=null&&prev.overall.sa_renewal_rate!=null){
        m.saRenewalChange=Math.round((latest.overall.sa_renewal_rate-prev.overall.sa_renewal_rate)*10)/10;
      }

      // Comm score change from metrics
      const lm=latest.overall.metrics||{};
      const pm=prev.overall.metrics||{};
      const lComm=(lm.dcq||0)+(lm.dcr||0)+(lm.svc||0);
      const pComm=(pm.dcq||0)+(pm.dcr||0)+(pm.svc||0);
      m.commScoreChange=Math.round((lComm-pComm)*100)/100;
    }
  }

  return m;
}

/* ===== Course Progress (cluster start dates) ===== */
function computeCourseProgress(students,dataDate){
  const startDates=[...new Set(students.map(s=>s.sd).filter(Boolean))].sort();
  if(startDates.length===0) return null;

  // Cluster dates with 5-day threshold
  const clusters=[];
  let currentCluster=[startDates[0]];
  for(let i=1;i<startDates.length;i++){
    const prevDate=new Date(currentCluster[currentCluster.length-1]);
    const currDate=new Date(startDates[i]);
    const diff=(currDate-prevDate)/(1000*60*60*24);
    if(diff<=5){
      currentCluster.push(startDates[i]);
    }else{
      clusters.push(currentCluster);
      currentCluster=[startDates[i]];
    }
  }
  clusters.push(currentCluster);

  const periodNum=clusters.length;
  const latestClusterStart=clusters[clusters.length-1][0];

  // Calculate day
  const start=new Date(latestClusterStart);
  const end=new Date(dataDate);
  const day=Math.floor((end-start)/(1000*60*60*24))+1;

  if(day<1) return '第'+toCN(periodNum)+'期';
  return '第'+toCN(periodNum)+'期·第'+day+'天';
}

function toCN(n){
  const cn=['零','一','二','三','四','五','六','七','八','九','十'];
  if(n<=10) return cn[n];
  if(n<20) return '十'+cn[n-10];
  return n.toString();
}

/* ===== Overall KPIs ===== */
function computeOverall(rawData){
  let totalTeachers=0;
  let totalRecords=0;
  let sumRenewal=0;
  let sumOriginal=0;
  let weightedScore=0;
  let scoreWeight=0;
  let sumSA=0;
  let saTotal=0;
  // 已开窗/已结课续班率汇总
  let owRenewal=0,owOriginal=0;
  let finRenewal=0,finOriginal=0;
  // SA续班率汇总
  let saRenewal=0,saOriginal=0;
  // 学情沟通均分汇总
  let commWeighted=0,commWeight=0;

  rawData.forEach(({data})=>{
    if(!data) return;
    const meta=data.meta||{};
    const summary=data.summary||{};
    const allStudents=data.all_students||[];

    if(summary.total_teachers) totalTeachers+=summary.total_teachers;
    if(meta.total_records) totalRecords+=meta.total_records;

    if(summary.total_renewal!=null) sumRenewal+=summary.total_renewal;
    if(summary.total_original!=null) sumOriginal+=summary.total_original;

    if(summary.avg_total_score!=null&&summary.total_original!=null){
      weightedScore+=summary.avg_total_score*summary.total_original;
      scoreWeight+=summary.total_original;
    }

    if(summary.sa_count!=null){
      sumSA+=summary.sa_count;
    }else if(summary.sa_pct!=null&&summary.total_original!=null){
      sumSA+=summary.sa_pct/100*summary.total_original;
    }
    if(summary.total_original!=null){
      saTotal+=summary.total_original;
    }

    // 已开窗/已结课续班率（从status_stats或明细计算）
    const ss=meta.status_stats||{};
    const ow=ss['已开窗班级'];
    const fin=ss['已结课班级'];
    if(ow&&ow.count>0){
      if(ow.renewal_count!=null){owRenewal+=ow.renewal_count;owOriginal+=ow.original_count||ow.count;}
      else if(ow.renewal_rate!=null&&ow.count){owRenewal+=ow.renewal_rate/100*ow.count;owOriginal+=ow.count;}
    }
    if(fin&&fin.count>0){
      if(fin.renewal_count!=null){finRenewal+=fin.renewal_count;finOriginal+=fin.original_count||fin.count;}
      else if(fin.renewal_rate!=null&&fin.count){finRenewal+=fin.renewal_rate/100*fin.count;finOriginal+=fin.count;}
    }

    // SA续班率（从明细或summary计算）
    if(allStudents.length>0){
      const saStu=allStudents.filter(s=>s.sg==='S'||s.sg==='A');
      const saIO=saStu.filter(s=>s.io==='是');
      const saIR=saIO.filter(s=>s.ir==='是');
      saRenewal+=saIR.length;
      saOriginal+=saIO.length;

      // 学情沟通均分
      const commVals=allStudents.map(s=>(s.dcq||0)+(s.dcr||0)+(s.svc||0));
      if(commVals.length>0){
        commWeighted+=commVals.reduce((a,b)=>a+b,0);
        commWeight+=commVals.length;
      }
    }else{
      // 无明细时从summary取
      if(summary.sa_renewal_rate!=null&&summary.sa_count!=null){
        saRenewal+=summary.sa_renewal_rate/100*summary.sa_count;
        saOriginal+=summary.sa_count;
      }
      if(summary.comm_score!=null&&summary.total_original!=null){
        commWeighted+=summary.comm_score*summary.total_original;
        commWeight+=summary.total_original;
      }
    }
  });

  return {
    totalTeachers,
    totalRecords,
    overallRenewalRate:sumOriginal>0?Math.round(sumRenewal/sumOriginal*1000)/10:0,
    overallAvgScore:scoreWeight>0?Math.round(weightedScore/scoreWeight*100)/100:0,
    overallSAPct:saTotal>0?Math.round(sumSA/saTotal*1000)/10:0,
    overallOWRate:owOriginal>0?Math.round(owRenewal/owOriginal*1000)/10:0,
    overallFinRate:finOriginal>0?Math.round(finRenewal/finOriginal*1000)/10:0,
    overallSARR:saOriginal>0?Math.round(saRenewal/saOriginal*1000)/10:0,
    overallComm:commWeight>0?Math.round(commWeighted/commWeight*100)/100:0,
  };
}

/* ===== Render KPIs ===== */
function renderKPIs(o){
  const row=document.getElementById('kpiRow');
  const kpis=[
    {label:'总教师数',val:o.totalTeachers,cls:'brand',sub:'各校教师之和'},
    {label:'总人次',val:o.totalRecords.toLocaleString(),cls:'accent',sub:'各校总人次之和'},
    {label:'整体续班率',val:o.overallRenewalRate+'%',cls:rateClass(o.overallRenewalRate),sub:'续班人次/原班人次'},
    {label:'已开窗续班率',val:o.overallOWRate!=null?o.overallOWRate+'%':'—',cls:rateClass(o.overallOWRate),sub:'已开窗班级汇总'},
    {label:'已结课续班率',val:o.overallFinRate!=null?o.overallFinRate+'%':'—',cls:rateClass(o.overallFinRate),sub:'已结课班级汇总'},
    {label:'SA续班率',val:o.overallSARR!=null?o.overallSARR+'%':'—',cls:rateClass(o.overallSARR),sub:'SA学员续班率'},
    {label:'整体均分',val:o.overallAvgScore,cls:'purple',sub:'加权平均（按人次）'},
    {label:'学情沟通均分',val:o.overallComm!=null?o.overallComm:'—',cls:'accent',sub:'满分65'},
    {label:'整体SA占比',val:o.overallSAPct+'%',cls:'gold',sub:'SA学员/总学员'},
  ];
  row.innerHTML=kpis.map(k=>
    '<div class="kpi">'+
    '<div class="label">'+k.label+'</div>'+
    '<div class="val '+k.cls+'">'+k.val+'</div>'+
    '<div class="sub">'+k.sub+'</div>'+
    '</div>'
  ).join('');
}

function rateClass(rate){
  if(rate==null||isNaN(rate)) return 'r-dash';
  if(rate>=40) return 'r-green';
  if(rate>=20) return 'r-gold';
  return 'r-default';
}

/* ===== Render Table ===== */
function renderTable(metrics){
  const body=document.getElementById('tableBody');
  body.innerHTML=metrics.map(m=>{
    if(m.error){
      return '<tr><td class="school-cell"><span class="school-link" style="background:rgba(255,59,48,.08);border-color:rgba(255,59,48,.2);color:var(--red)">'+m.name+' (加载失败)</span></td><td colspan="9" style="color:var(--text-3)">数据加载失败</td></tr>';
    }
    return '<tr>'+
      // School name
      '<td class="school-cell"><a class="school-link" href="'+m.html+'?k='+encodeURIComponent(XDF_AUTH.getEmail())+'">'+m.name+' <span class="arrow">&#8594;</span></a></td>'+
      // Teachers
      '<td class="num">'+(m.teachers!=null?m.teachers:'<span style="color:var(--text-3)">&mdash;</span>')+'</td>'+
      // Total records
      '<td class="num">'+(m.totalRecords!=null?m.totalRecords.toLocaleString():'<span style="color:var(--text-3)">&mdash;</span>')+'</td>'+
      // Open window renewal rate
      renderRateCell(m.openWindowRate,m.openWindowChange)+
      // Finished renewal rate
      renderRateCell(m.finishedRate,m.finishedChange)+
      // SA renewal rate
      renderRateCell(m.saRenewalRate,m.saRenewalChange)+
      // Course progress
      '<td class="num">'+(m.courseProgress?'<span class="progress-badge">'+m.courseProgress+'</span>':'<span style="color:var(--text-3)">&mdash;</span>')+'</td>'+
      // Avg score
      '<td class="num">'+(m.avgScore!=null?m.avgScore:'<span style="color:var(--text-3)">&mdash;</span>')+(m.avgScoreChange!=null?renderChange(m.avgScoreChange):'')+'</td>'+
      // Comm score
      '<td class="num">'+(m.commScore!=null?m.commScore+'<span style="font-size:.62rem;color:var(--text-3)"> /65</span>':'<span style="color:var(--text-3)">&mdash;</span>')+(m.commScoreChange!=null?renderChange(m.commScoreChange):'')+'</td>'+
      // SA pct
      '<td class="num">'+(m.saPct!=null?m.saPct+'%':'<span style="color:var(--text-3)">&mdash;</span>')+(m.saPctChange!=null?renderChange(m.saPctChange):'')+'</td>'+
    '</tr>';
  }).join('');
}

function renderRateCell(rate,change){
  if(rate==null||isNaN(rate)){
    return '<td class="rate-cell"><span class="rate-val r-dash">&mdash;</span></td>';
  }
  var cls=rateClass(rate);
  var html='<td class="rate-cell"><span class="rate-val '+cls+'">'+rate.toFixed(1)+'%</span>';
  html+=renderChange(change);
  html+='</td>';
  return html;
}

function renderChange(change){
  if(change==null||isNaN(change)) return '';
  if(change>0) return '<span class="rate-change up">&#9650;'+Math.abs(change).toFixed(1)+'</span>';
  if(change<0) return '<span class="rate-change down">&#9660;'+Math.abs(change).toFixed(1)+'</span>';
  return '<span class="rate-change flat">&#9644;0.0</span>';
}

function loadVisitStats(){
  var tbody=document.getElementById('statsTableBody');
  tbody.innerHTML='<tr><td colspan="4" class="loading-cell">正在获取各页面访问数据...</td></tr>';
  var results=[];
  var completed=0;
  var total=VISIT_PAGES.length;
  
  VISIT_PAGES.forEach(function(p){
    var url='https://api.counterapi.dev/v1/candysama9.github.io/'+p.key+'/';
    fetch(url)
      .then(function(r){return r.json();})
      .then(function(data){
        var count=(data&&data.count!==undefined)?data.count:0;
        results.push({name:p.name,cat:p.cat,count:count,file:p.file});
      })
      .catch(function(){
        results.push({name:p.name,cat:p.cat,count:0,file:p.file,error:true});
      })
      .finally(function(){
        completed++;
        if(completed===total)renderVisitStats(results);
      });
  });
}

function renderVisitStats(results){
  // Sort by count descending
  results.sort(function(a,b){return b.count-a.count;});
  
  var total=results.reduce(function(s,r){return s+r.count;},0);
  document.getElementById('totalViews').textContent=total.toLocaleString();
  document.getElementById('totalPages').textContent=results.length;
  
  var tbody=document.getElementById('statsTableBody');
  tbody.innerHTML=results.map(function(r){
    var pct=total>0?(r.count/total*100).toFixed(1):'0.0';
    var countDisplay=r.error?'<span style="color:var(--text-3)">—</span>':r.count.toLocaleString();
    return '<tr>'+
      '<td class="page-name">'+r.name+'</td>'+
      '<td><span class="cat-tag cat-'+r.cat+'">'+r.cat+'</span></td>'+
      '<td class="view-count">'+countDisplay+'</td>'+
      '<td>'+pct+'%</td>'+
    '</tr>';
  }).join('');
}

// Load stats after page content is shown
setTimeout(function(){
  if(!document.getElementById('content').classList.contains('hidden')){
    loadVisitStats();
  }else{
    // Watch for content becoming visible
    var observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        if(!document.getElementById('content').classList.contains('hidden')){
          loadVisitStats();
          observer.disconnect();
        }
      });
    });
    observer.observe(document.getElementById('content'),{attributes:true,attributeFilter:['class']});
  }
},1000);
