<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多城市数据看板 · 学员分层续班潜力</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:960px;width:90%;margin:40px auto}
.header{text-align:center;margin-bottom:48px}
.header h1{font-size:2rem;color:#fff;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.header p{color:rgba(255,255,255,.8);margin-top:8px;font-size:.95rem}
.city-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.city-card{background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-radius:20px;padding:36px 28px;text-decoration:none;color:#333;transition:all .3s ease;box-shadow:0 8px 32px rgba(0,0,0,.1);border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden}
.city-card:hover{transform:translateY(-6px);box-shadow:0 16px 48px rgba(0,0,0,.18)}
.city-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#667eea,#764ba2)}
.city-icon{font-size:2.5rem;margin-bottom:12px}
.city-name{font-size:1.5rem;font-weight:700;color:#1a1a2e;margin-bottom:6px}
.city-desc{font-size:.85rem;color:#666;line-height:1.6}
.city-stats{display:flex;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid #eee}
.stat{text-align:center;flex:1}
.stat-val{font-size:1.3rem;font-weight:700;color:#667eea}
.stat-label{font-size:.7rem;color:#999;margin-top:2px}
.footer{text-align:center;margin-top:48px;color:rgba(255,255,255,.6);font-size:.8rem}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>多城市数据看板</h1>
    <p>学员分层续班潜力 · 数据日期 2026-07-26</p>
  </div>
  <div class="city-grid">
    <a class="city-card" href="chengdu_dashboard.html">
      <div class="city-icon">🐼</div>
      <div class="city-name">成都</div>
      <div class="city-desc">79名教师 · 4个学科 · 8356名学员</div>
      <div class="city-stats">
        <div class="stat"><div class="stat-val">26.2%</div><div class="stat-label">续班率</div></div>
        <div class="stat"><div class="stat-val">24.9</div><div class="stat-label">平均总分</div></div>
      </div>
    </a>
    <a class="city-card" href="guangzhou_dashboard.html">
      <div class="city-icon">🌆</div>
      <div class="city-name">广州</div>
      <div class="city-desc">112名教师 · 5个学科 · 13170名学员</div>
      <div class="city-stats">
        <div class="stat"><div class="stat-val">12.4%</div><div class="stat-label">续班率</div></div>
        <div class="stat"><div class="stat-val">19.8</div><div class="stat-label">平均总分</div></div>
      </div>
    </a>
    <a class="city-card" href="lanzhou_dashboard.html">
      <div class="city-icon">🏔️</div>
      <div class="city-name">兰州</div>
      <div class="city-desc">41名教师 · 4个学科 · 5230名学员</div>
      <div class="city-stats">
        <div class="stat"><div class="stat-val">33.8%</div><div class="stat-label">续班率</div></div>
        <div class="stat"><div class="stat-val">21.3</div><div class="stat-label">平均总分</div></div>
      </div>
    </a>
    <a class="city-card" href="zhengzhou_dashboard.html">
      <div class="city-icon">🏛️</div>
      <div class="city-name">郑州</div>
      <div class="city-desc">54名教师 · 4个学科 · 6345名学员</div>
      <div class="city-stats">
        <div class="stat"><div class="stat-val">33.2%</div><div class="stat-label">续班率</div></div>
        <div class="stat"><div class="stat-val">30.4</div><div class="stat-label">平均总分</div></div>
      </div>
    </a>
  </div>
  <div class="footer">数据来源：观远BI · 学员分层续班潜力得分</div>
</div>
</body>
</html>
