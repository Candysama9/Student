const EMBEDDED_DATA = [{"id":"physics","name":"物理学习","icon":"⚙️","desc":"初高中物理衔接期高频问题","items":[{"type":"qa","q":"家长问：初中物理基本满分，高中怎么突然就听不懂了？","tags":["初高中衔接","成绩下滑"],"a":"家长您好，您先别急，这个情况太普遍了。孩子初中物理能考八九十分说明基础没问题，到了高中觉得吃力不是变笨了，是学习方式没跟上。初中记住结论就能拿分，高中得自己推导、定量分析，光记不行了。\n\n我课堂就是专门帮孩子做这个过渡的，不急着赶进度，先把高中的思维方式建立起来，方法对了慢慢就顺过来了，您放心。"},{"type":"qa","q":"家长问：孩子说上课听懂了，一做题就不会，怎么回事？","tags":["听懂不会做","做题困难"],"a":"家长您好，这个问题特别常见。听懂是跟着老师思路走，会做是自己独立想出来，中间差着练习。就像看别人骑自行车觉得简单，自己上去就摔。\n\n我课堂每讲完一个知识点立刻让孩子当堂独立做题，暴露真实问题我再针对性讲，练多了自己做题就有感觉了。"},{"type":"qa","q":"家长问：孩子说高中物理跟初中完全不是一回事，学得很吃力","tags":["学习吃力","不适应"],"a":"家长您好，孩子说得没错，高中物理跟初中确实不一样，有这个感受说明孩子真在学了，不是个别现象。初中比较直观生活中能看到，高中变抽象了得靠逻辑推理，孩子还在用初中那套方式学当然觉得吃力。\n\n这就是衔接班最大的价值——帮孩子平稳过这个坎。我课堂会用生活化的例子帮孩子理解抽象概念，等适应了就不觉得吃力了。"},{"type":"qa","q":"家长问：物理公式背了一堆，做题还是不会用，咋办？","tags":["公式记忆","考试不会用"],"a":"家长您好，这个太常见了。孩子公式背得滚瓜烂熟，一到考试不知道用哪个。高中公式不是背下来就会用的，关键是知道什么情况用、怎么用。\n\n我课上不教孩子\"背公式\"，教的是\"用公式\"的方法——搞清楚每个公式背后的道理，理解了原理做题自然就知道该用哪个了，不用死记硬背。"},{"type":"qa","q":"家长问：孩子做题老从第一步就错，后面全白算了","tags":["做题出错","第一步错"],"a":"家长您好，这个确实最让人心疼——后面思路是对的，就因为开头一步错了整道题分全丢。孩子出错不是不仔细，是没有固定的分析流程，每次凭感觉想，一紧张就容易漏。\n\n我课堂会帮孩子建立一套固定的解题流程，从读题到下笔全程有章法。练熟了第一步就不会再出错，好习惯一旦养成整个高中都受益。"},{"type":"qa","q":"家长问：孩子说物理太难了，学不会，没信心了","tags":["畏难情绪","没信心"],"a":"家长您好，孩子能说出\"学不会\"说明他真的努力过、挫败过，不是不想学好。这个时候千万别跟着说\"没用心\"，那只会让孩子更放弃。\n\n我带过很多孩子刚来四五十分，方法调过来后稳步上升。我课堂会从孩子稍微努力就能做对的题开始练，让他重新获得成就感，信心回来了成绩自然跟着上。"},{"type":"qa","q":"家长问：新高一要选科了，选物理还是选历史比较好？","tags":["选科规划","物理vs历史"],"a":"家长您好，选科确实是新高一家长最关心的问题。河南新高考是3+1+2模式，首选科目要在物理和历史里二选一，我的建议非常明确——只要孩子不是物理特别特别差，就一定要选物理。\n\n原因很简单：教育部规定高校92个学科门类里有65个要求必选物理，占比超过70%。选物理大学专业覆盖率能达到95%以上，选历史只有45%左右。理、工、农、医这些热门方向基本都要求必选物理，不选等于提前把一大半专业关在门外了。\n\n暑假衔接班就是帮孩子把物理基础打扎实，开学选科的时候心里就有底了。"},{"type":"qa","q":"家长问：孩子物理成绩不太好，选历史是不是更稳妥？","tags":["选科","物理薄弱"],"a":"家长您好，特别理解您的顾虑，孩子物理吃力确实让人担心。但选科不能只看眼前哪科分高，得看长远。选历史看着\"稳妥\"，实际上专业选择面直接砍掉一半多，理工农医全报不了，到时候高考填志愿才发现路越走越窄才真叫不稳妥。\n\n新高考下65个学科门类要求必选物理，计算机、电子、机械、医学、金融全在里面。孩子现在物理吃力恰恰说明需要趁暑假抓紧补，方法调过来分数一定能上来。我课堂就是专门帮孩子做这个过渡的，基础打好了选物理一点都不慌。"},{"type":"qa","q":"家长问：河南新高考3+1+2模式，选科组合怎么选最优？","tags":["选科组合","3+1+2"],"a":"家长您好，河南新高考3+1+2有12种选科组合，我的建议是首选物理、再选化学，第三门看孩子情况选生物、地理或政治。\n\n物理加化学是公认的\"王牌组合\"，专业覆盖率高达95%以上，理工农医热门专业全能报。如果再加政治，覆盖率接近100%，对将来考研考公也有帮助。其他不含物理化学的组合覆盖率基本不到50%，差距太大了。\n\n所以暑假衔接班把物理化学基础打好特别关键，开学选科才有底气选最优组合，孩子未来的路就宽了。"},{"type":"qa","q":"家长问：暑假衔接班物理到底学什么？跟开学重复吗？","tags":["衔接班内容","课程价值"],"a":"家长您好，这个问题问得特别好。衔接班不是把开学内容提前上一遍，那样开学孩子反而觉得\"学过了\"不认真听。衔接班核心是帮孩子完成从初中到高中的思维过渡——初中物理记住结论就能拿分，高中要自己分析推理，这个转变不提前练开学肯定摔跟头。\n\n我们暑假会学到运动学、力学和牛顿第二定律，这些是高中物理的地基。地基打牢了开学学后面的内容就轻松了，跟重复学完全不是一回事。"},{"type":"qa","q":"家长问：孩子初中物理就没学好，暑假能补回来吗？","tags":["基础薄弱","暑期补救"],"a":"家长您好，初中物理没学好完全可以趁暑假补回来，这反而是最好的时机。开学后各科一起压上来根本没时间补旧账，暑假时间集中正好可以系统梳理。\n\n衔接班虽然讲的是高中新知识，但高中物理是从初中基础上延伸的，学新知识的过程本身就会带出初中的薄弱点。我课堂上遇到孩子卡壳的地方会顺带点一下对应的初中知识，帮他把断层接上。初中基础和高中新课同步推进，开学就不会因为旧知识拖后腿了。趁暑假补比开学后补轻松太多了，您放心。"}]},{"id":"family","name":"家庭教育","icon":"👨‍👩‍👧","desc":"青春期孩子的心理与行为引导","items":[{"type":"qa","q":"家长说：孩子对学习没兴趣，不认真做作业，认为报班没用","tags":["学习兴趣","报班抵触"],"a":"家长您好，特别理解您的心情。孩子没兴趣往往是有原因的——以前课堂太无聊、畏难、或者给自己贴了\"差生\"标签觉得学了也没用。但从现实看，当前竞争压力、高考难度、孩子目前的知识漏洞，这些得咱们大人替孩子做判断，不能光因为孩子说\"没兴趣\"就放弃。\n\n您可以带孩子来试听一下我的课，我课堂会用激励的方式帮孩子重塑自信，很多孩子被认可之后重新爱上一门课的。给孩子一个机会试试看？"},{"type":"qa","q":"家长说：孩子觉得疲惫压力太大，时间不够用，想停一段","tags":["压力过大","想停课"],"a":"家长您好，确实作业多孩子时间紧张很不容易，完全理解。但这个时候停下来真不是好选择，新高一绝对不能停——一旦停下来前面的势头就断了，再捡起来更难。\n\n其实我的课趣味性很强，两个小时很少有孩子觉得疲惫，很多孩子每周盼着我的课。如果作业太多孩子吃不消可以跟我说，我做个性化处理只留基本作业。咱们得帮孩子下一些有长远眼光的决定，您说呢？"},{"type":"qa","q":"家长说：孩子叛逆不听话，和家长矛盾很大，求助老师","tags":["青春期叛逆","亲子矛盾"],"a":"家长您好，先别太担心，这是青春期很正常的现象，很多家长都跟我沟通过。青春期的问题宜疏不宜堵，千万别和孩子站在对立面谈话，只会激化矛盾。给您一个建议：先听孩子说内心想法，然后认可他一些观点，再表达您的担心，像朋友一样把感受说出来，孩子感受到平等了心态就平和了。\n\n如果有需要我也可以跟孩子聊聊，有时候老师说的话孩子反而愿意听。咱们一起配合会好起来的。"},{"type":"qa","q":"家长说：感觉最近孩子没有学习状态，心不静，想先调整一下","tags":["学习状态","心态调整"],"a":"家长您好，\"没有状态\"这个说法比较虚，您跟我说说具体表现是什么？是写作业不认真还是不想上学？其实很多孩子所谓的\"没状态\"本质就是逃避，现在不解决开学后更来不及。状态是需要提前建立并延续的。\n\n我建议现在就帮孩子进入状态——作业从少做起每天先完成一部分，我多做激励表扬给动力，慢慢量加上去。随着自信心提升没状态的情况一定会改变，您放心。"},{"type":"qa","q":"家长说：家长想让学，孩子执拗不想学，劝说没用","tags":["孩子不想学","家长劝说"],"a":"家长您好，特别理解您的难处，孩子不想学是这个阶段常见的惰性表现。孩子思想还不成熟更倾向于玩耍，这很正常。但从竞争环境看，同学都在超前学习、高考难度逐年升级，您作为大人得替孩子做一些决定。不然同学都在补课他在家休息，差距只会越拉越大。\n\n您可以带孩子先来试听一次我的课，孩子如果喜欢课堂氛围自然就愿意学了，您看行吗？"},{"type":"qa","q":"家长说：孩子沉迷手机，说了也不听，一收就吵","tags":["手机沉迷","亲子冲突"],"a":"家长您好，手机问题几乎每个家长都头疼，特别理解。硬收手机容易激化矛盾，但不管又不行。给您一个建议：别一刀切没收，跟孩子商量一个规则——学习时间和睡觉时间手机交出来，完成了可以适当玩一会。关键是规则要孩子参与制定，他答应了执行起来阻力就小。\n\n另外孩子沉迷手机很多时候是因为现实生活缺少成就感，如果学习上能获得正反馈他对手机的依赖会自然减少。我课堂会多给孩子鼓励和认可，您这边也多夸夸孩子的进步，双管齐下效果更好。"},{"type":"qa","q":"家长说：孩子说考个普通大学就行了，没目标没动力","tags":["缺乏目标","动力不足"],"a":"家长您好，孩子说\"考个普通大学就行\"本质上是对自己的保护——目标定低了就不会有失败感。但这背后往往是因为对大学和未来缺乏真实认知，觉得都差不多。\n\n建议暑假有机会带孩子去大学校园转转，或者跟上了大学的哥哥姐姐聊聊，让他直观感受好大学和普通大学的差距。有了真实感受孩子自己就会想努力，比家长说一百遍都管用。我课堂也会跟孩子分享学长学姐的真实案例，帮孩子建立目标感，有了目标动力自然就来了。"}]},{"id":"complaint","name":"投诉抱怨","icon":"💬","desc":"家长不满情绪的化解与挽留","items":[{"type":"qa","q":"家长说：价格太贵了，没有优惠吗？","tags":["价格异议","性价比"],"a":"家长您好，价格确实是重要考量，完全理解您的想法。也欢迎您拿市场上同级别机构的价格做对比，注意是\"同级别\"——楼下小作坊或大学生家教跟我们在教学质量上差距太大没法比。我们的价格对应的是更好的教学、更高素质的老师、还有强大的试题资源，老师全部持证上岗。\n\n您如果有疑虑可以先报名，第一节课作为试听，上完不满意全额退费，不吃亏。您看先给孩子占个名额？"},{"type":"qa","q":"家长说：孩子上了几节课说听不懂，觉得没用想退费","tags":["听不懂","退费"],"a":"家长您好，特别理解您的心情，孩子说听不懂当家长的肯定着急。不过先别急，孩子说\"听不懂\"往往不是真的全听不懂，而是某个知识点卡住了后面跟不上，越听越糊涂。您让我跟孩子聊几句，我摸一下具体卡在哪儿，课后给他补一下就能接上。\n\n衔接班就是帮孩子过渡的，刚开头不适应太正常了，这时候放弃正好把最难的那段留到开学，开学更痛苦。坚持过这两周适应期就好了，咱们一起帮孩子撑过去行吗？"},{"type":"qa","q":"家长说：作业太多/太少了，不满意","tags":["作业量","个性化"],"a":"家长您好，特别理解您的想法。咱们班30个孩子每个情况不一样，同一份作业有的10分钟写完有的要40分钟，这确实正常。不过这个咱们可以个性化处理——觉得量大我可以适当减少挑核心的做，觉得不够我可以加名校真题练。另外孩子每天做完作业可以私信我打卡，我帮您盯着这样您也省心。\n\n您看这样安排行吗？有什么不合适的咱随时调整。"},{"type":"qa","q":"家长说：别的科目老师服务更好，对比下来对我不满","tags":["服务差异","老师对比"],"a":"家长您好，先了解一下具体情况，是什么事让您觉得不满意？您跟我说说我好针对性改进。补课方面公司方案是观看补课视频，孩子看完有不懂的随时私信我甚至可以开语音视频问。我跟别的老师在处理方式上可能有些不同但答疑一定帮孩子解决到位，您放心。作业方面我课堂会把每个孩子的错题讲清楚要求改错反思，关键是孩子把错题搞懂了效果是一样的。\n\n您看还有什么需要调整的随时跟我说。"},{"type":"qa","q":"家长说：补课视频没用，希望老师单独补课","tags":["补课方式","单独补课"],"a":"家长您好，理解您的想法。补课这块公司方案是观看补课视频，孩子看完视频有任何不懂的随时私信我，开语音视频都行，我一定帮孩子讲明白。不过单独补课确实没办法满足，一是公司制度不允许，二是每个孩子都要求单独补确实顾不过来，希望您理解。\n\n您放心只要孩子看了视频有疑问，我一定帮孩子解决所有疑惑，不会让孩子带着问题走。"},{"type":"qa","q":"家长说：觉得课程进度太快，孩子跟不上","tags":["进度太快","跟不上"],"a":"家长您好，感谢您及时跟我反馈，孩子跟不上这个问题我特别重视。先跟我聊聊具体是哪个部分觉得快？是某个知识点没消化，还是整体节奏都偏快？\n\n如果是某个知识点卡住了，我课后给孩子单独开个小灶补一下，不会让他带着问题往下走。如果是整体节奏的问题，我评估一下是不是需要调一个进度稍慢的班型。咱们目标是孩子真正学懂，不是赶进度，您放心我一定帮孩子调整好。"}]},{"id":"renewal","name":"续班沟通","icon":"🔄","desc":"续班期的关键挽留与转化话术","items":[{"type":"qa","q":"家长说：秋季大纲和暑假学的一样，学两遍有必要吗？","tags":["内容重复","秋季续班"],"a":"家长您好，这个问题问得特别好，很多家长都有这个疑问。大纲标题看着一样，但暑假和秋季的侧重点完全不同。暑假衔接班是帮孩子\"听懂\"，把高中物理的思维方式和基础概念建立起来；秋季是帮孩子\"做对\"，在开学同步进度上加深难度、练题型、抓规范。\n\n打个比方，暑假是打地基，秋季是盖楼。地基打好了不盖楼那地基就白打了。开学后学校进度快、难度大，孩子如果只靠暑假那点底子很快就会吃力，秋季班就是帮孩子在学校基础上巩固提升，两期配合效果才最好。您看要不秋季也一起报上？"},{"type":"qa","q":"家长说：想观察开学后学校时间安排再决定续班","tags":["观望态度","时间冲突"],"a":"家长您好，理解您想稳妥一些，等开学看看学校时间安排再做决定。不过即便学校补课大多也就周六早上，咱们有多个时段可选总能找到不冲突的。而且咱们的课可调可退，可以先占上名额，名额一旦没了再想报就不可能了。先报上开学后发现时间冲突再调整也来得及，不吃亏。\n\n您看要不先给孩子把名额占上？这批名额确实不多了。"},{"type":"qa","q":"家长说：在考虑一对一，觉得大班课无效","tags":["一对一vs大班","班型选择"],"a":"家长您好，理解您想让孩子快人一步看到效果的心情。不过新高一这个阶段学习最大意义是培养兴趣和习惯，一对一虽然针对性强但缺少课堂互动和群体学习氛围，孩子容易觉得枯燥反而不利于长期学习。\n\n建议您先试一下班课，跟老师多配合及时解决课堂疑问效果不会差。一学期后如果觉得还需要调整咱再考虑也来得及，您看先试一学期怎么样？"},{"type":"qa","q":"家长说：物理目前不错有优势，想先弥补弱项科目","tags":["优势科目","科目平衡"],"a":"家长您好，理解您想合理分配孩子学习时间的心情。不过物理这个\"优势\"可能比您想的脆弱，新高一前的中考物理成绩普遍有欺骗性——初中物理记住结论就能拿分，高中物理要自己分析推理，思维方式完全不同。很多初中物理八九十分的孩子到了高中突然断层，就是因为没及时转换思维、没持续跟进。优势需要保持而不是放置，孩子物理现在不错恰恰说明思维底子好，更应该在衔接期趁热打铁把力学、运动学这些高中核心模块打扎实，不然后面难度一上来优势很快就没了。名校竞争太激烈，别人各科一起往前赶，咱们可不能把优势放成了劣势。您考虑一下？"},{"type":"qa","q":"家长说：只考虑寒暑假报班，平时不想给孩子太大压力","tags":["只报寒暑假","压力顾虑"],"a":"家长您好，理解您的安排，学期内平时作业确实多孩子需要一定放松。但客观说当下环境确实残酷，高中生基本周末都在报班，别人在拼命跑咱们慢慢走时间长了想追都追不上。您担心的\"压力\"是周末的课和作业，但真正摧毁孩子信心的压力是成绩落后于别人。我的课堂是轻松型的，开开心心学知识也放松了心情，比玩手机度过两小时有意义多了。\n\n暂时的身体劳累换的是未来升学考试的轻松，您再考虑考虑？"},{"type":"qa","q":"家长续班期回复冷淡，甚至不回消息","tags":["回复冷淡","沟通障碍"],"a":"家长您好，因为后续课程安排比较重要，这条消息我需要确保每位家长都收到，麻烦您看到后回复我一下，谢谢您！\n\n（如果家长仍未回复，两小时后可再发：）\n家长您好，怕您没看到消息影响后面重要安排，我稍后会给您致电说明一下，您看哪个时间方便接电话？"},{"type":"qa","q":"班级已满或没有该班型，需要推荐其他老师","tags":["班级已满","转介绍"],"a":"家长您好，特别感谢您选择报名我的课，我也很喜欢咱家孩子本来特别想继续带他。但这个班型咱们校区确实没有了，班级人数也已经满了，控制人数也是为了保障每个孩子的学习质量。不过这个阶段确实得跟着学，我给您推荐一位特别优秀的老师——教学经验丰富课堂风格也有趣，孩子去了肯定也会喜欢。我可以把这位老师的资料发您看看也可以安排试听，而且这位老师名额也快满了建议先报上占名额，不合适还可以调班退班。\n\n如果只是换老师未来我这边有名额了可以再转回来，下个季度也有老生保护期可以优先报名。您看要不先跟这位老师试听一下？"},{"type":"qa","q":"家长说：对比了其他机构，觉得别家更便宜","tags":["竞品对比","价格竞争"],"a":"家长您好，货比三家太正常了，选机构确实得慎重。不过选课不能只看价格，得看性价比。便宜的课程往往是大学生兼职或者刚入行的新老师，教学经验不足讲不透知识点，孩子学了一学期发现没效果那才是真浪费钱。\n\n我们的老师全部持证上岗，教学经验丰富，课堂上有互动有反馈，课后有答疑有盯练，这些服务便宜机构根本给不了。您要是觉得贵可以先报一学期试试，第一节课不满意全额退费，咱们用效果说话不画大饼。您看先给孩子安排上？"}]}];

// Load data from localStorage or embedded data
async function loadData() {
  // Check if there's saved data in localStorage
  const saved = localStorage.getItem('huashu_data');
  if (saved) {
    try {
      DATA = JSON.parse(saved);
      console.log('Data loaded from localStorage');
      return;
    } catch(e) {
      console.warn('Failed to parse localStorage data, using embedded data');
    }
  }

  // Use embedded data
  DATA = EMBEDDED_DATA;
  originalData = JSON.parse(JSON.stringify(DATA));
  console.log('Data loaded from embedded data');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function showSaveToast() {
  const t = document.getElementById('saveToast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent;
    btn.textContent = '已复制';
    btn.classList.add('done');
    showToast('话术已复制到剪贴板');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1600);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); btn.textContent = '已复制'; btn.classList.add('done');
    showToast('话术已复制到剪贴板');
    setTimeout(() => { btn.textContent = '复制话术'; btn.classList.remove('done'); }, 1600); } catch(e) {}
    document.body.removeChild(ta);
  });
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '<div class="sidebar-label">全部</div>';
  const totalItems = DATA.reduce((s, c) => s + c.items.length, 0);
  html += `<button class="cat-btn active" data-cat="all"><span class="cat-icon">📋</span>全部话术<span class="cat-count">${totalItems}</span></button>`;
  DATA.filter(c => c.id.startsWith('feedback-')).forEach(c => {
    html += `<button class="cat-btn" data-cat="${c.id}"><span class="cat-icon">${c.icon}</span>${c.name}<span class="cat-count">${c.items.length}</span></button>`;
  });
  html += '<div class="sidebar-label">高频问题</div>';
  DATA.filter(c => !c.id.startsWith('feedback-')).forEach(c => {
    html += `<button class="cat-btn" data-cat="${c.id}"><span class="cat-icon">${c.icon}</span>${c.name}<span class="cat-count">${c.items.length}</span></button>`;
  });
  sb.innerHTML = html;
  sb.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      sb.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      renderList();
    });
  });
}

function renderList() {
  const list = document.getElementById('qaList');
  const titleEl = document.getElementById('contentTitle');
  const descEl = document.getElementById('contentDesc');
  const noRes = document.getElementById('noResults');

  let cats = currentCat === 'all' ? DATA : DATA.filter(c => c.id === currentCat);
  let allItems = [];
  cats.forEach(c => {
    c.items.forEach((item, idx) => {
      allItems.push({ ...item, catName: c.name, catId: c.id, catIdx: DATA.indexOf(c), itemIdx: idx });
    });
  });

  let filtered = allItems;
  if (searchTerm) {
    const term = searchTerm.toLowerCase();
    filtered = allItems.filter(item => {
      let searchText = item.q.toLowerCase() + ' ' + item.tags.join(' ').toLowerCase();
      if (item.type === 'qa') {
        searchText += ' ' + item.a.toLowerCase();
      } else {
        item.tiers.forEach(t => { searchText += ' ' + t.text.toLowerCase(); });
      }
      return searchText.includes(term);
    });
  }
  lastFiltered = filtered;

  if (currentCat === 'all') {
    titleEl.textContent = '全部话术';
    descEl.textContent = `共 ${filtered.length} 条，点击展开查看完整话术`;
  } else {
    const cat = DATA.find(c => c.id === currentCat);
    titleEl.textContent = cat.icon + ' ' + cat.name;
    descEl.textContent = cat.desc;
  }

  if (filtered.length === 0) {
    list.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  let html = '';
  filtered.forEach((item, i) => {
    const tagsHtml = item.tags.map(t => `<span class="q-tag">${t}</span>`).join('');

    if (item.type === 'qa') {
      html += `<div class="qa-card" data-idx="${i}">
        <div class="qa-question" onclick="this.parentElement.classList.toggle('open')">
          <div class="q-num">${i+1}</div>
          <div style="flex:1">
            <div class="q-text">${item.q}</div>
            <div class="q-tags">${tagsHtml}</div>
          </div>
          <div class="chevron"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
        </div>
        <div class="qa-answer-wrap">
          <div class="qa-answer">
            <div class="qa-answer-inner">${item.a}</div>
            <textarea class="edit-area" data-cat="${item.catIdx}" data-item="${item.itemIdx}" data-field="a">${item.a}</textarea>
            <div class="qa-actions">
              <button class="copy-btn-qa" data-i="${i}">
                <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                复制话术
              </button>
              <div class="edit-item-bar">
                <button onclick="saveEdit(${item.catIdx},${item.itemIdx})">保存此条</button>
                <button class="btn-delete" onclick="deleteItem(${item.catIdx},${item.itemIdx})">删除</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    } else {
      let tiersHtml = '';
      item.tiers.forEach((t, ti) => {
        tiersHtml += `<div class="tier-block">
          <div class="tier-head" style="background:${t.color}">
            <div class="th-l"><span class="th-name">${t.label}</span><span class="th-badge">${t.range}</span></div>
            <span class="th-tip">${t.tip}</span>
          </div>
          <div class="tier-body">
            <button class="tier-copy" data-i="${i}" data-ti="${ti}">复制话术</button>
            <div class="tier-txt">${t.text}</div>
            <textarea class="edit-area" data-cat="${item.catIdx}" data-item="${item.itemIdx}" data-tier="${ti}">${t.text}</textarea>
          </div>
        </div>`;
      });
      html += `<div class="qa-card" data-idx="${i}">
        <div class="qa-question" onclick="this.parentElement.classList.toggle('open')">
          <div class="q-num">${i+1}</div>
          <div style="flex:1">
            <div class="q-text">${item.q}</div>
            <div class="q-tags">${tagsHtml}</div>
          </div>
          <div class="chevron"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
        </div>
        <div class="qa-answer-wrap">
          <div class="qa-answer">
            ${tiersHtml}
            <div class="edit-item-bar">
              <button onclick="saveEdit(${item.catIdx},${item.itemIdx})">保存此条</button>
              <button class="btn-delete" onclick="deleteItem(${item.catIdx},${item.itemIdx})">删除</button>
            </div>
          </div>
        </div>
      </div>`;
    }
  });

  // Add "add item" button in edit mode
  if (editMode && currentCat !== 'all') {
    html += `<button class="add-item-btn" onclick="addItem('${currentCat}')">+ 添加新话术</button>`;
  }

  list.innerHTML = html;

  // Bind copy buttons
  document.querySelectorAll('.copy-btn-qa').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = lastFiltered[parseInt(btn.dataset.i)];
      if (item) copyText(item.a, btn);
    });
  });
  document.querySelectorAll('.tier-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = lastFiltered[parseInt(btn.dataset.i)];
      if (item) copyText(item.tiers[parseInt(btn.dataset.ti)].text, btn);
    });
  });

  // Bind edit areas
  document.querySelectorAll('.edit-area').forEach(area => {
    area.addEventListener('input', (e) => {
      const catIdx = parseInt(e.target.dataset.cat);
      const itemIdx = parseInt(e.target.dataset.item);
      const field = e.target.dataset.field;
      const tierIdx = e.target.dataset.tier;
      if (catIdx >= 0 && itemIdx >= 0 && DATA[catIdx] && DATA[catIdx].items[itemIdx]) {
        if (field === 'a') {
          DATA[catIdx].items[itemIdx].a = e.target.value;
        } else if (tierIdx !== undefined) {
          DATA[catIdx].items[itemIdx].tiers[parseInt(tierIdx)].text = e.target.value;
        }
      }
    });
  });
}

// Admin functions
function showAdminBar() {
  document.getElementById('adminBar').classList.add('visible');
}

function hideAdminBar() {
  document.getElementById('adminBar').classList.remove('visible');
}

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('btnEditMode');
  if (editMode) {
    btn.textContent = '退出编辑';
    btn.classList.add('active');
    showToast('编辑模式已开启，可直接修改话术文本');
  } else {
    btn.textContent = '开启编辑';
    btn.classList.remove('active');
    saveToLocalStorage();
    showSaveToast();
  }
  renderList();
}

function saveEdit(catIdx, itemIdx) {
  saveToLocalStorage();
  showSaveToast();
}

function saveToLocalStorage() {
  localStorage.setItem('huashu_data', JSON.stringify(DATA));
}

function deleteItem(catIdx, itemIdx) {
  if (!confirm('确定删除这条话术吗？')) return;
  if (DATA[catIdx] && DATA[catIdx].items[itemIdx]) {
    DATA[catIdx].items.splice(itemIdx, 1);
    saveToLocalStorage();
    showSaveToast();
    buildSidebar();
    renderList();
  }
}

function addItem(catId) {
  const cat = DATA.find(c => c.id === catId);
  if (!cat) return;
  const isFeedback = catId.startsWith('feedback-');
  if (isFeedback) {
    const lessonNum = cat.items.length + 1;
    cat.items.push({
      type: 'feedback',
      q: `第${lessonNum}讲 · 新话术`,
      tags: ['新标签'],
      tiers: TIERS_META.map(t => ({
        label: t.name, range: t.range, color: t.color, tip: t.tip,
        text: '#沟通称呼语#请在此编辑话术内容...'
      }))
    });
  } else {
    cat.items.push({
      type: 'qa',
      q: '家长问：新问题？',
      tags: ['新标签'],
      a: '请在此编辑回答内容...'
    });
  }
  saveToLocalStorage();
  showSaveToast();
  buildSidebar();
  renderList();
  // Open the last card
  setTimeout(() => {
    const cards = document.querySelectorAll('.qa-card');
    if (cards.length > 0) cards[cards.length - 1].classList.add('open');
  }, 100);
}

function exportJSON() {
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出为 data.json');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        DATA = data;
        saveToLocalStorage();
        showSaveToast();
        buildSidebar();
        renderList();
        showToast('数据导入成功');
      } else {
        alert('数据格式错误：应为数组格式');
      }
    } catch(err) {
      alert('JSON解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('确定重置为初始数据？所有修改将丢失！')) return;
  if (originalData) {
    DATA = JSON.parse(JSON.stringify(originalData));
    localStorage.removeItem('huashu_data');
    buildSidebar();
    renderList();
    showToast('已重置为初始数据');
  } else {
    localStorage.removeItem('huashu_data');
    location.reload();
  }
}

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  renderList();
});

// Init
async function init() {
  await loadData();
  const totalScripts = DATA.reduce((s, c) => {
    return s + c.items.reduce((ss, item) => ss + (item.type === 'feedback' ? 3 : 1), 0);
  }, 0);
  document.getElementById('stat-total').textContent = totalScripts;
  document.getElementById('stat-cats').textContent = DATA.length;
  document.getElementById('stat-scripts').textContent = totalScripts;
  buildSidebar();
  renderList();
}

init();
</script>
