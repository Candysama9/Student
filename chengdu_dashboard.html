<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>成都学校数据看板 · 学员分层续班潜力</title>
<style>
@font-face{font-family:'FZDaBiaoSong';src:local('方正大标宋简体'),local('FZDaBiaoSongJianTi'),local('FZDBSJW--GB1-0')}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-0:#f5f7fa;--bg-1:#ffffff;--bg-2:#eef2f7;
  --glass:rgba(255,255,255,.72);--glass-brd:rgba(0,0,0,.06);
  --glass-hi:rgba(0,122,255,.06);
  --text-0:#1a1a2e;--text-1:#3d3d5c;--text-2:#6e6e80;--text-3:#9e9eaf;
  --brand:#007AFF;--brand-2:#5856D6;--brand-glow:rgba(0,122,255,.18);
  --accent:#00C7BE;--accent-2:#30D5C8;
  --green:#34C759;--green-bg:rgba(52,199,89,.1);
  --gold:#FF9500;--gold-bg:rgba(255,149,0,.1);
  --blue:#007AFF;--blue-bg:rgba(0,122,255,.08);
  --red:#FF3B30;--red-bg:rgba(255,59,48,.08);
  --gray:#8E8E93;--gray-bg:rgba(142,142,147,.1);
  --radius:14px;--radius-sm:10px;--radius-lg:18px;
  --shadow:0 2px 20px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.08);
  --font:'FZDaBiaoSong','方正大标宋简体',-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;
  --mono:'FZDaBiaoSong','方正大标宋简体',"SF Mono","PingFang SC",monospace;
}
html{font-size:14px;scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg-0);color:var(--text-0);
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%,rgba(0,122,255,.04),transparent),
    radial-gradient(ellipse 50% 30% at 85% 100%,rgba(88,86,214,.03),transparent),
    var(--bg-0);
}

.wrap{max-width:1680px;margin:0 auto;padding:16px 24px 60px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:1.5rem;font-weight:700;color:var(--text-0)}
.header-left .sub{font-size:.78rem;color:var(--text-2);margin-top:3px}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.data-badge{
  padding:5px 12px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-brd);
  font-size:.72rem;color:var(--text-1);display:flex;align-items:center;gap:6px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.data-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Status Filter (top) */
.status-bar{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
  padding:10px 16px;border-radius:var(--radius);
  background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.status-bar .label{font-size:.8rem;color:var(--text-2);font-weight:600;white-space:nowrap}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.spill{
  padding:6px 16px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.5);color:var(--text-1);font-size:.78rem;cursor:pointer;
  transition:all .2s;font-family:var(--font);font-weight:500;
  display:flex;align-items:center;gap:4px;
}
.spill:hover{border-color:var(--brand-glow);background:rgba(255,255,255,.8)}
.spill.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--brand-glow);
}
.spill .cnt{font-size:.68rem;opacity:.75;font-weight:400}
.spill.disabled{opacity:.4;cursor:not-allowed}
.spill.disabled:hover{border-color:var(--glass-brd);background:rgba(255,255,255,.5)}

/* KPI Cards */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{
  background:var(--glass);border:1px solid var(--glass-brd);
  border-radius:var(--radius);padding:14px 16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:transform .2s,box-shadow .2s;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi .label{font-size:.68rem;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kpi .val{font-size:1.7rem;font-weight:700;font-family:var(--mono);color:var(--text-0)}
.kpi .val.brand{color:var(--brand)}
.kpi .val.green{color:var(--green)}
.kpi .val.gold{color:var(--gold)}
.kpi .val.accent{color:var(--accent)}
.kpi .sub{font-size:.68rem;color:var(--text-3);margin-top:2px}

/* Binned Charts */
.binned-charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.binned-card{
  background:var(--glass);border:1px solid var(--glass-brd);
  border-radius:var(--radius);padding:14px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.binned-card h4{font-size:.82rem;font-weight:600;margin-bottom:8px;color:var(--text-0)}
.binned-card .chart-box{position:relative;height:220px}

/* Tabs */
.tabs{
  display:flex;gap:4px;margin-bottom:16px;
  background:var(--glass);border:1px solid var(--glass-brd);
  border-radius:var(--radius);padding:4px;width:fit-content;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.tab{
  padding:7px 18px;border-radius:var(--radius-sm);border:none;
  background:transparent;color:var(--text-2);font-size:.82rem;font-weight:500;
  cursor:pointer;transition:all .2s;font-family:var(--font);
}
.tab:hover{color:var(--text-0);background:var(--glass-hi)}
.tab.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;box-shadow:0 2px 8px var(--brand-glow);
}

/* Filter Bar */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filter-label{font-size:.78rem;color:var(--text-2);font-weight:600}
.pill-group{display:flex;gap:5px}
.pill{
  padding:5px 12px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.5);color:var(--text-1);font-size:.75rem;cursor:pointer;
  transition:all .2s;font-family:var(--font);font-weight:500;
}
.pill:hover{border-color:var(--brand-glow)}
.pill.active{
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-color:transparent;
}
.pill .cnt{font-size:.65rem;opacity:.7;margin-left:3px}
.search-box{
  flex:1;min-width:180px;max-width:280px;
  padding:6px 12px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.6);color:var(--text-0);font-size:.78rem;
  font-family:var(--font);
}
.search-box:focus{outline:none;border-color:var(--brand-glow);box-shadow:0 0 0 3px var(--brand-glow)}
.search-box::placeholder{color:var(--text-3)}

/* Dropdown */
.dropdown{
  position:relative;display:inline-block;
}
.dropdown-btn{
  padding:6px 14px;border-radius:999px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.6);color:var(--text-1);font-size:.78rem;cursor:pointer;
  font-family:var(--font);font-weight:500;display:flex;align-items:center;gap:6px;
  transition:all .2s;
}
.dropdown-btn:hover{border-color:var(--brand-glow)}
.dropdown-btn .arrow{font-size:.6rem;transition:transform .2s}
.dropdown.open .dropdown-btn .arrow{transform:rotate(180deg)}
.dropdown-menu{
  position:absolute;top:100%;left:0;margin-top:4px;
  background:var(--bg-1);border:1px solid var(--glass-brd);
  border-radius:var(--radius);box-shadow:var(--shadow-lg);
  max-height:320px;overflow-y:auto;min-width:200px;z-index:50;
  display:none;
}
.dropdown.open .dropdown-menu{display:block}
.dropdown-item{
  padding:7px 14px;font-size:.78rem;cursor:pointer;color:var(--text-1);
  transition:background .15s;font-family:var(--font);
}
.dropdown-item:hover{background:var(--glass-hi)}
.dropdown-item.selected{color:var(--brand);font-weight:600}

/* Table */
.table-wrap{
  background:var(--glass);border:1px solid var(--glass-brd);
  border-radius:var(--radius-lg);overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.table-scroll{overflow-x:auto;max-height:68vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:.78rem}
thead{position:sticky;top:0;z-index:10}
thead th{
  background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  padding:9px 11px;text-align:left;font-weight:600;color:var(--text-1);
  white-space:nowrap;border-bottom:1px solid var(--glass-brd);
  cursor:pointer;user-select:none;transition:color .15s;
}
thead th:hover{color:var(--brand)}
thead th .sort-i{font-size:.58rem;opacity:.4;margin-left:2px}
thead th.sorted .sort-i{opacity:1;color:var(--brand)}
thead th.sorted{color:var(--brand)}
thead tr.grp-row th{
  padding:4px 8px;font-size:.66rem;font-weight:600;text-align:center;
  border-bottom:1px solid var(--glass-brd);
}
thead tr.grp-row th.g-basic{background:rgba(0,122,255,.06);color:var(--brand)}
thead tr.grp-row th.g-count{background:rgba(0,199,190,.06);color:var(--accent)}
thead tr.grp-row th.g-key{background:rgba(52,199,89,.06);color:var(--green)}
thead tr.grp-row th.g-grade{background:rgba(255,149,0,.06);color:var(--gold)}
thead tr.grp-row th.g-comm{background:rgba(88,86,214,.06);color:var(--brand-2)}
thead tr.grp-row th.g-traj{background:rgba(0,122,255,.04);color:var(--brand)}
thead tr.grp-row th.g-stick{background:rgba(48,213,200,.06);color:var(--accent)}
tbody tr{border-bottom:1px solid rgba(0,0,0,.03);transition:background .15s}
tbody tr:hover{background:rgba(0,122,255,.03)}
tbody td{padding:7px 11px;white-space:nowrap;color:var(--text-1)}
tbody td.num{font-family:var(--mono);text-align:right}
tbody td.rank{font-weight:600;color:var(--text-0)}
tbody td.rank .badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;font-size:.68rem;
}
.rank-1 .badge{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff}
.rank-2 .badge{background:linear-gradient(135deg,#C0C0C0,#A8A8A8);color:#fff}
.rank-3 .badge{background:linear-gradient(135deg,#CD7F32,#B87333);color:#fff}
.rank-other .badge{background:var(--bg-2);color:var(--text-2)}

/* Grade badges */
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;font-size:.68rem;font-weight:600;padding:0 4px}
.grade-S{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(255,149,0,.25)}
.grade-A{background:var(--green-bg);color:var(--green);border:1px solid rgba(52,199,89,.25)}
.grade-B{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(0,122,255,.2)}
.grade-C{background:var(--gray-bg);color:var(--gray);border:1px solid rgba(142,142,147,.2)}

/* Student tags */
.stag{display:inline-flex;align-items:center;font-size:.65rem;font-weight:500;padding:1px 6px;border-radius:4px;margin-right:3px;white-space:nowrap}
.stag-tenure{background:rgba(88,86,214,.1);color:var(--brand-2);border:1px solid rgba(88,86,214,.2)}
.stag-progress{background:rgba(52,199,89,.1);color:var(--green);border:1px solid rgba(52,199,89,.2)}
.stag-absent{background:rgba(255,59,48,.08);color:var(--red);border:1px solid rgba(255,59,48,.2)}
.stag-comm-S{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(255,149,0,.25)}
.stag-comm-A{background:var(--green-bg);color:var(--green);border:1px solid rgba(52,199,89,.25)}
.stag-comm-B{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(0,122,255,.2)}
.stag-comm-C{background:var(--gray-bg);color:var(--gray);border:1px solid rgba(142,142,147,.2)}

/* Progress bars */
.bar-wrap{display:flex;align-items:center;gap:6px;min-width:120px;justify-content:flex-start;width:100%}
.bar{display:flex;width:80px;height:10px;background:rgba(0,0,0,.06);border-radius:5px;overflow:hidden;flex-shrink:0;border:1px solid rgba(0,0,0,.04)}
.bar-fill{display:block;height:100%;border-radius:4px;transition:width .3s;min-width:2px}
.bar-val{font-size:.72rem;color:var(--text-1);white-space:nowrap;min-width:42px;text-align:left}
.bar-fill.green{background:linear-gradient(90deg,var(--green),#30D158)}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold),#FFB340)}
.bar-fill.brand{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.bar-fill.red{background:linear-gradient(90deg,var(--red),#FF6961)}

/* Tag filter */
.tag-filter{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tag-btn{
  padding:3px 8px;border-radius:6px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.5);color:var(--text-2);font-size:.66rem;cursor:pointer;
  transition:all .15s;font-family:var(--font);font-weight:500;white-space:nowrap;
}
.tag-btn:hover{color:var(--text-0)}
.tag-btn.active.tenure{background:rgba(88,86,214,.1);color:var(--brand-2);border-color:rgba(88,86,214,.3)}
.tag-btn.active.progress{background:var(--green-bg);color:var(--green);border-color:rgba(52,199,89,.3)}
.tag-btn.active.absent{background:var(--red-bg);color:var(--red);border-color:rgba(255,59,48,.3)}
.tag-btn.active.comm{background:var(--gold-bg);color:var(--gold);border-color:rgba(255,149,0,.3)}
.tag-btn.active.all{background:var(--glass-hi);color:var(--brand);border-color:var(--brand-glow)}

/* Student tags cell */
.tags-cell{width:200px;max-width:200px;vertical-align:top;white-space:normal;padding:7px 10px 7px 11px !important;border-right:2px solid rgba(0,122,255,.18);overflow:hidden}
.tags-cell .tag-row{display:flex;flex-wrap:wrap;gap:3px;max-width:100%;overflow:hidden}
.tags-cell .stag{margin-bottom:2px;font-size:.62rem;padding:1px 5px}
.name-cell{vertical-align:top;white-space:nowrap;padding:7px 11px 7px 10px !important;min-width:60px;border-left:none}

.teacher-link{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:500}
.teacher-link:hover{text-decoration:underline}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(8px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--bg-1);border:1px solid var(--glass-brd);
  border-radius:var(--radius-lg);width:100%;max-width:1200px;
  max-height:85vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.modal-header{
  padding:14px 20px;border-bottom:1px solid var(--glass-brd);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h3{font-size:1rem;font-weight:600}
.modal-header .close{
  width:30px;height:30px;border-radius:50%;border:none;
  background:var(--bg-2);color:var(--text-1);cursor:pointer;
  font-size:1.1rem;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.modal-header .close:hover{background:var(--red-bg);color:var(--red)}
.modal-body{overflow:auto;padding:0}

/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.chart-card{
  background:var(--glass);border:1px solid var(--glass-brd);
  border-radius:var(--radius);padding:14px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.chart-card h4{font-size:.82rem;font-weight:600;margin-bottom:8px;color:var(--text-0)}
.chart-card .chart-box{position:relative;height:240px}

/* Grade filter */
.grade-filter{display:flex;gap:5px;align-items:center}
.grade-btn{
  padding:4px 10px;border-radius:8px;border:1px solid var(--glass-brd);
  background:rgba(255,255,255,.5);color:var(--text-2);font-size:.7rem;cursor:pointer;
  transition:all .15s;font-family:var(--font);font-weight:500;
}
.grade-btn:hover{color:var(--text-0)}
.grade-btn.active.grade-S{background:var(--gold-bg);color:var(--gold);border-color:rgba(255,149,0,.3)}
.grade-btn.active.grade-A{background:var(--green-bg);color:var(--green);border-color:rgba(52,199,89,.3)}
.grade-btn.active.grade-B{background:var(--blue-bg);color:var(--blue);border-color:rgba(0,122,255,.25)}
.grade-btn.active.grade-C{background:var(--gray-bg);color:var(--gray);border-color:rgba(142,142,147,.25)}
.grade-btn.active.all{background:var(--glass-hi);color:var(--brand);border-color:var(--brand-glow)}

/* Rules section */
.rules-section{
  background:var(--glass);border:1px solid var(--glass-brd);
  border-radius:var(--radius);padding:16px;margin-top:16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
.rules-section h3{font-size:.9rem;font-weight:600;margin-bottom:10px;color:var(--text-0)}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.rule-card{
  padding:10px 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.5);border:1px solid var(--glass-brd);
}
.rule-card .rule-title{font-size:.76rem;font-weight:600;color:var(--text-0);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.rule-card .rule-title .pts{font-size:.68rem;color:var(--text-3);font-weight:400}
.rule-card .rule-desc{font-size:.7rem;color:var(--text-2);line-height:1.5}
.rule-card.comm{border-left:3px solid var(--brand-2)}
.rule-card.traj{border-left:3px solid var(--brand)}
.rule-card.stick{border-left:3px solid var(--accent)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--glass-brd);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text-2);font-size:.82rem}

/* Misc */
.exclude-note{font-size:.7rem;color:var(--text-3);margin-left:auto;padding:3px 10px;background:rgba(255,255,255,.5);border:1px solid var(--glass-brd);border-radius:999px;white-space:nowrap}
.formula-note{font-size:.7rem;color:var(--text-3);margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.5);border-radius:var(--radius-sm);border:1px solid var(--glass-brd)}
.empty-msg{text-align:center;padding:40px;color:var(--text-3);font-size:.82rem}
.hidden{display:none!important}
.info-count{font-size:.72rem;color:var(--text-3)}

/* Daily Trend */
.trend-section{
  margin-bottom:16px;border-radius:var(--radius);
  background:var(--glass);border:1px solid var(--glass-brd);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);overflow:hidden;
}
.trend-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;cursor:pointer;user-select:none;
}
.trend-header h3{font-size:.85rem;font-weight:600;color:var(--text-0);display:flex;align-items:center;gap:6px}
.trend-header .toggle{font-size:.7rem;color:var(--text-3);transition:transform .2s}
.trend-section.collapsed .toggle{transform:rotate(-90deg)}
.trend-body{padding:0 16px 14px;max-height:2000px;overflow:hidden;transition:max-height .3s}
.trend-section.collapsed .trend-body{max-height:0;padding-top:0;padding-bottom:0}
.trend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.trend-card{
  padding:10px 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.5);border:1px solid var(--glass-brd);
}
.trend-card .tc-label{font-size:.68rem;color:var(--text-2);margin-bottom:4px}

<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">正在加载成都学校数据...</p>
    <p id="loadingHint" style="font-size:.72rem;color:var(--text-3);margin-top:4px">数据量较大（约3.6MB），请耐心等待</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ============================================================
// 全局状态
// ============================================================
let DASHBOARD=null;
let DAILY_HISTORY=null;
let activeTab='teacher';
let activeStatus=''; // 初始化为空，启动时自动选择
let activeGradeFilter='all';
let selectedTeacher='';
let activeTagFilter='all'; // 标签筛选
let sortCol='renewal_rate';
let sortDir='desc';
let chartInstances={};
let teacherSearch='';
let studentSearch='';
let dropdownOpen=false;
let trendTab='overall'; // 趋势标签：overall/subject/teacher
let trendCollapsed=false; // 趋势面板折叠状态

const METRICS=[
  {key:'deep_chat_quality',name:'深聊质量',max:15,cat:'学情沟通',short:'dcq'},
  {key:'deep_chat_rounds',name:'深聊轮次',max:40,cat:'学情沟通',short:'dcr'},
  {key:'service_card',name:'服务卡得分',max:10,cat:'学情沟通',short:'svc'},
  {key:'question_recovery',name:'题目回收率',max:5,cat:'学习轨迹',short:'qr'},
  {key:'attendance',name:'出勤率',max:5,cat:'学习轨迹',short:'att'},
  {key:'progress_perception',name:'进步感知',max:5,cat:'学习轨迹',short:'pp'},
  {key:'class_report',name:'课次报告发送',max:10,cat:'学习轨迹',short:'cr'},
  {key:'consecutive_quarters',name:'连续在读季度',max:10,cat:'学员黏性',short:'cq'},
];

// ============================================================
// 数据加载
// ============================================================
async function loadData(){
  const ver=Date.now();
  const paths=[`chengdu_dashboard.json?v=${ver}`,`./chengdu_dashboard.json?v=${ver}`];
  // 添加超时和进度提示
  const loadingText=document.getElementById('loadingText');
  let progressTimer=setTimeout(()=>{
    if(loadingText)loadingText.textContent='数据仍在加载中，请稍候...';
  },5000);
  let slowTimer=setTimeout(()=>{
    if(loadingText)loadingText.textContent='数据量较大，正在解析...可能需要10-15秒';
  },15000);
  
  // 60秒超时
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),60000);
  
  for(const p of paths){
    try{
      const r=await fetch(p,{cache:'no-store',signal:controller.signal});
      if(r.ok){
        const data=await r.json();
        clearTimeout(progressTimer);
        clearTimeout(slowTimer);
        clearTimeout(timeoutId);
        return data;
      }
    }catch(e){}
  }
  clearTimeout(progressTimer);
  clearTimeout(slowTimer);
  clearTimeout(timeoutId);
  throw new Error('无法加载数据文件，请检查网络后刷新重试');
}

async function loadHistory(){
  const ver=Date.now();
  const paths=[`daily_history.json?v=${ver}`,`./daily_history.json?v=${ver}`];
  for(const p of paths){
    try{const r=await fetch(p,{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}
  }
  return null;
}

// 计算环比变化
function calcChange(current, previous){
  if(previous==null||previous===0)return null;
  const diff=current-previous;
  if(Math.abs(diff)<0.05)return {type:'flat',val:diff};
  return {type:diff>0?'up':'down',val:diff};
}

function formatChange(chg,suffix='%'){
  if(!chg)return '<span class="change-flat">—</span>';
  const sign=chg.val>0?'+':'';
  const cls=chg.type==='up'?'change-up':chg.type==='down'?'change-down':'change-flat';
  const arrow=chg.type==='up'?'▲':chg.type==='down'?'▼':'—';
  return `<span class="${cls}">${arrow} ${sign}${chg.val.toFixed(1)}${suffix}</span>`;
}

// ============================================================
// 日数据趋势渲染
// ============================================================
function renderTrends(){
  if(!DAILY_HISTORY||!DAILY_HISTORY.snapshots||DAILY_HISTORY.snapshots.length===0)return '';
  const snaps=DAILY_HISTORY.snapshots;
  const latest=snaps[snaps.length-1];
  const prev=snaps.length>1?snaps[snaps.length-2]:null;
  const dataDate=latest.date;

  // 根据当前筛选状态获取对应维度数据
  let curData=null,prevData=null,label='';
  if(trendTab==='overall'){
    curData=latest.overall;prevData=prev?prev.overall:null;label='整体';
  }else if(trendTab==='subject'){
    // 取当前学科的快照，若未选具体学科则展示第一个学科
    const subjName=activeTab.startsWith('subject_')?activeTab.replace('subject_',''):'';
    if(subjName&&latest.by_subject&&latest.by_subject[subjName]){
      curData=latest.by_subject[subjName];prevData=prev&&prev.by_subject?prev.by_subject[subjName]:null;label=subjName;
    }else{
      curData=latest.overall;prevData=prev?prev.overall:null;label='整体';
    }
  }else if(trendTab==='teacher'){
    // 取当前选中教师的快照
    if(selectedTeacher&&latest.by_teacher&&latest.by_teacher[selectedTeacher]){
      curData=latest.by_teacher[selectedTeacher];prevData=prev&&prev.by_teacher?prev.by_teacher[selectedTeacher]:null;label=selectedTeacher+'老师';
    }else{
      curData=latest.overall;prevData=prev?prev.overall:null;label='整体';
    }
  }
  if(!curData)return '';

  const chgRR=calcChange(curData.renewal_rate,prevData?prevData.renewal_rate:null);
  const chgScore=calcChange(curData.avg_score,prevData?prevData.avg_score:null);
  const chgSA=calcChange(curData.sa_pct,prevData?prevData.sa_pct:null);

  // 各项得分环比
  const metricKeys=[
    {k:'dcq',n:'深聊质量'},{k:'dcr',n:'深聊轮次'},{k:'svc',n:'服务卡'},
    {k:'qr',n:'题目回收'},{k:'att',n:'出勤率'},{k:'pp',n:'进步感知'},
    {k:'cr',n:'课次报告'},{k:'cq',n:'连续在读'}
  ];

  let html=`
  <div class="trend-section ${trendCollapsed?'collapsed':''}">
    <div class="trend-header" onclick="toggleTrend()">
      <h3>📈 日数据环比趋势 <span style="font-size:.72rem;color:var(--text-3);font-weight:400">数据日期 ${dataDate} · ${label}</span></h3>
      <span class="toggle">▼</span>
    </div>
    <div class="trend-body">
      <div class="trend-tabs">
        <button class="trend-tab ${trendTab==='overall'?'active':''}" onclick="switchTrendTab('overall')">整体</button>
        <button class="trend-tab ${trendTab==='subject'?'active':''}" onclick="switchTrendTab('subject')">学科维度</button>
        <button class="trend-tab ${trendTab==='teacher'?'active':''}" onclick="switchTrendTab('teacher')">教师维度</button>
      </div>
      <div class="trend-grid">
        <div class="trend-card">
          <div class="tc-label">续班率</div>
          <div class="tc-val">${curData.renewal_rate.toFixed(1)}%</div>
          <div class="tc-change ${chgRR?chgRR.type:'flat'}">${formatChange(chgRR)}</div>
        </div>
        <div class="trend-card">
          <div class="tc-label">平均总分</div>
          <div class="tc-val">${curData.avg_score.toFixed(1)}</div>
          <div class="tc-change ${chgScore?chgScore.type:'flat'}">${formatChange(chgScore,'')}</div>
        </div>
        <div class="trend-card">
          <div class="tc-label">SA占比</div>
          <div class="tc-val">${curData.sa_pct.toFixed(1)}%</div>
          <div class="tc-change ${chgSA?chgSA.type:'flat'}">${formatChange(chgSA)}</div>
        </div>
        <div class="trend-card">
          <div class="tc-label">学员人次</div>
          <div class="tc-val">${curData.student_count}</div>
          <div class="tc-change flat">原班${curData.original_count} · 续班${curData.renewal_count}</div>
        </div>
      </div>
      ${curData.metrics?`
      <table class="trend-table">
        <thead><tr><th>指标</th><th style="text-align:right">当日均值</th><th style="text-align:right">环比变化</th></tr></thead>
        <tbody>
        ${metricKeys.map(mk=>{
          const cv=curData.metrics[mk.k]||0;
          const pv=prevData&&prevData.metrics?prevData.metrics[mk.k]||0:0;
          const chg=calcChange(cv,pv);
          return `<tr><td>${mk.n}</td><td class="num">${cv.toFixed(1)}</td><td class="num">${formatChange(chg,'')}</td></tr>`;
        }).join('')}
        </tbody>
      </table>`:''}
      ${snaps.length>1?`
      <div style="margin-top:8px;font-size:.68rem;color:var(--text-3)">共 ${snaps.length} 天数据 · 首次记录 ${snaps[0].date} · 最近记录 ${latest.date}</div>
      `:'<div style="margin-top:8px;font-size:.68rem;color:var(--text-3)">首日数据，暂无环比对比</div>'}
    </div>
  </div>`;
  return html;
}

function toggleTrend(){trendCollapsed=!trendCollapsed;render();}
function switchTrendTab(tab){trendTab=tab;render();}

// ============================================================
// 数据过滤
// ============================================================
function getFilteredStudents(){
  if(!DASHBOARD)return[];
  if(activeStatus==='all'||activeStatus==='')return DASHBOARD.all_students;
  if(activeStatus==='未开课班级')return DASHBOARD.not_started_students||[];
  return DASHBOARD.all_students.filter(s=>s.cs===activeStatus);
}

function getSubjectStudents(subject){
  let students=DASHBOARD.all_students.filter(s=>s.s===subject);
  if(activeStatus&&activeStatus!=='all'&&activeStatus!=='未开课班级'){
    students=students.filter(s=>s.cs===activeStatus);
  }
  return students;
}

function getNotStartedStudents(){
  return DASHBOARD.not_started_students||[];
}

// ============================================================
// 聚合
// ============================================================
function aggregateTeachers(students){
  const map={};
  for(const s of students){
    if(!s.t)continue;
    if(!map[s.t]){
      map[s.t]={teacher:s.t,subjects:new Set(),total:0,original:0,renewal:0,
        scores:[],grades_sys:[],grades_formula:[],metrics:{},metric_cnt:{},statuses:new Set()};
      for(const m of METRICS){map[s.t].metrics[m.short]=0;map[s.t].metric_cnt[m.short]=0;}
    }
    const t=map[s.t];
    t.subjects.add(s.s);t.total++;t.statuses.add(s.cs);
    if(s.io==='是')t.original++;
    if(s.ir==='是')t.renewal++;
    if(s.ts!=null)t.scores.push(s.ts);
    if(s.sg)t.grades_sys.push(s.sg);
    if(s.fg)t.grades_formula.push(s.fg);
    for(const m of METRICS){t.metrics[m.short]+=s[m.short]||0;t.metric_cnt[m.short]++;}
  }
  const tenureMap={};
  if(DASHBOARD.teachers)for(const t of DASHBOARD.teachers)tenureMap[t.teacher]=t.tenure;
  const result=[];
  for(const t of Object.values(map)){
    const avg=t.scores.length?t.scores.reduce((a,b)=>a+b,0)/t.scores.length:0;
    const rr=t.original?t.renewal/t.original*100:0;
    const saSys=t.grades_sys.filter(g=>g==='S'||g==='A').length;
    const saPctSys=t.grades_sys.length?saSys/t.grades_sys.length*100:0;
    const gcSys={S:0,A:0,B:0,C:0};t.grades_sys.forEach(g=>{if(gcSys[g]!=null)gcSys[g]++});
    const gcFormula={S:0,A:0,B:0,C:0};t.grades_formula.forEach(g=>{if(gcFormula[g]!=null)gcFormula[g]++});
    const metricsAvg={};
    for(const m of METRICS)metricsAvg[m.short]=t.metric_cnt[m.short]?Math.round(t.metrics[m.short]/t.metric_cnt[m.short]*10)/10:0;
    result.push({teacher:t.teacher,subjects:[...t.subjects].join('|'),
      subject_main:t.subjects.size===1?[...t.subjects][0]:'多科目',
      tenure:tenureMap[t.teacher]||'',total:t.total,original:t.original,renewal:t.renewal,
      renewal_rate:Math.round(rr*10)/10,avg_score:Math.round(avg*10)/10,
      sa_pct:Math.round(saPctSys*10)/10,grade_counts:gcSys,grade_counts_formula:gcFormula,metrics:metricsAvg});
  }
  return result;
}

function aggregateSubjects(students){
  const map={};
  for(const s of students){
    if(!s.s)continue;
    if(!map[s.s]){
      map[s.s]={subject:s.s,total:0,original:0,renewal:0,scores:[],grades_sys:[],grades_formula:[],
        teachers:new Set(),metrics:{},metric_cnt:{}};
      for(const m of METRICS){map[s.s].metrics[m.short]=0;map[s.s].metric_cnt[m.short]=0;}
    }
    const t=map[s.s];t.total++;t.teachers.add(s.t);
    if(s.io==='是')t.original++;if(s.ir==='是')t.renewal++;
    if(s.ts!=null)t.scores.push(s.ts);
    if(s.sg)t.grades_sys.push(s.sg);if(s.fg)t.grades_formula.push(s.fg);
    for(const m of METRICS){t.metrics[m.short]+=s[m.short]||0;t.metric_cnt[m.short]++;}
  }
  const result=[];
  for(const t of Object.values(map)){
    const avg=t.scores.length?t.scores.reduce((a,b)=>a+b,0)/t.scores.length:0;
    const rr=t.original?t.renewal/t.original*100:0;
    const saSys=t.grades_sys.filter(g=>g==='S'||g==='A').length;
    const saPctSys=t.grades_sys.length?saSys/t.grades_sys.length*100:0;
    const gcSys={S:0,A:0,B:0,C:0};t.grades_sys.forEach(g=>{if(gcSys[g]!=null)gcSys[g]++});
    const gcFormula={S:0,A:0,B:0,C:0};t.grades_formula.forEach(g=>{if(gcFormula[g]!=null)gcFormula[g]++});
    const metricsAvg={};
    for(const m of METRICS)metricsAvg[m.short]=t.metric_cnt[m.short]?Math.round(t.metrics[m.short]/t.metric_cnt[m.short]*10)/10:0;
    result.push({subject:t.subject,teacher_count:t.teachers.size,total:t.total,original:t.original,renewal:t.renewal,
      renewal_rate:Math.round(rr*10)/10,avg_score:Math.round(avg*10)/10,sa_pct:Math.round(saPctSys*10)/10,
      grade_counts:gcSys,grade_counts_formula:gcFormula,metrics:metricsAvg});
  }
  return result;
}

// ============================================================
// 排序
// ============================================================
function sortData(data,col,dir){
  return data.sort((a,b)=>{
    let va=col.includes('.')?col.split('.').reduce((o,k)=>o?.[k],a):a[col];
    let vb=col.includes('.')?col.split('.').reduce((o,k)=>o?.[k],b):b[col];
    if(typeof va==='string'){va=va||'';vb=vb||'';return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);}
    va=va||0;vb=vb||0;return dir==='asc'?va-vb:vb-va;
  });
}

// ============================================================
// 标签渲染
// ============================================================
function renderTags(tags){
  if(!tags||!tags.length)return '';
  return tags.map(t=>{
    let cls='stag';
    if(t.type==='tenure')cls='stag stag-tenure';
    else if(t.type==='progress')cls='stag stag-progress';
    else if(t.type==='absent')cls='stag stag-absent';
    else if(t.type==='comm')cls=`stag stag-comm-${t.label.replace('家校沟通','')}`;
    return `<span class="${cls}">${t.label}</span>`;
  }).join('');
}

// ============================================================
// 渲染主函数
// ============================================================
function render(){
  const app=document.getElementById('app');
  const students=getFilteredStudents();

  // 获取可用学科列表
  const subjectSet=new Set();
  if(DASHBOARD.all_students)DASHBOARD.all_students.forEach(s=>{if(s.s)subjectSet.add(s.s)});

  const totalAll=DASHBOARD.meta.total_records;

  let html=`

      <button class="spill ${activeStatus==='已开课班级'?'active':''}" onclick="switchStatus('已开课班级')">已开课 <span class="cnt">${(ss['已开课班级']||{}).count||0}</span></button>
      <button class="spill ${(ss['已开窗班级']||{}).count>0?(activeStatus==='已开窗班级'?'active':''):'disabled'}" onclick="${(ss['已开窗班级']||{}).count>0?`switchStatus('已开窗班级')`:'void(0)'}">已开窗 <span class="cnt">${(ss['已开窗班级']||{}).count||0}</span></button>
      <button class="spill ${activeStatus==='已结课班级'?'active':''}" onclick="switchStatus('已结课班级')">已结课 <span class="cnt">${(ss['已结课班级']||{}).count||0}</span></button>
      <button class="spill ${activeStatus==='未开课班级'?'active':''}" onclick="switchStatus('未开课班级')">未开课 <span class="cnt">${(ss['未开课班级']||{}).count||0}</span></button>
    </div>
  </div>

  <!-- KPI -->
  <div class="kpi-row">${renderKPIs(students)}</div>
  `;

  // 日数据趋势
  html+=renderTrends();

  // 未开课单独页面（不显示分档图表，因为未开课班级不参与续班率计算）
  if(activeStatus==='未开课班级'){
    html+=renderNotStartedTab();
    app.innerHTML=html;
    return;
  }

  // 分档图表（仅非未开课页面显示）
  html+=`
  <div class="binned-charts">
    <div class="binned-card">
      <h4>总分-续班率分档</h4>
      <div class="chart-box"><canvas id="chart-score-rr"></canvas></div>
    </div>
    <div class="binned-card">
      <h4>深聊质量-续班率分档</h4>
      <div class="chart-box"><canvas id="chart-dcq-rr"></canvas></div>
    </div>
    <div class="binned-card">
      <h4>深聊轮次-续班率分档</h4>
      <div class="chart-box"><canvas id="chart-dcr-rr"></canvas></div>
    </div>
  </div>
  `;

  html+=`
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab ${activeTab==='teacher'?'active':''}" onclick="switchTab('teacher')">教师排名</button>
    <button class="tab ${activeTab==='subject'?'active':''}" onclick="switchTab('subject')">学科组排名</button>
    ${subjects.map(s=>`<button class="tab ${activeTab==='subject_'+s?'active':''}" onclick="switchTab('subject_${s}')">${s}学情</button>`).join('')}
  </div>
  `;

  if(activeTab==='teacher')html+=renderTeacherTab(students);
  else if(activeTab==='subject')html+=renderSubjectTab(students);
  else if(activeTab.startsWith('subject_')){
    const subjName=activeTab.replace('subject_','');
    html+=renderSubjectStudentTab(subjName,getSubjectStudents(subjName));
  }

  html+=renderRules();
  html+=`<div class="formula-note">SA评级公式：进度比例 = min((数据日期-开课日期+1)/(结课日期-开课日期+1), 1.0) → 当天满分 = 进度比例×70+30 → S≥60%满分, A≥45%满分, B≥30%满分, C<30%满分 · 公式评级与系统评级100%匹配</div>`;

  app.innerHTML=html;
  renderCharts(students);
  renderBinnedCharts(students);
}

function renderKPIs(students){
  const orig=students.filter(s=>s.io==='是').length;
  const ren=students.filter(s=>s.ir==='是').length;
  const rr=orig?ren/orig*100:0;
  const scores=students.filter(s=>s.ts!=null).map(s=>s.ts);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const grades=students.filter(s=>s.sg);
  const sa=grades.filter(s=>s.sg==='S'||s.sg==='A').length;
  const saPct=grades.length?sa/grades.length*100:0;
  const teachers=new Set(students.map(s=>s.t)).size;

  return `
    <div class="kpi"><div class="label">入口教师人数</div><div class="val brand">${teachers}</div><div class="sub">人</div></div>
    <div class="kpi"><div class="label">学员人次</div><div class="val accent">${students.length}</div><div class="sub">原班 ${orig} · 续班 ${ren}</div></div>
    <div class="kpi"><div class="label">续班率</div><div class="val ${rr>=30?'green':rr>=15?'gold':'brand'}">${rr.toFixed(1)}%</div><div class="sub">续班${ren}/原班${orig}</div></div>
    <div class="kpi"><div class="label">平均总分</div><div class="val brand">${avg.toFixed(1)}</div><div class="sub">满分100</div></div>
    <div class="kpi"><div class="label">SA占比</div><div class="val ${saPct>=20?'green':saPct>=10?'gold':'brand'}">${saPct.toFixed(1)}%</div><div class="sub">S+A ${sa}人 / ${grades.length}人</div></div>
    <div class="kpi"><div class="label">S级学员</div><div class="val gold">${grades.filter(s=>s.sg==='S').length}</div><div class="sub">A级 ${grades.filter(s=>s.sg==='A').length}人</div></div>
  `;
}

function renderNotStartedTab(){
  const students=getNotStartedStudents();

  students.forEach(s=>{

  const teachers=Object.values(teacherMap).sort((a,b)=>b.count-a.count);

function computeBins(students,field,binSize,max){
  const bins=[];
  for(let lo=0;lo<max;lo+=binSize){
    const hi=lo+binSize;
    const inBin=students.filter(s=>{
      const v=s[field];
      return v!=null&&v>=lo&&v<hi;
    });
    const orig=inBin.filter(s=>s.io==='是').length;
    const ren=inBin.filter(s=>s.ir==='是').length;
    bins.push({
      label:`${lo}-${hi}分`,
      count:inBin.length,
      original:orig,
      renewal:ren,
      renewal_rate:orig?Math.round(ren/orig*1000)/10:0
    });
  }
  return bins;
}

function renderBinnedCharts(students){
  const textColor='#6e6e80';
  const gridColor='rgba(0,0,0,.05)';

  // 动态计算分档数据，随状态筛选实时更新
  const scoreBins=computeBins(students,'ts',10,100);
  const dcqBins=computeBins(students,'dcq',3,15);
  const dcrBins=computeBins(students,'dcr',5,45);

  function makeBinnedChart(canvasId,binData,color,label){
    const c=document.getElementById(canvasId);
    if(!c)return;
    chartInstances[canvasId]=new Chart(c,{
      data:{
        labels:binData.map(b=>b.label),
        datasets:[
          {type:'bar',label:'总人次',data:binData.map(b=>b.count),
            backgroundColor:color,borderRadius:4,yAxisID:'y'},
          {type:'line',label:'续班率',data:binData.map(b=>b.renewal_rate),
            borderColor:'#FF9500',backgroundColor:'rgba(255,149,0,.1)',

            pointBorderColor:'#fff',pointBorderWidth:1.5,
            tension:.3,yAxisID:'y1'}
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:true,position:'top',labels:{font:{size:10},boxWidth:12}}},
        scales:{
          y:{type:'linear',position:'left',grid:{color:gridColor},title:{display:true,text:'人次',font:{size:10}}},
          y1:{type:'linear',position:'right',grid:{display:false},
            title:{display:true,text:'续班率',font:{size:10}},
            ticks:{callback:v=>v+'%'}}
        },
        animation:{duration:200}
      },
      plugins:[{
        id:'binValLabels',
        afterDatasetsDraw(chart){
          const{ctx}=chart;
          chart.data.datasets[0].data.forEach((v,i)=>{
            const bar=chart.getDatasetMeta(0).data[i];
            ctx.save();ctx.fillStyle='#3d3d5c';ctx.font='10px FZDaBiaoSong';ctx.textAlign='center';

  makeBinnedChart('chart-score-rr',scoreBins,'rgba(0,122,255,.5)');

}

function openTeacherDetail(teacherName){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay show';
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};

  let students=DASHBOARD.all_students.filter(s=>s.t===teacherName);
  if(activeStatus!=='all'&&activeStatus!=='未开课班级')students=students.filter(s=>s.cs===activeStatus);

  const orig=students.filter(s=>s.io==='是').length;
  const ren=students.filter(s=>s.ir==='是').length;
  const rr=orig?ren/orig*100:0;
  const scores=students.filter(s=>s.ts!=null).map(s=>s.ts);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
  const grades=students.filter(s=>s.sg);
  const sa=grades.filter(s=>s.sg==='S'||s.sg==='A').length;

  overlay.innerHTML=`
    <div class="modal">
      <div class="modal-header">
        <div>
          <h3>${teacherName} · 学员明细</h3>
          <div style="font-size:.72rem;color:var(--text-2);margin-top:3px">
            人次 ${students.length} · 原班 ${orig} · 续班 ${ren} · 续班率 ${rr.toFixed(1)}% · 均分 ${avg.toFixed(1)} · SA ${sa}人
          </div>
        </div>
        <button class="close" onclick="this.closest('.modal-overlay').remove()">×</button>
      </div>
      <div class="modal-body">
        <div class="table-scroll" style="max-height:60vh">
          <table>
            <thead><tr>
              <th>标签</th><th>学员</th><th>科目</th><th>班级</th><th>状态</th><th>开课</th><th>结课</th>
              <th>总分</th><th>评级</th>
              <th>深聊质量</th><th>深聊轮次</th><th>服务卡</th><th>题目回收</th>
              <th>出勤率</th><th>进步感知</th><th>课次报告</th><th>连续在读</th>
              <th>原班</th><th>续班</th>
            </tr></thead>
            <tbody>
              ${students.map(s=>{
                const gs=s.sg&&s.fg&&s.sg===s.fg;
                const gh=gs?`<span class="grade grade-${s.sg}">${s.sg}</span>`
                  :`${s.sg?`<span class="grade grade-${s.sg}">${s.sg}</span>`:''}${s.fg&&s.fg!==s.sg?`<span class="grade grade-${s.fg}" style="margin-left:2px">${s.fg}</span>`:''}`;
                return `<tr>
                  <td class="tags-cell"><div class="tag-row">${renderTags(s.tags)}</div></td>
                  <td class="name-cell" style="font-weight:500">${s.n||'-'}</td>
                  <td>${s.s}</td>
                  <td style="font-size:.7rem;color:var(--text-2)">${s.cc||'-'}</td>
                  <td style="font-size:.72rem;color:var(--text-2)">${s.cs}</td>
                  <td style="font-size:.72rem;color:var(--text-2)">${s.sd||'-'}</td>
                  <td style="font-size:.72rem;color:var(--text-2)">${s.ed||'-'}</td>
                  <td class="num" style="font-weight:600">${s.ts!=null?s.ts.toFixed(1):'-'}</td>
                  <td>${gh||'-'}</td>
                  <td class="num">${s.dcq?s.dcq.toFixed(1):'-'}</td>
                  <td class="num">${s.dcr?s.dcr.toFixed(1):'-'}</td>
                  <td class="num">${s.svc?s.svc.toFixed(1):'-'}</td>
                  <td class="num">${s.qr?s.qr.toFixed(1):'-'}</td>
                  <td class="num">${s.att?s.att.toFixed(1):'-'}</td>
                  <td class="num">${s.pp?s.pp.toFixed(1):'-'}</td>
                  <td class="num">${s.cr?s.cr.toFixed(1):'-'}</td>
                  <td class="num">${s.cq?s.cq.toFixed(1):'-'}</td>
                  <td>${s.io==='是'?'<span style="color:var(--green)">✓</span>':'-'}</td>
                  <td>${s.ir==='是'?'<span style="color:var(--green)">✓</span>':'-'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function toggleDropdown(){
  const dd=document.getElementById('teacherDropdown');

function sortBy(col){
  if(sortCol===col){sortDir=sortDir==='asc'?'desc':'asc';}

// ============================================================
// 启动
// ============================================================
async function init(){
  try{
    DASHBOARD=await loadData();
    // 并行加载日数据历史（失败不阻塞主看板）
    try{DAILY_HISTORY=await loadHistory();}catch(e){console.warn('日数据历史加载失败:',e);}
    // 默认班级状态优先级：已开窗 → 已开课 → 已结课
    const ss=DASHBOARD.meta.status_stats;
    if((ss['已开窗班级']||{}).count>0)activeStatus='已开窗班级';
    else if((ss['已开课班级']||{}).count>0)activeStatus='已开课班级';
    else if((ss['已结课班级']||{}).count>0)activeStatus='已结课班级';
    else activeStatus='all';
    document.getElementById('app').innerHTML='';
    render();
  }catch(e){
    document.getElementById('loading').innerHTML=`
      <div style="text-align:center;padding:60px 20px">
        <p style="color:var(--red);font-size:1rem;font-weight:600">数据加载失败</p>
        <p style="color:var(--text-2);font-size:.82rem;margin-top:8px">${e.message}</p>
        <p style="color:var(--text-3);font-size:.72rem;margin-top:12px">请稍后刷新重试，或直接访问：<a href="chengdu_dashboard.json" style="color:var(--brand)">chengdu_dashboard.json</a> 检查数据文件是否存在</p>
        <button onclick="location.reload()" style="margin-top:16px;padding:8px 24px;border:1px solid var(--brand);border-radius:8px;background:var(--glass);color:var(--brand);cursor:pointer;font-family:var(--font)">重新加载</button>
      </div>`;
  }
}

init();
